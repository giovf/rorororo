<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Highlight Keep — Library</title><link rel="stylesheet" href="library.css" /></head>
  <body>
    <main>
      <header>
        <h1>Your highlights</h1>
        <div class="tools">
          <input id="q" type="search" placeholder="Search quotes, notes, tags, titles…" aria-label="Search" />
          <button id="export-all" type="button">Export all (Markdown)</button>
          <button id="backup" type="button">Backup (JSON)</button>
          <label class="file"><input id="restore" type="file" accept="application/json" />Restore</label>
          <label class="file" title="Super Simple Highlighter → Options → Advanced → Backup: pick the .ldjson file it saved"><input id="import-ssh" type="file" accept=".ldjson,.json,text/plain,application/json" />Import Super Simple Highlighter</label>
          <label class="file" title="Weava dashboard → export icon (top right) → .csv: pick the file it downloaded"><input id="import-weava" type="file" accept=".csv,text/csv,text/plain" />Import Weava</label>
        </div>
      </header>
      <p id="status" class="muted"></p>
      <div id="pages"></div>
    </main>
    <script src="library.js"></script>
  </body>
</html>
