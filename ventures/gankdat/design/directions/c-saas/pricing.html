<!-- @dsCard group="C — Clean SaaS" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C — Pricing</title>
<style>
:root{--bg:#fafbfd;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--card:#ffffff;--indigo:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(162px,1fr));gap:14px;max-width:880px}
.plan{border:1px solid var(--line);border-radius:18px;padding:22px 18px;background:var(--card);box-shadow:0 2px 10px rgba(15,23,42,.04);position:relative}
.plan.hot{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#4f46e5,#0ea5e9) border-box;border:2px solid transparent;box-shadow:0 12px 34px rgba(79,70,229,.16)}
.tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#4f46e5,#0ea5e9);color:#fff;font-size:.66rem;font-weight:700;padding:3px 12px;border-radius:999px;letter-spacing:.06em}
.name{font-weight:700;font-size:.92rem}
.price{font-size:1.85rem;font-weight:800;letter-spacing:-.04em;margin:10px 0 2px}
.price small{font-size:.85rem;color:var(--muted);font-weight:500}
.cr{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.btn{display:block;text-align:center;padding:10px 0;border-radius:11px;background:linear-gradient(135deg,var(--indigo),#6366f1);color:#fff;font-weight:600;text-decoration:none;font-size:.88rem;box-shadow:0 4px 12px rgba(79,70,229,.28)}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.trust{margin-top:20px;color:var(--muted);font-size:.85rem;display:flex;gap:22px;flex-wrap:wrap}
.trust span::before{content:"✓ ";color:#059669;font-weight:700}
</style>
</head>
<body>
  <div class="grid">
    <div class="plan"><div class="name">Free</div><div class="price">£0</div><div class="cr">250 credits / mo</div><a class="btn ghost" href="#">Sign in</a></div>
    <div class="plan"><div class="name">Saver</div><div class="price">£5<small>/mo</small></div><div class="cr">1,000 credits / mo</div><a class="btn ghost" href="#">Subscribe</a></div>
    <div class="plan hot"><span class="tag">MOST POPULAR</span><div class="name">Starter</div><div class="price">£23<small>/mo</small></div><div class="cr">5,000 credits / mo</div><a class="btn" href="#">Subscribe</a></div>
    <div class="plan"><div class="name">Growth</div><div class="price">£79<small>/mo</small></div><div class="cr">20,000 credits / mo</div><a class="btn ghost" href="#">Subscribe</a></div>
    <div class="plan"><div class="name">Scale</div><div class="price">£239<small>/mo</small></div><div class="cr">100,000 credits / mo</div><a class="btn ghost" href="#">Subscribe</a></div>
  </div>
  <div class="trust"><span>Cancel anytime</span><span>14-day make-it-right</span><span>Zero trackers</span></div>
</body>
</html>
