<!-- @dsCard group="A — Polished minimal" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A — Pricing</title>
<style>
:root{--bg:#ffffff;--fg:#15181e;--muted:#5c6572;--line:#e6e9ef;--card:#f7f8fa;--accent:#0b5fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--fg:#e9ebf0;--muted:#98a2b3;--line:#252b35;--card:#151a22;--accent:#5b8dff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:860px}
.plan{border:1px solid var(--line);border-radius:16px;padding:20px 18px;background:var(--card);position:relative}
.plan.hot{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 8px 30px color-mix(in srgb,var(--accent) 14%,transparent)}
.tag{position:absolute;top:-10px;right:14px;background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;padding:2px 10px;border-radius:999px;letter-spacing:.04em}
.name{font-weight:700;font-size:.95rem}
.price{font-size:1.7rem;font-weight:750;letter-spacing:-.03em;margin:8px 0 2px}
.price small{font-size:.85rem;color:var(--muted);font-weight:500}
.cr{color:var(--muted);font-size:.85rem;margin-bottom:14px}
.btn{display:block;text-align:center;padding:9px 0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.trust{margin-top:18px;color:var(--muted);font-size:.84rem;display:flex;gap:20px;flex-wrap:wrap}
.trust span::before{content:"✓ ";color:#16a34a;font-weight:700}
</style>
</head>
<body>
  <div class="grid">
    <div class="plan"><div class="name">Free</div><div class="price">£0</div><div class="cr">250 credits / mo</div><a class="btn ghost" href="#">Sign in</a></div>
    <div class="plan"><div class="name">Saver</div><div class="price">£5<small>/mo</small></div><div class="cr">1,000 credits / mo</div><a class="btn ghost" href="#">Subscribe</a></div>
    <div class="plan hot"><span class="tag">POPULAR</span><div class="name">Starter</div><div class="price">£23<small>/mo</small></div><div class="cr">5,000 credits / mo</div><a class="btn" href="#">Subscribe</a></div>
    <div class="plan"><div class="name">Growth</div><div class="price">£79<small>/mo</small></div><div class="cr">20,000 credits / mo</div><a class="btn ghost" href="#">Subscribe</a></div>
    <div class="plan"><div class="name">Scale</div><div class="price">£239<small>/mo</small></div><div class="cr">100,000 credits / mo</div><a class="btn ghost" href="#">Subscribe</a></div>
  </div>
  <div class="trust"><span>Cancel anytime</span><span>14-day make-it-right</span><span>Zero trackers</span></div>
</body>
</html>
