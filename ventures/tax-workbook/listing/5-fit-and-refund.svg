<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
<rect width="2000" height="1500" fill="#F4F7FB"/>
<text x="1000" y="150" font-size="92" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Is it right for you?</text>
<rect x="120" y="260" width="860" height="660" rx="24" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="3"/>
<rect x="120" y="260" width="16" height="660" rx="8" fill="#2E7D4F"/>
<text x="152" y="324" font-size="38" fill="#2E7D4F" font-weight="bold" text-anchor="start">Built for</text>
<text x="152" y="378" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Sole traders in England, Wales and Northern Ireland</text>
<text x="152" y="422" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">One business, not VAT-registered</text>
<text x="152" y="466" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Cash-basis records through the tax year</text>
<text x="152" y="510" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Excel 2010 or later, Google Sheets, LibreOffice, Numbers</text>
<text x="152" y="554" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Change a rate on Setup and every formula follows</text>
<rect x="1020" y="260" width="860" height="660" rx="24" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="3"/>
<rect x="1020" y="260" width="16" height="660" rx="8" fill="#A23B3B"/>
<text x="1052" y="324" font-size="38" fill="#A23B3B" font-weight="bold" text-anchor="start">Not for</text>
<text x="1052" y="378" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Not MTD-recognised filing software — it prepares the numbers</text>
<text x="1052" y="422" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Scottish Income Tax bands</text>
<text x="1052" y="466" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Partnerships, limited companies, VAT returns</text>
<text x="1052" y="510" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Student loan, savings, dividends, pension relief</text>
<text x="1052" y="554" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="start">Tax advice — check figures with HMRC or an accountant</text>
<rect x="120" y="980" width="1760" height="380" rx="24" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="3"/>
<text x="160" y="1050" font-size="38" fill="#1F3A5F" font-weight="bold" text-anchor="start">What you get</text>
<text x="160" y="1120" font-size="32" fill="#5A6675" font-weight="normal" text-anchor="start">One .xlsx file (about 1 MB), delivered instantly by Etsy after checkout. Open it in Excel, or import it into Google Sheets.</text>
<text x="160" y="1180" font-size="32" fill="#5A6675" font-weight="normal" text-anchor="start">Rates are the 2026/27 figures published on gov.uk, read October 2026, each with its source on the Setup tab.</text>
<text x="160" y="1270" font-size="32" fill="#1A1A1A" font-weight="bold" text-anchor="start">Refund policy: a replacement file or a full refund within 14 days if the file will not open on your device.</text>
<text x="160" y="1325" font-size="32" fill="#5A6675" font-weight="normal" text-anchor="start">One purchase, one licence for your own business records.</text>
</svg>