<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
<rect width="2000" height="1500" fill="#F4F7FB"/>
<text x="1000" y="150" font-size="92" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Fees from each platform's own rates</text>
<text x="1000" y="215" font-size="32" fill="#5A6675" font-weight="normal" text-anchor="middle">Read from eBay, Vinted, Depop and Etsy in November 2026</text>
<text x="1000" y="262" font-size="32" fill="#5A6675" font-weight="normal" text-anchor="middle">Change a rate once on Setup, or type the real fee on any sale</text>
<rect x="120" y="300" width="1760" height="600" rx="32" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="3"/>
<text x="200" y="430" font-size="42" fill="#1A1A1A" font-weight="bold" text-anchor="start">eBay</text><text x="1800" y="430" font-size="40" fill="#1A1A1A" font-weight="normal" text-anchor="end">12.9 % + £0.40 an order</text>
<text x="200" y="522" font-size="42" fill="#1A1A1A" font-weight="bold" text-anchor="start">Vinted</text><text x="1800" y="522" font-size="40" fill="#1A1A1A" font-weight="normal" text-anchor="end">no seller fee — the buyer pays</text>
<text x="200" y="614" font-size="42" fill="#1A1A1A" font-weight="bold" text-anchor="start">Depop</text><text x="1800" y="614" font-size="40" fill="#1A1A1A" font-weight="normal" text-anchor="end">2.9 % + £0.30 an order</text>
<text x="200" y="706" font-size="42" fill="#1A1A1A" font-weight="bold" text-anchor="start">Etsy</text><text x="1800" y="706" font-size="40" fill="#1A1A1A" font-weight="normal" text-anchor="end">10.98 % + £0.36 an order</text>
<text x="200" y="798" font-size="42" fill="#1A1A1A" font-weight="bold" text-anchor="start">Other / own website</text><text x="1800" y="798" font-size="40" fill="#1A1A1A" font-weight="normal" text-anchor="end">enter your own rate</text>
<rect x="120" y="960" width="1760" height="400" rx="32" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="3"/>
<text x="160" y="1020" font-size="36" fill="#1F3A5F" font-weight="bold" text-anchor="start">The worked example: a part-time reseller with a job</text>
<text x="200" y="1070" font-size="36" fill="#1A1A1A" font-weight="normal" text-anchor="start">Gross takings for the year</text><text x="1800" y="1070" font-size="36" fill="#1A1A1A" font-weight="normal" text-anchor="end">£12,000.00</text>
<text x="200" y="1142" font-size="36" fill="#1A1A1A" font-weight="normal" text-anchor="start">Stock, fees, postage, expenses, mileage</text><text x="1800" y="1142" font-size="36" fill="#1A1A1A" font-weight="normal" text-anchor="end">£7,275.00</text>
<rect x="160" y="1166" width="1680" height="66" rx="12" fill="#DDEBD3"/><text x="200" y="1214" font-size="36" fill="#1A1A1A" font-weight="bold" text-anchor="start">Taxable profit</text><text x="1800" y="1214" font-size="36" fill="#2E7D4F" font-weight="bold" text-anchor="end">£4,725.00</text>
<rect x="160" y="1238" width="1680" height="66" rx="12" fill="#DDEBD3"/><text x="200" y="1286" font-size="36" fill="#1A1A1A" font-weight="bold" text-anchor="start">Tax due after a £22,000.00 salary's PAYE</text><text x="1800" y="1286" font-size="36" fill="#2E7D4F" font-weight="bold" text-anchor="end">£945.00</text>
<text x="1000" y="1430" font-size="30" fill="#5A6675" font-weight="normal" text-anchor="middle">An estimate for planning — HMRC’s own calculation is the one you pay</text>
</svg>