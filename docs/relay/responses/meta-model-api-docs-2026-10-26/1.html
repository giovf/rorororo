t-c-fg-faint:0.011;--tint-h-fg-faint:257.84;--tint-c-fg-dim:0.01;--tint-h-fg-dim:259.59}</style><div lang="en-US" class="contents" data-slot="event-language"><script type="application/ld+json">{"@context":"https://schema.org","@type":["Event","Hackathon"],"name":"Meta Global AI Developer Hackathon","description":"Come and build the future of superintelligence. Ten days, access to our newest models and $1M in prizes. The Meta Global AI Developer Hackathon is virtual, worldwide and free to enter if selected. About the Hackathon Apply to spend ten days building with Meta's newest models. Use the Muse Spark series, Muse Wonder, Muse Image and SAM 3.1 through Meta Model API, run Meta open weights models, and code faster with Muse Code coding agent. Bring a problem you know firsthand, or an idea that feels out of reach. Build it with the models, learn from the Meta team and partners in live workshops, and compete for a share in the $1,000,000 cash prize pool across two tracks: one for indie developers and one for startups. Partners We have an amazing set of inference partners supporting the event: Baseten is offering $100 in credits and 2M TPM rate limits to select participants to use Meta's open-weights models. Modal is offering $100 in credits to select participants to use Meta's open-weights models through Endpoints in addition to their serverless GPUs, sandboxes, and tools for LLM training. Fireworks is offering $25 in credits to select participants to use Meta's open-weight models along with a workshop from Sinan Ozdemir Participant Tracks $1,000,000 in total prizes. Every project enters one track. Indie developer track: For individual builders and students. Judged on creativity, technical ambition, and whether it works. Startup track: For teams and founders building a real product. Judged on technical execution and whether it holds up in production. Project Themes Regardless of the track you choose, we’re looking for projects in two main themes: Build for Your World. Bring Meta's models into your domain. Solve a problem you know firsthand, free up time and mental space, and make something possible that wasn't before. Push the Frontier. Use Meta's models to tackle challenges in software, robotics, manufacturing, energy, materials and beyond. Give a machine a new capability, accelerate a scientific experiment, or unlock a better way to understand and control a physical system. Show us what becomes possible when these models meet the real world. Apply Now Apply to participate. Participation is limited to a maximum of 20,000 accepted applicants. Applications will be evaluated against the selection criteria below on a rolling basis. No further applications will be accepted or evaluated once the cap is reached. Organizers reserve the right, in their sole discretion, to close the application portal and end the application period immediately once the participant cap is satisfied, even if such date is prior to the posted Application Deadline. Early application is encouraged. Key Dates Oct 13, 9:00 AM ET: Applications open. Applications are reviewed, and applicants notified, on a rolling basis. Oct 25, 11:59 PM ET: Applications Deadline, or earlier if all 20,000 spots are filled. Oct 26, 9:00 AM ET: Applicant approval notification sent by this time Oct 26: Hackathon begins with kickoff livestream Oct 27 – Nov 4: Live workshops from Meta and partners, plus office hours on Discord Nov 4: Project submissions due by 9:00 PM ET Nov 4 – Nov 8: Judging Nov 9: Closing ceremony - live finals and winners announced *Dates may be subject to change at Meta’s sole discretion. Any change will be posted on this page. How Applications are Reviewed We aim for a mix of technical backgrounds and domains across participants. Applicants should best showcase their technical skills in the application form. We review every application against two criteria, using only your answers on the application form: Your project idea: how clear and feasible your proposed project is, and how well it fits one of the two project themes. Your technical skill: the technical skill shown in the AI project you describe, including what you built and the techniques you used. Links to your GitHub, LinkedIn or a shipped product help us verify your experience and skill but are not required. Both criteria are weighted equally. Applications are evaluated on a rolling basis. Eligible applications meeting minimum scoring cut-offs will be accepted automatically, up to the first 20,000 acceptances. Eligible applications that do not meet the minimum scoring cut-offs will be accepted based on score received, if space allows. Answers to questions 13 to 16 help us improve our developer programs and are not used in selection. Duplicate applications, false identity information or spam will be disqualified at Sponsor's sole discretion. Participation is limited to up to 20,000 selected applicants. Applications are reviewed on a rolling basis as they're received. Once spots are filled, the application will close. Duplicate applications, false identity information or spam will be disqualified at Sponsor’s sole discretion. Open worldwide, except in countries where local law prohibits participation or the receipt of an award. Void where prohibited by law. Individuals and/or Organizations that are (i) the target of any trade sanctions or export control restrictions administered or enforced by the U.S., EU, United Nations, or UK; (ii) acting on behalf of anyone else who is the target of such trade sanctions or export control restrictions; or (iii) organized or located in Belarus, China, Russia, Ukraine, Syria, or any country or region that is the target of comprehensive economic or financial sanctions (which are the Crimea, Donetsk, and Luhansk regions of Ukraine, Cuba, North Korea, Iran) are not eligible to participate. Employees, contractors, and interns of Meta and Cerebral Valley,government-affiliated individuals, and members of their immediate families (defined for these purposes as including spouse, domestic partner, parents, legal guardian, legal ward, children, and siblings and each of their respective spouses) and individuals living in the same household as such individuals, are not eligible. View Application Overview and Event Waiver Official Rules will be published before the Hackathon begins on October 26, 2026 and must be accepted by the selected participants.","url":"https://cerebralvalley.ai/e/meta-ai-developer-hackathon","startDate":"2026-10-26T17:00:00.000Z","endDate":"2026-11-05T02:00:00.000Z","eventStatus":"https://schema.org/EventScheduled","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://cerebralvalley.ai/e/meta-ai-developer-hackathon"},"image":["https://cerebralvalley.ai/api/e/og/meta-ai-developer-hackathon?v=1792998118711","https://cdn.cerebralvalley.ai/thumbnail-2026-10-13T16:12:19_166Z-upload"],"organizer":[{"@type":"Person","name":"Meta","url":"https://cerebralvalley.ai/u/meta"},{"@type":"Organization","name":"Cerebral Valley","url":"https://cerebralvalley.ai/u/cv"}],"performer":[{"@type":"Person","name":"Meta","url":"https://cerebralvalley.ai/u/meta"},{"@type":"PerformingGroup","name":"Cerebral Valley","url":"https://cerebralvalley.ai/u/cv"}],"keywords":"AI hackathon, hackathon","isAccessibleForFree":true,"offers":{"@type":"Offer","url":"https://cerebralvalley.ai/e/meta-ai-developer-hackathon","price":0,"priceCurrency":"USD","availability":"https://schema.org/SoldOut","validFrom":"2026-09-16T22:58:22.774Z","validThrough":"2026-11-05T02:00:00.000Z"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Events","item":"https://cerebralvalley.ai/events"},{"@type":"ListItem","position":2,"name":"Online & Remote","item":"https://cerebralvalley.ai/events/remote"},{"@type":"ListItem","position":3,"name":"Meta Global AI Developer ies, Muse Wonder, Muse Image and SAM 3.1 through Meta Model API, run Meta open weights models, and code faster with Muse Code coding agent.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Bring a problem you know firsthand, or an idea that feels out of reach. Build it with the models, learn from the Meta team and partners in live workshops, and compete for a share in the \"},{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"$1,000,000 \"},{\"type\":\"text\",\"text\":\"cash prize pool across two tracks: one for indie developers and one for startups.\"}]},{\"type\":\"heading\",\"attrs\":{\"level\":3},\"content\":[{\"type\":\"text\",\"text\":\"Partners\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"We have an amazing set of inference partners supporting the event:\"}]},{\"type\":\"bulletList\",\"attrs\":{\"tight\":true},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"href\":\"https://www.baseten.co/\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer nofollow\",\"class\":\"text-muted-fg underline underline-offset-[3px] hover:text-primary transition-colors cursor-pointer\"}},{\"type\":\"bold\"}],\"text\":\"Baseten\"},{\"type\":\"text\",\"text\":\" is offering $100 in credits and 2M TPM rate limits to select participants to use Meta's open-weights models.\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"href\":\"https://modal.com/\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer nofollow\",\"class\":\"text-muted-fg underline underline-offset-[3px] hover:text-primary transition-colors cursor-pointer\"}},{\"type\":\"bold\"}],\"text\":\"Modal\"},{\"type\":\"text\",\"text\":\" is offering $100 in credits to select participants to use Meta's open-weights models through \"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\ ":{\"href\":\"https://www.linkedin.com/in/sinan-ozdemir/\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer nofollow\",\"class\":\"hv4ga7 hv4gnd hv4lsh hv4lsg hv4jqg hv4jxk hv4j4o hv4kbs hv4su hv4f6r hv4k0p hv4anj\"}},{\"type\":\"bold\"}],\"text\":\"Sinan Ozdemir\"}]}]}]},{\"type\":\"heading\",\"attrs\":{\"level\":3},\"content\":[{\"type\":\"text\",\"text\":\"Participant Tracks\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"$1,000,000 in total prizes\"},{\"type\":\"text\",\"text\":\". Every project enters one track.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Indie developer track: \"},{\"type\":\"text\",\"text\":\"For individual builders and students. Judged on creativity, technical ambition, and whether it works.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Startup track: \"},{\"type\":\"text\",\"text\":\"For teams and founders building a real product. Judged on technical execution and whether it holds up in production.\"}]},{\"type\":\"heading\",\"attrs\":{\"level\":3},\"content\":[{\"type\":\"text\",\"text\":\"Project Themes\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Regardless of the track you choose, we’re looking for projects in two main themes:\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Build for Your World.\"},{\"type\":\"text\",\"text\":\" Bring Meta's models into your domain. Solve a problem you know firsthand, free up time and mental space, and make something possible that wasn't before.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Push the Frontier.\"},{\"type\":\"text\",\"text\":\" Use Meta's models to tackle challenges in software, robotics, manufacturing, energy, materials and beyond. Give a machine a new capability, accelerate a scientific experiment, or unlock a better way to understand and control a physical system. Show us what becomes possible when these models meet the real world.\"}]},{\"type\":\"heading\",\"attrs\":{\"level\":3},\"content\":[{\"type\":\"text\",\"text\":\"Apply Now\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"},{\"type\":\"italic\"}],\"text\":\"Apply to participate. Participation is limited to a maximum of 20,000 accepted applicants. Applications will be evaluated against the selection criteria below on a rolling basis. No further applications will be accepted or evaluated once the cap is reached. Organizers reserve the right, in their sole discretion, to close the application portal and end the application period immediately once the participant cap is satisfied, even if such date is prior to the posted Application Deadline. Early application is encouraged. \"}]},{\"type\":\"heading\",\"attrs\":{\"level\":3},\"content\":[{\"type\":\"text\",\"text\":\"Key Dates\"}]},{\"type\":\"bulletList\",\"attrs\":{\"tight\":false},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Oct 13, 9:00 AM ET: Applications open. Applications are reviewed, and applicants notified, on a rolling basis.\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Oct 25, 11:59 PM ET: Applications Deadline, or earlier if all 20,000 spots are filled.\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Oct 26, 9:00 AM ET: Applicant approval notification sent by this time\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Oct 26: Hackathon begins with kickoff livestream\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Oct 27 – Nov 4: Live workshops from Meta and partners, plus office hours on Discord\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Nov 4: Project submissions due by 9:00 PM ET\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Nov 4 – Nov 8: Judging\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Nov 9: Closing ceremony - live finals and winners announced\"}]}]}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"*Dates may be subject to change at Meta’s sole discretion. Any change will be posted on this page.\"}]},{\"type\":\"heading\",\"attrs\":{\"level\":3},\"content\":[{\"type\":\"text\",\"text\":\"How Applications are Reviewed\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"We aim for a mix of technical backgrounds and domains across participants. Applicants should best showcase their technical skills in the application form. \"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"We review every application against two criteria, using only your answers on the application form:\"}]},{\"type\":\"orderedList\",\"attrs\":{\"tight\":false,\"start\":1,\"type\":null},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Your project idea: how clear and feasible your proposed project is, and how well it fits one of the two project themes.\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Your technical skill: the technical skill shown in the AI project you describe, including what you built and the techniques you used. Links to your GitHub, LinkedIn or a shipped product help us verify your experience and skill but are not required.\"}]}]}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Both criteria are weighted equally. Applications are evaluated on a rolling basis. Eligible applications meeting minimum scoring cut-offs will be accepted automatically, up to the first 20,000 acceptances. Eligible applications that do not meet the minimum scoring cut-offs will be accepted based on score received, if space allows.  Answers to questions 13 to 16 help us improve our developer programs and are not used in selection.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Duplicate applications, false identity information or spam will be disqualified at Sponsor's sole discretion.\"}]},{\"type\":\"bulletList\",\"attrs\":{\"tight\":false},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"},{\"type\":\"italic\"}],\"text\":\"Participation is limited to up to 20,000 selected applicants. Applications are reviewed on a rolling basis as they're received. Once spots are filled, the application will close.\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Duplicate applications, false identity information or spam will be disqualified at Sponsor’s sole discretion. \"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Open worldwide, except in countries where local law prohibits participation or the receipt of an award. Void where prohibited by law. Individuals and/or Organizations that are (i) the target of any trade sanctions or export control restrictions administered or enforced by the U.S., EU, United Nations, or UK; (ii) acting on behalf of anyone else who is the target of such trade sanctions or export control restrictions; or (iii) organized or located in Belarus, China, Russia, Ukraine, Syria, or any country or region that is the target of comprehensive economic or financial sanctions (which are the Crimea, Donetsk, and Luhansk regions of Ukraine, Cuba, North Korea, Iran) are not eligible to participate.  \"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Employees, contractors, and interns of Meta and Cerebral Valley,government-affiliated individuals, and members of their immediate families (defined for these purposes as including spouse, domestic partner, parents, legal guardian, legal ward, children, and siblings and each of their respective spouses) and individuals living in the same household as such individuals, are not eligible. \"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"href\":\"https://cerebralvalley.ai/e/meta-ai-developer-hackathon/waiver\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer nofollow\",\"class\":\"text-muted-fg underline underline-offset-[3px] hover:text-primary transition-colors cursor-pointer\"}}],\"text\":\"View Application Overview and Event Waiver\"}]}]}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"italic\"}],\"text\":\"Official Rules will be published before the Hackathon begins on October 26, 2026 and must be accepted by the selected participants.\"}]}]}"])</script><script>self.__next_f.push([1,"36:T6e5e,"])</script><script>self.__next_f.push([1,"{\"type\":\"doc\",\"content\":[{\"type\":\"heading\",\"attrs\":{\"level\":2},\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Hackathon Terms \u0026 Conditions (“Official Rules”) and Event Waiver\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"No purchase necessary to participate in this Hackathon. A purchase will not increase your chances of winning. Participation does not constitute an offer to buy Meta products or services. Void where prohibited by law. \"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Important:\"},{\"type\":\"text\",\"text\":\" Please read these Official Rules, which are a contract, carefully. Without limitation, this contract includes indemnities to Organizers from you and a limitation of your rights and remedies. By participating, you agree to be bound by these Official Rules and represent that you satisfy all of the eligibility requirements. \"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"All individuals interested in attending the Meta Global AI Developer Hackathon (the “Hackthon”) must complete, submit an application through the official application process, and be accepted. Applications must be submitted by October 25, 2026 at 11:59PM EST to be considered for participation in the virtual Hackathon – participation is virtual only. \"},{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"},{\"type\":\"italic\"}],\"text\":\"Participation is limited to a maximum of 20,000 accepted applicants. Applications will be reviewed on a rolling basis as they're received. Once spots are filled, the application will close. \"},{\"type\":\"text\",\"text\":\"All fields in the event application form must be completed accurately and truthfully. Incomplete or false information may result in disqualification. \"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Submission of an application does not guarantee attendance at the Hackathon. The Organizers reserve the right to change or cancel the Hackathon at any time.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Event Overview\"}]},{\"type\":\"bulletList\",\"attrs\":{\"tight\":false},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Participants build with Meta AI products, including Muse Spark, Glimmer, SAM 3, and any other Meta AI products identified on the Event page.\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Participants selected to participate in the Hackathon will receive $150 ide by these Hackathon Official Rules. \"}]},{\"type\":\"bulletList\",\"attrs\":{\"tight\":false},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Indie Developer track.\"},{\"type\":\"text\",\"text\":\" Open to individual builders and students, teams of up to four (4), subject to the eligibility requirements below. Each team’s Representative must submit the project on behalf of the team. The Representative shall identify all other team members in the project submission. \"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Startup track.\"},{\"type\":\"text\",\"text\":\" Open to technical founders building a product. The startup Representative must be an active employee of the startup and duly authorized designated individual to receive notices and prize payment on behalf of the startup. \"}]}]}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"If selected to participate in the Hackathon, finalists will receive prizes in U.S. dollars, at Organizer’s sole discretion. Prizes are awarded only after eligibility verification and compliance with these Official Rules. These prizes may include:\"}]},{\"type\":\"bulletList\",\"attrs\":{\"tight\":false},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Indie Developer Track, total $400,000:\"}]},{\"type\":\"bulletList\",\"attrs\":{\"tight\":false},\"content\":[{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"1st Prize: $150,000\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"2nd Prize: $100,000\"}]}]},{\"type\":\"listItem\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"3rd ritorial, provincial, prefectural, and/or other applicable taxes arising from participation in the Hackathon or the award of any Prizes as may be required by applicable tax authorities in the jurisdiction in which the winning Participant(s) is located. Winners may need to provide tax forms (e.g., W-9 for U.S. residents, W-8BEN for non-U.S. residents) or other documentation to comply with applicable withholding and reporting requirements. Winners are responsible for foreign exchange and banking compliance in their jurisdiction and for reporting the receipt of any Prize to relevant authorities. Organizers will not have liability with respect to any disputes that may arise among team or startups participants regarding the Prize allocation among the members of a winning team.  \"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Code of Conduct and Right to Refuse Participation\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Participants agree to conduct themselves in a professional, respectful, considerate, mindful, and inclusive manner in all virtual spaces associated with the Hackathon, including chat platforms, video calls, forums, and shared repositories.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The Organizers reserve the right, in their sole discretion, to suspend, remove, or disqualify any participant whose behavior is disruptive, abusive, discriminatory, demeaning, or otherwise inconsistent with the spirit of the Hackathon, without liability, including, without limitation, participants whose actions are meant to intimidate or engage in harassment.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Privacy Policy\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Personal information may be collected during the event application process. By registering, participants consent to the coll rs supporting the event: Baseten is offering $100 in credits and 2M TPM rate limits to select participants to use Meta's open-weights models. Modal is offering $100 in credits to select participants to use Meta's open-weights models through Endpoints in addition to their serverless GPUs, sandboxes, and tools for LLM training. Fireworks is offering $25 in credits to select participants to use Meta's open-weight models along with a workshop from Sinan Ozdemir Participant Tracks $1,000,000 in total prizes. Every project enters one track. Indie developer track: For individual builders and students. Judged on creativity, technical ambition, and whether it works. Startup track: For teams and founders building a real product. Judged on technical execution and whether it holds up in production. Project Themes Regardless of the track you choose, we’re looking for projects in two main themes: Build for Your World. Bring Meta's models into your domain. Solve a problem you know firsthand, free up time and mental space, and make something possible that wasn't before. Push the Frontier. Use Meta's models to tackle challenges in software, robotics, manufacturing, energy, materials and beyond. Give a machine a new capability, accelerate a scientific experiment, or unlock a better way to understand and control a physical system. Show us what becomes possible when these models meet the real world. Apply Now Apply to participate. Participation is limited to a maximum of 20,000 accepted applicants. Applications will be evaluated against the selection criteria below on a rolling basis. No further applications will be accepted or evaluated once the cap is reached. Organizers reserve the right, in their sole discretion, to close the application portal and end the application period immediately once the participant cap is satisfied, even if such date is prior to the posted Application Deadline. Early application is encouraged. Key Dates Oct 13, 9:00 AM ET: Applications open. Applications are reviewed, and applicants notified, on a rolling basis. Oct 25, 11:59 PM ET: Applications Deadline, or earlier if all 20,000 spots are filled. Oct 26, 9:00 AM ET: Applicant approval notification sent by this time Oct 26: Hackathon begins with kickoff livestream Oct 27 – Nov 4: Live workshops from Meta and partners, plus office hours on Discord Nov 4: Project submissions due by 9:00 PM ET Nov 4 – Nov 8: Judging Nov 9: Closing ceremony - live finals and winners announced *Dates may be subject to change at Meta’s sole discretion. Any change will be posted on this page. How Applications are Reviewed We aim for a mix of technical backgrounds and domains across participants. Applicants should best showcase their technical skills in the application form. We review every application against two criteria, using only your answers on the application form: Your project idea: how clear and feasible your proposed project is, and how well it fits one of the two project themes. Your technical skill: the technical skill shown in the AI project you describe, including what you built and the techniques you used. Links to your GitHub, LinkedIn or a shipped product help us verify your experience and skill but are not required. Both criteria are weighted equally. Applications are evaluated on a rolling basis. Eligible applications meeting minimum scoring cut-offs will be accepted automatically, up to the first 20,000 acceptances. Eligible applications that do not meet the minimum scoring cut-offs will be accepted based on score received, if space allows. Answers to questions 13 to 16 help us improve our developer programs and are not used in selection. Duplicate applications, false identity information or spam will be disqualified at Sponsor's sole discretion. Participation is limited to up to 20,000 selected applicants. Applications are reviewed on a rolling basis as they're received. Once spots are filled, the application will close. Duplicate applications, false identity information or spam will be disqualified at Sponsor’s sole discretion. Open worldwide, except in countries where local law prohibits participation or the receipt of an award. Void where prohibited by law. Individuals and/or Organizations that are (i) the target of any trade sanctions or export control restrictions administered or enforced by the U.S., EU, United Nations, or UK; (ii) acting on behalf of anyone else who is the target of such trade sanctions or export control restrictions; or (iii) organized or located in Belarus, China, Russia, Ukraine, Syria, or any country or region that is the target of comprehensive economic or financial sanctions (which are the Crimea, Donetsk, and Luhansk regions of Ukraine, Cuba, North Korea, Iran) are not eligible to participate. Employees, contractors, and interns of Meta and Cerebral Valley,government-affiliated individuals, and members of their immediate families (defined for these purposes as including spouse, domestic partner, parents, legal guardian, legal ward, children, and siblings and each of their respective spouses) and individuals living in the same household as such individuals, are not eligible. View Application Overview and Event Waiver Official Rules will be published before the Hackathon begins on October 26, 2026 and must be accepted by the selected participants.\",\"url\":\"https://cerebralvalley.ai/e/meta-ai-developer-hackathon\",\"startDate\":\"2026-10-26T17:00:00.000Z\",\"endDate\":\"2026-11-05T02:00:00.000Z\",\"eventStatus\":\"https://schema.org/EventScheduled\",\"eventAttendanceMode\":\"https://schema.org/OnlineEventAttendanceMode\",\"location\":{\"@type\":\"VirtualLocation\",\"url\":\"https://cerebralvalley.ai/e/meta-ai-developer-hackathon\"},\"image\":[\"https://cerebralvalley.ai/api/e/og/meta-ai-developer-hackathon?v=1792998118711\",\"https://cdn.cerebralvalley.ai/thumbnail-2026-10-13T16:12:19_166Z-upload\"],\"organizer\":[{\"@type\":\"Person\",\"name\":\"Meta\",\"url\":\"https://cerebralvalley.ai/u/meta\"},{\
