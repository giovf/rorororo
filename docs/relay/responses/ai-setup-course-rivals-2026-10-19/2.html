signer, auth-implementer, db-schema-architect, nextjs-architect, react-component-builder, sql-optimizer, docker-builder, ci-cd-engineer, release-manager, and more\u003c/p\u003e\u003cp\u003e- 12 slash commands - /plan, /scaffold, /review, /test, /debug, /refactor, /optimize, /audit-security, /document, /commit, /pr, /ship\u003c/p\u003e\u003cp\u003e- 5 ready-to-use CLAUDE.md templates - Next.js, Python, Node API, monorepo, React Native (with real build/test commands and always/never rules)\u003c/p\u003e\u003cp\u003e- MCP configs - Filesystem, Memory, Sequential-Thinking, Playwright browser (.mcp.json examples + setup guide; all on maintained servers, verified 2026-06)\u003c/p\u003e\u003cp\u003e- Safety + format hooks (bash + Windows PowerShell) - auto-format on save, block dangerous commands (rm -rf / Remove-Item -Recurse -Force), pre-commit lint\u003c/p\u003e\u003cp\u003e- 4 workflow playbooks - feature-to-PR, safe refactor, bug fix, release\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWHY YOU&#39;LL LOVE IT:\u003c/p\u003e\u003cp\u003e- Stack-agnostic - works with any language or framework, in any repo\u003c/p\u003e\u003cp\u003e- Built on real best practices, not generic prompts - each agent has a focused workflow and output format\u003c/p\u003e\u003cp\u003e- Plain Markdown/JSON you can read and edit to fit your project\u003c/p\u003e\u003cp\u003e- A START HERE QUICKSTART gets you running in 5 minutes; FAQ and per-folder READMEs cover the rest\u003c/p\u003e\u003cp\u003e- Instant download - nothing ships\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStop configuring and start shipping. Drop in the agents and commands, run /review, and feel the difference on your very next commit.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e(Single-user commercial license - use it on all your own projects. Please do not res\u003c/p\u003e\u003cfigure\u003e\u003cimg src=\&quot;https://public-files.gumroad.com/z5geomy69uyqlf
