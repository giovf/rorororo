s.gumroad.com/qyck2ms9e5no8qdj11l7b5towhfb&quot;,&quot;thumbnail&quot;:null,&quot;id&quot;:&quot;abfd80dd37638c06c497a16b5ba45eba&quot;,&quot;type&quot;:&quot;image&quot;,&quot;filetype&quot;:&quot;jpg&quot;,&quot;width&quot;:670,&quot;height&quot;:373,&quot;native_width&quot;:2752,&quot;native_height&quot;:1536}],&quot;main_cover_id&quot;:&quot;abfd80dd37638c06c497a16b5ba45eba&quot;,&quot;thumbnail_url&quot;:&quot;https://public-files.gumroad.com/1vci9s5r6gbpry23kh38wwu0qhmw&quot;,&quot;quantity_remaining&quot;:null,&quot;long_url&quot;:&quot;https://yurukusa.gumroad.com/l/cc-codex-ops-kit&quot;,&quot;is_sales_limited&quot;:false,&quot;ratings&quot;:{&quot;count&quot;:0,&quot;average&quot;:0.0,&quot;percentages&quot;:[0,0,0,0,0]},&quot;seller_reputation&quot;:null,&quot;custom_button_text_option&quot;:null,&quot;is_compliance_blocked&quot;:false,&quot;is_published&quot;:true,&quot;is_stream_only&quot;:false,&quot;streamable&quot;:false,&quot;sales_count&quot;:null,&quot;summary&quot;:&quot;6 hooks + 5 templates + 9 scripts for autonomous Claude Code.&quot;,&quot;attributes&quot;:[{&quot;name&quot;:&quot;One-command install&quot;,&quot;value&quot;:&quot;Run install.sh — production-ready in 15 minutes&quot;},{&quot;name&quot;:&quot;3 exclusive safety tools&quot;,&quot;value&quot;:&quot;Watchdog, CLAUDE.md generator, risk-score — not in the free version&quot;}],&quot;description_html&quot;:&quot;\u003cp\u003e\u003cstrong\u003e2026-05-26 update. The \&quot;delete files, push to wrong branches, burn context\&quot; failure family this kit defends against just received its cleanest articulation in #60226. Power user @suwayama mapped the structure: the model identifies a constraint or unverified premise, articulates it in writing, then proceeds with the constraint-violating action anyway. Four reproductions in one session, plus a cross-product reproduction on Claude Desktop. The 910 example hooks in this kit work because they install gating at the tool layer, where the runtime — not the model — decides whether the side-effect ships. Recognition reachable, runtime arresting.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eClaude Code Ops Kit — 910 example hooks + 56 CLI commands. 261 test files. Production-ready in 30 seconds.\u003c/p\u003e\u003cp\u003eAutonomous Claude Code sessions can delete files, push to wrong branches, and burn context without warning. One user lost C:\\Users to rm -rf. Another pushed to main at 3am.\u003c/p\u003e\u003cp\u003eThis kit prevents both. Deploy in 15 minutes.\u003c/p\u003e\u003cp\u003eWhat&#39;s included:\u003c/p\u003e\u003cp\u003e- 6 production hooks: context monitor, syntax check, decision warn, decision record, no-ask-human, activity logger\u003c/p\u003e\u003cp\u003e- 5 templates: CLAUDE.md, mission.md, task-queue.yaml, settings.json (2 presets)\u003c/p\u003e\u003cp\u003e- 9 operational scripts: watchdog, stabilizer, pair programming, task queue, and more\u003c/p\u003e\u003cp\u003e- 2 guides: setup + troubleshooting\u003c/p\u003e\u003cp\u003eWhy pay when hooks are free on GitHub?\u003c/p\u003e\u003cp\u003eThe free repo (cc-safe-setup) gives you 8 built-in safety hooks and 348 examples.\u003c/p\u003e\u003cp\u003eThis Ops Kit adds operational infrastructure: templates, scripts, and guides for running Claude Code autonomously 24/7.\u003c/p\u003e\u003cp\u003e$0+ (pay what you want). Get it free, pay later if it helps.\u003c/p\u003e\u003cp\u003eNot sure you need this? Run the free safety diagnostic first: \u003ca href=\&quot;https://github.com/yurukusa/cc-health-check\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://github.com/yurukusa/cc-health-check\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eNEW: monthly signal\u003c/strong\u003e — \u003ca href=\&quot;https://ko-fi.com/yurukusa\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003eCC Safety Lab Founder (¥500/mo Ko-fi Membership)\u003c/a\u003e. Each month: 3–5 curated Claude Code incidents (with fixes), 1 new safety hook, 1 measured token-saving tip. Founder price locked for charter members. Issue #1 ships 2026-05-01.\u003c/p\u003e\u003cp\u003eAlso from yurukusa on Gumroad:\u003c/p\u003e\u003cp\u003eToken Book (English Edition) — everyday token optimization for Claude Code Max/Pro users. 48 diagnostic symptoms plus copy-paste hooks for cache ratio, context budget, and subagent burn. Built from 800 hours of autonomous operation. \u003ca href=\&quot;https://yurukusa.gumroad.com/l/azrdt\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://yurukusa.gumroad.com/l/azrdt\u003c/a\u003e\u003c/p\u003e\u003cp\u003eComplete Survival Kit — the bigger bundle if you want the hook library and the token optimization playbook together in one download. \u003ca href=\&quot;https://yurukusa.gumroad.com/l/poqhoo\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://yurukusa.gumroad.com/l/poqhoo\u003c/a\u003e\u003c/p\u003e\u003cp\u003eComing 2026-05-05: Claude Code Incident Postmortems ($29). Ten forensic writeups — cache TTL regression, Opus 4.7 tokenizer 1.46x inflation, silent model migration, weekly quota reset cluster, extractMemories double cache, and more. Each incident ships with a copy-paste detection hook. 96-page PDF. Watch \u003ca href=\&quot;https://yurukusa.gumroad.com\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://yurukusa.gumroad.com\u003c/a\u003e for the drop.\u003c/p\u003e\u003cp\u003e---\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMore from yurukusa\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIf you want the reasoning behind the hooks rather than the hooks themselves, or you want to audit your existing Claude Code spend before buying anything else, these are the companion products. All ship from the same hands as the Ops Kit.\u003c/p\u003e\u003cp\u003e• Token Book — The Rules and Exceptions for Claude Code Token Budgeting ($12): \u003ca href=\&quot;https://yurukusa.gumroad.com/l/azrdt\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://yurukusa.gumroad.com/l/azrdt\u003c/a\u003e — 48 documented token-waste symptoms, each with diagnosis and fix. Every number from a real quota log.\u003c/p\u003e\u003cp\u003e• Claude Code Incident Postmortems ($29, ships 2026-05-05) — 10 reverse-engineered production failures from GitHub Issues and 800 hours of logs. The Ops Kit prevents incidents; this book diagnoses them. Appendix B references the same hook catalog.\u003c/p\u003e\u003cp\u003e• Complete Survival Kit ($39): \u003ca href=\&quot;https://yurukusa.gumroad.com/l/poqhoo\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://yurukusa.gumroad.com/l/poqhoo\u003c/a\u003e — Token Book EN + Safety Mastery + supporting hooks bundled. Saves $10 vs buying individually.\u003c/p\u003e\u003cp\u003e• Claude Code \u003ca href=\&quot;http://CLAUDE.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003eCLAUDE.md\u003c/a\u003e Templates Pack: \u003ca href=\&quot;https://yurukusa.gumroad.com/l/iaple\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://yurukusa.gumroad.com/l/iaple\u003c/a\u003e — Five production-tested \u003ca href=\&quot;http://CLAUDE.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003eCLAUDE.md\u003c/a\u003e templates for autonomous / safety-first / token-efficient / team-shared / minimal setups.\u003c/p\u003e\u003cp\u003e• Zenn Books (Japanese): \u003ca href=\&quot;https://zenn.dev/yurukusa/books\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ehttps://zenn.dev/yurukusa/books\u003c/a\u003e — Five Japanese-language books covering Safety incidents, autonomous operations, Claude Code Skills, operat
