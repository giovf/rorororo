nal_url&quot;:&quot;https://public-files.gumroad.com/bbpcb6bihr480wovwavfu8pi91me&quot;,&quot;thumbnail&quot;:null,&quot;id&quot;:&quot;2138793963a7ac7d04a2ebb9216c3d86&quot;,&quot;type&quot;:&quot;image&quot;,&quot;filetype&quot;:&quot;png&quot;,&quot;width&quot;:670,&quot;height&quot;:376,&quot;native_width&quot;:1280,&quot;native_height&quot;:720}],&quot;main_cover_id&quot;:&quot;2138793963a7ac7d04a2ebb9216c3d86&quot;,&quot;thumbnail_url&quot;:null,&quot;quantity_remaining&quot;:null,&quot;long_url&quot;:&quot;https://alphaletgo.gumroad.com/l/agentic-coding-kit&quot;,&quot;is_sales_limited&quot;:false,&quot;ratings&quot;:{&quot;count&quot;:0,&quot;average&quot;:0.0,&quot;percentages&quot;:[0,0,0,0,0]},&quot;seller_reputation&quot;:null,&quot;custom_button_text_option&quot;:null,&quot;is_compliance_blocked&quot;:false,&quot;is_published&quot;:true,&quot;is_stream_only&quot;:false,&quot;streamable&quot;:false,&quot;sales_count&quot;:null,&quot;summary&quot;:&quot;Drop-in CLAUDE.md, subagents, slash commands, hooks \u0026 MCP configs that make your AI coding agent act like a senior engineer.&quot;,&quot;attributes&quot;:[{&quot;name&quot;:&quot;Size&quot;,&quot;value&quot;:&quot;19.1 KB&quot;}],&quot;description_html&quot;:&quot;\u003cp\u003e**Your AI coding agent is only as good as its config. Most people never set one up.**\u003c/p\u003e\u003cp\u003eClaude Code and Cursor are incredible — when they know your conventions, edit the right files, and\u003c/p\u003e\u003cp\u003everify their own work. Out of the box, they don&#39;t. You end up repeating yourself, fixing the same\u003c/p\u003e\u003cp\u003emistakes, and watching them hallucinate structure that doesn&#39;t exist.\u003c/p\u003e\u003cp\u003eThis kit is the config a senior engineer would write — ready to drop in.\u003c/p\u003e\u003cp\u003e**What&#39;s inside (30+ files):**\u003c/p\u003e\u003cp\u003e- 🧩 **`\u003ca target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot; href=\&quot;http://CLAUDE.md\&quot;\u003eCLAUDE.md\u003c/a\u003e` + \u003ccode\u003e.cursorrules\u003c/code\u003e templates** for Next.js, Python/FastAPI, Go, Rust, and monorepos —\u003c/p\u003e\u003cp\u003e  architecture rules, conventions, commands, and clear \&quot;do NOT do this\&quot; guards.\u003c/p\u003e\u003cp\u003e- 🤖 **4 ready-to-use subagents:** code-reviewer, test-writer, debugger, doc-writer.\u003c/p\u003e\u003cp\u003e- ⚡ **Slash commands:** \u003ccode\u003e/review\u003c/code\u003e, \u003ccode\u003e/ship\u003c/code\u003e, \u003ccode\u003e/test\u003c/code\u003e, \u003ccode\u003e/explain\u003c/code\u003e.\u003c/p\u003e\u003cp\u003e- 🪝 **Hook recipes:** auto-format on edit, block committed secrets, run tests when the agent stops.\u003c/p\u003e\u003cp\u003e- 🔌 **MCP setups:** Postgres, GitHub, filesystem, web fetch — copy, paste, done.\u003c/p\u003e\u003cp\u003e**Why it&#39;s worth it:**\u003c/p\u003e\u003cp\u003e- Built by people who use these tools every day — not AI-generated filler.\u003c/p\u003e\u003cp\u003e- Every file has a header comment explaining what it does and the 2-3 lines you need to edit.\u003c/p\u003e\u003cp\u003e- Works with both Claude Code and Cursor.\u003c/p\u003e\u003cp\u003e- Free updates for life. New stacks added over time.\u003c/p\u003e\u003cp\u003e**Setup takes 5 minutes:** pick your stack, copy the template to your repo, edit 3 lines, drop the\u003c/p\u003e\u003cp\u003eagents/commands into \u003ccode\u003e.claude/\u003c/code\u003e. That&#39;s it.\u003c/p\u003e&quot;,&quot;currency_code&quot;:&quot;usd&quot;,&quot;price_cents&quot;:900,&quot;buyer_currency_display&quot;:{&quot;product_id&quot;:&quot;3kmE9srXBpLMc4Eg-ziPGQ==&quot;,&quot;buyer_currency_shown&quot;:&quot;usd&quot;,&quot;product_currency&quot;:&quot;usd&quot;,&quot;buyer_local_price_cents&quot;:null,&quot;rate&quot;:null,&quot;display_mode&quot;:&quot;default&quot;},&quot;rental_price_cents&quot;:null,&quot;pwyw&quot;:null,&quot;eligible_for_installment_plans&quot;:true,&quot;allow_installm
