    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;tbb7FPOjd1L7SpR+nXYiKEpF/rLlyz6btswxZHOgdw8=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;1N6nVjpYV9XZkClkOPWfD92vjPNUl4xmMXIn817Am_Rf647HNCFMT0JwAAfrA34nO7xxhLm8lIYQUyPap0GTJw&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;EU \u0026 UK VAT on Gumroad - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;EU \u0026 UK VAT on Gumroad&quot;,&quot;slug&quot;:&quot;10-dealing-with-vat&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cdiv class=\&quot;callout-yellow\&quot;\u003e\n    \u003cp\u003e\u003cstrong\u003eDisclaimer: \u003c/strong\u003eThis article is neither legal advice nor tax advice. We recommend that you speak to your tax advisor with any questions or concerns about tax reporting.\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cp\u003eGumroad handles VAT on behalf of creators for all digital product sales in the EU and the UK. We collect, remit, and even allow buyers to refund VAT without sellers having to lift a finger.\u003c/p\u003e\n  \u003cp\u003eNo forms to fill out, no submissions required – Gumroad does it all for you.\u003c/p\u003e\n  \u003cp\u003eFor all sales to EU and UK buyers, Gumroad acts as the &#39;merchant of record&#39; for the sale, making Gumroad responsible for collecting and remitting VAT. \u003c/p\u003e\n  \u003cp\u003eThis covers digital products. If you sell a physical product that ships to a buyer in an EU country, we do not charge VAT at checkout. When the parcel arrives from outside the EU it is an import, and the destination country&#39;s customs authority assesses the import VAT then — the buyer pays that to customs or to the carrier, not to Gumroad. When it ships from one EU country to another there is no import and nothing is collected on arrival; whether that sale carries a VAT obligation for you depends on your own registration and your country&#39;s rules, so check with a local tax accountant. Physical shipments to the UK still have VAT collected at checkout. A bundle whose every product is physical is treated as a physical shipment; a bundle mixing physical and digital products still has VAT collected. See \u003ca href=\&quot;/help/article/121-sales-tax-on-gumroad\&quot; target=\&quot;_blank\&quot;\u003eSales tax on Gumroad\u003c/a\u003e for the details.\u003c/p\u003e\n  \u003ch3\u003eReduced VAT for e-publications\u003c/h3\u003e\n  \u003cp\u003eSince 2015, many EU countries have \u003ca href=\&quot;https://www.consilium.europa.eu/en/policies/reduced-vat-epublications/\&quot;\u003ereduced their local VAT rates\u003c/a\u003e for e-publications.\u003c/p\u003e\n  \u003cp\u003eThe EU defines E-publications as:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eBooks, \u003c/li\u003e\n    \u003cli\u003eNewspapers and periodicals either on physical means of support or supplied electronically\u003c/li\u003e\n    \u003cli\u003eChildren&#39;s picture drawing or coloring books\u003c/li\u003e\n    \u003cli\u003eMusic printed or in manuscript form\u003c/li\u003e\n    \u003cli\u003eMaps and hydrographic or similar charts\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eTo apply reduced rates to your products, go to your product editor, then scroll down under the &#39;Product&#39; tab to toggle on the setting: \&quot;Mark product as e-publication for VAT purposes.\&quot;\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63b6b228bfe3f971fb093bd0/file-0xO68phTOC.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eThis will also reduce e-publications in the UK down to 0%.\u003c/p\u003e\n  \u003cp\u003eIf you are unsure if your product qualifies as an e-publication for reduced VAT rates, please contact a local tax accountant. \u003c/p\u003e\n  \u003ch3\u003eFrequently asked questions\u003c/h3\u003e\n  \u003cp\u003e\u003cstrong\u003eI am registered for VAT in my EU country or in the UK - why do you have to charge VAT to my customers? \u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eThe \u003ca href=\&quot;https://taxation-customs.ec.europa.eu/taxation/vat_en\&quot;\u003enew VAT regulations\u003c/a\u003e (as of January 1, 2015) require digital portals, platforms, gateways, and marketplaces that electronically supply, authorize payment, and handle delivery/download of electronic services to collect, report, and remit VAT. Gumroad is considered a qualifying marketplace under these regulations and is responsible for collecting/remitting VAT. \u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cstrong\u003eWhat if my customers don&#39;t have to pay VAT?\u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eIf your customers have a VAT ID, they can enter it at checkout or later into their invoice to get a refund. More information \u003ca href=\&quot;/help/article/200-i-need-a-vat-refund\&quot; target=\&quot;_blank\&quot;\u003ehere\u003c/a\u003e.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cstrong\u003eCan I choose not to charge VAT on my digital products? Or make it inclusive?\u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eNo. \u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cstrong\u003eDo you charge higher fees on VAT sales to cover processing costs?\u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eNo. \u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cstrong\u003eWhat happens if I refund a customer from the EU/UK who has paid VAT? \u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eAll refunds include the sale amount plus the VAT. A partial refund leads to a proportional VAT refund, as well.\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;121-sales-tax-on-gumroad\&quot;\u003e\u003cspan\u003eSales tax on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot
