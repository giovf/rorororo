c&quot;,&quot;thumbnail&quot;:null,&quot;id&quot;:&quot;10e770c69116d3f0e6da3c2d69af459d&quot;,&quot;type&quot;:&quot;image&quot;,&quot;filetype&quot;:&quot;jpeg&quot;,&quot;width&quot;:670,&quot;height&quot;:376,&quot;native_width&quot;:1280,&quot;native_height&quot;:720}],&quot;main_cover_id&quot;:&quot;10e770c69116d3f0e6da3c2d69af459d&quot;,&quot;thumbnail_url&quot;:null,&quot;quantity_remaining&quot;:null,&quot;long_url&quot;:&quot;https://growthpioneer.gumroad.com/l/jobsearchos&quot;,&quot;is_sales_limited&quot;:false,&quot;ratings&quot;:{&quot;count&quot;:6,&quot;average&quot;:4.8,&quot;percentages&quot;:[0,0,0,17,83]},&quot;seller_reputation&quot;:null,&quot;custom_button_text_option&quot;:null,&quot;is_compliance_blocked&quot;:false,&quot;is_published&quot;:true,&quot;is_stream_only&quot;:false,&quot;streamable&quot;:false,&quot;sales_count&quot;:null,&quot;summary&quot;:null,&quot;attributes&quot;:[{&quot;name&quot;:&quot;Size&quot;,&quot;value&quot;:&quot;640 KB&quot;}],&quot;description_html&quot;:&quot;\u003ch1\u003e\u003cstrong\u003eThe $49 Job Search System That Turns 3 Hours of Applying Into 20 Minutes\u003c/strong\u003e\u003c/h1\u003e\u003cp\u003eStop mass-applying with the same resume. Start running a job search that compounds every single day.\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eThe Problem You&#39;re Living With\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eYou spend 3+ hours a day on your job search and it still feels like shouting into a void:\u003c/p\u003e\u003cul\u003e\n\u003cli\u003eTweaking the same resume for every role instead of submitting one that&#39;s genuinely restructured for each JD\u003c/li\u003e\n\u003cli\u003eCopy-pasting the same LinkedIn message to 30 people and getting 2 replies\u003c/li\u003e\n\u003cli\u003ePrepping for interviews by Googling \&quot;common PM questions\&quot; the night before\u003c/li\u003e\n\u003cli\u003eApplying cold to 50 roles when a single referral is 5x more effective\u003c/li\u003e\n\u003cli\u003eKeeping track of everything in a messy spreadsheet that&#39;s already out of date\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003eMeanwhile, your callback rate is under 10%. Your interviews feel improvised. And you know you&#39;re leaving $20-30K on the table every time you skip the negotiation.\u003c/p\u003e\u003cp\u003eThe real problem? You don&#39;t have a system. You&#39;re improvising every single time.\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eWhat Actually Gets People Hired in 2026\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eAn estimated 40-80% of applicants now use AI to draft resumes and cover letters. When everyone tailors their resume with the same tools, applications look identical. Recruiters can&#39;t distinguish real fit from keyword matching.\u003c/p\u003e\u003cp\u003eThe people getting hired look different. They apply to fewer roles, but each one is surgically targeted. Their resumes never contain a fabricated bullet. They have referrals stacked before they submit. And they spend 20 minutes a day on their search instead of 3 hours.\u003c/p\u003e\u003cp\u003eI know this because I&#39;ve coached hundreds of candidates through job searches. I run a job search cohort. I&#39;ve placed people at OpenAI, Anthropic, Meta AI, and Google in the last year.\u003c/p\u003e\u003cp\u003eI spent 6 months encoding that system into something you can run from your terminal.\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eIntroducing: The Job Search OS\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e18 skills. 4 AI reviewers. 250 company intel profiles. 1 complete system.\u003c/p\u003e\u003cp\u003eBuilt for Claude Code (works with Cursor and VS Code too). Designed so every skill reads your real experience, checks your career targets, and produces output that&#39;s specific to you and the role you&#39;re applying for.\u003c/p\u003e\u003cp\u003eThis is not a prompt collection. Each skill is hundreds of lines of structured logic with context routing, cross-skill integration, verification layers, and edge case handling. The system I use with my coaching clients and cohort members. Encoded and automated.\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eWhat&#39;s Inside\u003c/strong\u003e\u003c/h2\u003e\u003ch3\u003e\u003cstrong\u003e18 AI-Powered Skills\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eType a slash command. Get tailored output in seconds. Every skill reads your experience library, career plan, and target companies before producing anything.\u003c/p\u003e\u003cp\u003eCovers the full job search lifecycle:\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFinding Roles\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\n\u003ccode\u003e/quick-start\u003c/code\u003e — Paste any JD, get a quality score, red flags, salary estimate, and interview intel in 60 seconds. Zero setup required.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/job-fit-scorer\u003c/code\u003e — Score any JD 0-100 across 5 dimensions. Below 60: skip. 60-75: only with referral. 75+: apply.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/company-research\u003c/code\u003e — Research any company or generate a ranked list of ~100 targets from your preferences.\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eApplying\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\n\u003ccode\u003e/resume-tailor\u003c/code\u003e — Paste a JD. Get a genuinely different resume for that role — different bullets, different ordering, different summary — built from your real experience. Keyword coverage score included. Auto-reviewed before you see it.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/cover-letter\u003c/code\u003e — Maps your top 3 experiences to the JD&#39;s top 3 requirements. Under 300 words. Only when required.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/work-product\u003c/code\u003e — A 1-pager analyzing their product with specific recommendations. Three types: get-interview, in-process, and post-interview recovery.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/hiring-manager-msg\u003c/code\u003e — Outreach that leads with your work product, not the ask.\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eNetworking\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\n\u003ccode\u003e/connection-request\u003c/code\u003e — 25 personalized LinkedIn connection requests per batch. Round-robin across your target companies. Under 300 characters each.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/referral-request\u003c/code\u003e — Full three-message sequence: initial ask, strong push, hiring manager identification.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/linkedin-audit\u003c/code\u003e — Compare your profile against your target JDs. Specific before/after edit suggestions.\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eInterviewing\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\n\u003ccode\u003e/interview-prep\u003c/code\u003e — Prep package from web research + insider data + your specific weaknesses. Likely questions by round, interviewer background, product areas to have opinions on.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/mock-interview\u003c/code\u003e — Interactive mock. One question at a time. Three Laws grading: Structure, Specificity, Skill Demonstration. Rewrites from your real experience.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/interview-debrief\u003c/code\u003e — Drop your transcript. Every question categorized. Every answer scored. Rewrites for moments you left value on the table.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/thank-you-note\u003c/code\u003e — References specific conversation moments. Not \&quot;thanks for your time.\&quot;\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eClosing\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\n\u003ccode\u003e/salary-research\u003c/code\u003e — Market comp from \u003ca href=\&quot;http://levels.fyi\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003elevels.fyi\u003c/a\u003e, Glassdoor, and Blind for a specific company, role, level, and location.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/negotiate\u003c/code\u003e — Offer analysis, leverage points, counter-offer language. This skill alone can recover 10-50x the cost of the OS.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/app-tracker\u003c/code\u003e — Central pipeline: applications, referrals, interviews, follow-ups, coverage stats.\u003c/li\u003e\n\u003cli\u003e\n\u003ccode\u003e/weekly-retro\u003c/code\u003e — End-of-week performance analysis with data-driven coaching.\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003eEach skill is 300-800 lines of structured logic. Not a one-line prompt. Full context routing, verification against your experience library, and quality self-checks.\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e4 AI Reviewers (Automatic + On Demand)\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eEvery resume gets automatically reviewed before you see the final version:\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eRecruiter Reviewer\u003c/strong\u003e — 6-second scan test. Does the first impression land?\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eATS Checker\u003c/strong\u003e — Formatting issues that break parsing (tables, columns, text boxes).\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eHiring Manager Reviewer\u003c/strong\u003e — Does this work product demonstrate real insight?\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eInterview Grader\u003c/strong\u003e — Three Laws scoring on any interview answer.\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003eIssues get auto-corrected. You see the clean version.\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eInsider Interview Data for 250 Companies\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003ePre-loaded intel: interview format, reported questions by round, what they screen for, comp data by level. For companies not in the database, the OS builds the package from web research in real time.\u003c/p\u003e\u003cp\u003eUpdated from new cohort members and coaching clients.\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eContext System (The Secret Weapon)\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eFill these out once. Every skill reads them automatically:\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eExperience Library\u003c/strong\u003e — Every project, metric, and skill from your career. The single source of truth. The OS will never fabricate a bullet that isn&#39;t in here.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eCareer Plan\u003c/strong\u003e — Target level, industry, function. Plus an addressing-weaknesses analysis that drives your entire positioning.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eQ\u0026amp;A Master\u003c/strong\u003e — Salary expectations, visa status, \&quot;why are you leaving,\&quot; greatest weakness. Answer once, referenced everywhere.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eTarget Companies\u003c/strong\u003e — ~100 companies ranked by fit. Drives the morning briefing, connection strategy, and referral tracker.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eConnection Tracker\u003c/strong\u003e — Contacts by company with relationship status. Drives outreach prioritization.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eInterview History\u003c/strong\u003e — Scores and patterns that compound. After 5-6 interviews, the system knows your weak spots and targets them.\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003eThis is what turns generic AI output into output that sounds like it was written by someone who knows your career. Most AI job search tools skip this entirely.\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eA Week in Your Life With Job Search OS\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cstrong\u003eMonday Morning:\u003c/strong\u003e Your daily briefing is waiting. New roles from the last 24 hours at your target companies, scored and ranked. Tailored resumes already reviewed. Outreach drafted. Follow-ups ready. 20 minutes to review and send everything.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTuesday:\u003c/strong\u003e Someone sends you a posting on LinkedIn. \u003ccode\u003e/quick-start\u003c/code\u003e tells you it&#39;s a 78 — apply immediately. \u003ccode\u003e/resume-tailor\u003c/code\u003e builds a custom resume in 60 seconds. \u003ccode\u003e/referral-request\u003c/code\u003e generates the outreach to your 2nd-degree connection at that company. Total time: 15 minutes.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWednesday:\u003c/strong\u003e Interview at Stripe tomorrow. \u003ccode\u003e/interview-prep\u003c/code\u003e pulls the pre-loaded intel: 4 rounds, product sense heavy in round 2, recent Stripe Financial Connections launch is fair game. Your weakness game plan addresses the consumer experience gap they&#39;ll see in your resume. \u003ccode\u003e/mock-interview\u003c/code\u003e that evening targets your two lowest-scoring question types.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThursday:\u003c/strong\u003e Interview done. Drop the Granola transcript. \u003ccode\u003e/interview-debrief\u003c/code\u003e scores every answer. Flags the 14-minute mark where you gave a generic stakeholder conflict answer and rewrites it using your Affirm Card launch story. \u003ccode\u003e/thank-you-note\u003c/code\u003e references the caching latency tradeoff you discussed. Interview history auto-updates.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFriday:\u003c/strong\u003e \u003ccode\u003e/weekly-retro\u003c/code\u003e. 12 applications, 4 callbacks (33% — up from 18% last week). Pipeline leaking at the referral stage — 8 connection requests sent, 2 converted. Recommendation: increase follow-up cadence and add work products for top 3 targets.\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\
