<!-- Finsweet Consent Pro V2 → cross-subdomain cookie widening -->
<script>
  (function() {
    function widenConsentCookies() {
      // Widen all fs-consent* cookies to .nomad-data.com
      var cookies = document.cookie.split('; ');
      cookies.forEach(function(c) {
        if (c.indexOf('fs-consent') === 0) {
          var eqIdx = c.indexOf('=');
          var name = c.substring(0, eqIdx);
          var value = c.substring(eqIdx + 1);
          document.cookie = name + '=' + value + '; domain=.nomad-data.com; path=/; max-age=31536000; SameSite=Lax';
        }
      });
    }

    // Widen on load (handles returning visitors)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', widenConsentCookies);
    } else {
      widenConsentCookies();
    }

    // Re-widen after Finsweet banner interaction (use capture so we catch it before stopPropagation)
    document.addEventListener('click', function(e) {
      if (e.target && e.target.closest && e.target.closest('[fs-cc], [fs-cmp]')) {
        setTimeout(widenConsentCookies, 300);
      }
    }, true);

    // Also re-widen periodically for the first 5 seconds in case Finsweet writes cookies after our DOM ready
    var attempts = 0;
    var interval = setInterval(function() {
      widenConsentCookies();
      if (++attempts > 25) clearInterval(interval);
    }, 200);
  })();
</script>

<!-- Push GCM consent update to dataLayer based on fs-consent-* cookies -->
<script>
  (function() {
    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }

    function pushConsentUpdate() {
      // Only push if user has actually made a decision (fs-consent master cookie exists)
      if (!getCookie('fs-consent')) return;

      var signals = [
        'ad_storage',
        'ad_user_data',
        'ad_personalization',
        'analytics_storage',
        'personalization_storage',
        'functionality_storage',
        'security_storage'
      ];

      var update = {};
      var hasAny = false;
      signals.forEach(function(sig) {
        var val = getCookie('fs-consent-' + sig);
        if (val === 'true') { update[sig] = 'granted'; hasAny = true; }
        else if (val === 'false') { update[sig] = 'denied'; hasAny = true; }
      });

      if (!hasAny) return;

      // Always grant security/functionality (they're essential)
      update.security_storage = 'granted';
      update.functionality_storage = 'granted';

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'update', update);
    }

    // Push on load (handles returning visitors with existing consent)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', pushConsentUpdate);
    } else {
      pushConsentUpdate();
    }

    // Push after Finsweet banner interaction
    document.addEventListener('click', function(e) {
      if (e.target && e.target.closest && e.target.closest('[fs-cc], [fs-cmp]')) {
        setTimeout(pushConsentUpdate, 400);
        setTimeout(pushConsentUpdate, 1500);
      }
    }, true);
  })();
