<!-- Form blocking general emails -->
<script>
  const blockedDomains = [
    // Free / consumer
    'gmail.com', 'googlemail.com', 'yahoo.com', 'yahoo.co.uk', 'ymail.com',
    'hotmail.com', 'hotmail.co.uk', 'outlook.com', 'live.com', 'msn.com',
    'icloud.com', 'me.com', 'mac.com', 'aol.com', 'aol.co.uk',
    'protonmail.com', 'proton.me', 'tutanota.com', 'zoho.com',
    'gmx.com', 'gmx.net', 'mail.com', 'inbox.com',
    'yandex.com', 'yandex.ru', 'mail.ru',
    // Disposable / temp
    'mailinator.com', 'guerrillamail.com', 'guerrillamail.net',
    'sharklasers.com', 'guerrillamailblock.com', 'grr.la',
    'tempmail.com', 'temp-mail.org', 'throwam.com',
    'trashmail.com', 'trashmail.net', 'trashmail.me',
    'fakeinbox.com', 'maildrop.cc', 'spamgourmet.com',
    'dispostable.com', 'yopmail.com', 'yopmail.fr',
    'mailnull.com', 'spamspot.com', 'spamthisplease.com',
    'getairmail.com', 'filzmail.com', 'throwam.com',
    'mailnesia.com', 'discard.email', 'spamherelots.com',
    'boun.cr', 'spaml.com', 'mailscrap.com'
  ];

  document.addEventListener('DOMContentLoaded', function () {
    // Targets all Webflow forms on the page — narrow this selector if needed
    const forms = document.querySelectorAll('form');

    forms.forEach(function (form) {
      form.addEventListener('submit', function (e) {
        const emailInput = form.querySelector('input[type="email"]');
        if (!emailInput) return;

        const email = emailInput.value.trim().toLowerCase();
        const domain = email.split('@')[1];

        if (!domain || blockedDomains.includes(domain)) {
          e.preventDefault();
          e.stopPropagation();

          // Remove any existing error message first
          const existing = form.querySelector('.email-domain-error');
          if (existing) existing.remove();

          // Inject error message below the input
          const error = document.createElement('div');
          error.className = 'email-domain-error';
          error.style.cssText = 'color: #e53e3e; font-size: 0.875rem; margin-top: 4px;';
          error.textContent = 'Please enter a business email address.';
          emailInput.parentNode.insertBefore(error, emailInput.nextSibling);
          emailInput.focus();
        } else {
          // Clear error if previously shown
          const existing = form.querySelector('.email-domain-error');
          if (existing) existing.remove();
        }
      });
    });
  });
</script>
<!-- Javascript to capture IP for forms -->
<script>
(function() {
  var IPINFO_TOKEN = '2b280fb3a16798';
  var hasFetched = false;
  
  function populateGeoFields() {
    if (hasFetched) return;
    hasFetched = true;
    
    fetch('https://ipinfo.io/json?token=' + IPINFO_TOKEN)
      .then(function(response) { return response.json(); })
      .then(function(data) {
        setFieldValue('submission_ip_address', data.ip || '');
        setFieldValue('submission_country', data.country || '');
        setFieldValue('submission_state', data.region || '');
        setFieldValue('submission_city', data.city || '');
      })
      .catch(function(err) {
        console.warn('Geo capture failed:', err);
      });
  }
  
  function setFieldValue(name, value) {
    var inputs = document.querySelectorAll('input[name="' + name + '"]');
    inputs.forEach(function(input) {
      input.value = value;
    });
  }
  
  function attachListeners() {
    // Find all hidden IP fields — their presence indicates a form we care about
    var ipFields = document.querySelectorAll('input[name="submission_ip_address"]');
    if (ipFields.length === 0) return; // No relevant form on this page, do nothing
    
    // For each form containing an IP field, listen for first interaction on any visible input
    ipFields.forEach(function(ipField) {
      var form = ipField.closest('form');
      if (!form) return;
      
      var visibleInputs = form.querySelectorAll('input:not([type="hidden"]), textarea, select');
      visibleInputs.forEach(function(input) {
        input.addEventListener('focus', populateGeoFields, { once: true });
      });
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachListeners);
  } else {
    attachListeners();
  }
})();
</script></body></html>
