<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Årsredovisningar File Explorer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .file-explorer {
            width: 80%;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .folder-item {
            display: flex;
            align-items: center;
            padding: 5px;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: inherit;
        }
        .folder-item:hover {
            background-color: #e9e9e9;
        }
        .icon {
            margin-right: 10px;
        }
        .file-list {
            margin-left: 20px;
            padding: 10px 0;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-item:hover {
            background-color: #e9e9e9;
        }
        .file-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="file-explorer" id="fileExplorer" role="tree"></div>

<script>
    function groupFilesByYear(urls) {
        const yearMatcher = /\/(\d{4})\//;
        const grouped = {};

        urls.forEach(url => {
            const match = url.match(yearMatcher);
            if (match) {
                const year = match[1];
                if (!grouped[year]) {
                    grouped[year] = [];
                }
                grouped[year].push(url);
            }
        });

        return grouped;
    }

    function toggleFolder(folderElement) {
        const fileList = folderElement.nextElementSibling;
        const expanded = folderElement.getAttribute("aria-expanded") === "true";

        if (fileList) {
            fileList.classList.toggle("hidden");
            folderElement.setAttribute("aria-expanded", !expanded);
        }
    }

    function renderFileExplorer(groupedData) {
        const fileExplorer = document.getElementById("fileExplorer");
        fileExplorer.innerHTML = "";

        Object.keys(groupedData).sort((a, b) => b - a).forEach(year => {
            const folderItem = document.createElement("a");
            folderItem.classList.add("folder-item");
            folderItem.setAttribute("role", "treeitem");
            folderItem.setAttribute("href", "javascript:void();");
            folderItem.setAttribute("aria-expanded", "false");
            folderItem.setAttribute("aria-label", `Folder ${year}`);
            folderItem.onclick = (e) => {
                e.preventDefault();
                toggleFolder(folderItem);
            };

            const icon = document.createElement("span");
            icon.classList.add("icon");
            icon.innerHTML = "📁";

            const text = document.createElement("span");
            text.textContent = year;
            text.classList.add("folder");

            folderItem.appendChild(icon);
            folderItem.appendChild(text);

            const fileList = document.createElement("div");
            fileList.classList.add("file-list", "hidden");
            fileList.setAttribute("role", "group");

            groupedData[year].forEach(url => {
                const fileItem = document.createElement("a");
                fileItem.href = url;
                fileItem.classList.add("file-item");
                fileItem.setAttribute("role", "treeitem");
                fileItem.setAttribute("aria-label", `Folder ${year}, File ${url.split('/').pop()}`);
