    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;AYAn7qHsp2aiP7MwuZwYNwCKdJ2rgnsFCLffgvlZyak=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;NIprrKAyS4cB4Adiuy7aWsVR2kq8WWeIfdkVA4J9n0TuS-PgzANHKSe1mEEA6b9KZP9_xWWWJ_OlfZ99j7dHag&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Protecting creator privacy - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Protecting creator privacy&quot;,&quot;slug&quot;:&quot;120-protecting-your-privacy-on-gumroad&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eIn this article:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#What-information-do-your-customers-see-6U9Hk\&quot; target=\&quot;_blank\&quot;\u003eWhat information do your customers see\u003c/a\u003e\n      \u003cul\u003e\n        \u003cli\u003e\u003ca href=\&quot;#PayPal-BtBkS\&quot; target=\&quot;_self\&quot;\u003ePayPal\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ca href=\&quot;#Stripe--1Qjp\&quot; target=\&quot;_blank\&quot;\u003eStripe\u003c/a\u003e\u003c/li\u003e\n      \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Exceptions-xwv60\&quot; target=\&quot;_blank\&quot;\u003eExceptions\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;What-information-do-your-customers-see-6U9Hk\&quot;\u003eWhat information do your customers see?\u003c/h3\u003e\n  \u003cp\u003eWe only show customers your:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eEmail address (or your support email, if applicable). You can change your email information in your \u003ca href=\&quot;http://gumroad.com/settings\&quot;\u003eSettings\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003eThe name you have entered into \u003ca href=\&quot;https://gumroad.com/settings/profile\&quot;\u003eyour profile page\u003c/a\u003e.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eYour customers will \u003cb\u003enever\u003c/b\u003e see your banking information, payout information, or address.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh5.googleusercontent.com/UJQGF1dLdfBJk1j17sEmuaJ3GFZPux9ZZ05iJUumyko5FoTIWBO7kiZvbU2rczFoiEGTTTVgi-hhDMYOEt1EjN5P8GVguZCPr3XvIHkS7MVgR8e6u8VjchWsEsRtDB9LB8T76FRPd8CrpvHM1MisNe8\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;PayPal-BtBkS\&quot;\u003ePayPal\u003c/h3\u003e\n  \u003cp\u003eIf you \u003ca href=\&quot;275-paypal-connect\&quot;\u003eAdd PayPal to checkout\u003c/a\u003e, customers will be able to see your name and email in their PayPal transaction details. This is because the payment goes directly to your PayPal account, and Gumroad merely acts as the marketplace. \u003c/p\u003e\n  \u003cp\u003eFor greater privacy, you can create a ‘Business’ PayPal account that would only disclose the company name and email. Otherwise, we suggest disconnecting PayPal Connect from your account.\u003c/p\u003e\n  \u003ch3 id=\&quot;Stripe--1Qjp\&quot;\u003eStripe\u003c/h3\u003e\n  \u003cp\u003eIf you ​​\u003ca href=\&quot;330-stripe-connect\&quot;\u003eConnect your Stripe account to Gumroad\u003c/a\u003e, customers will still only be able to see the email that is connected to your Gumroad account. You will also be able to customize the charge description that customers see on their bank statements. It is important to use a recognizable name that will not lead to unintended disputes. More on that \u003ca href=\&quot;https://support.stripe.com/questions/update-business-name-shown-on-customer-bank-statements\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3 id=\&quot;Exceptions-xwv60\&quot;\u003eExceptions\u003c/h3\u003e\n  \u003cp\u003eUnfortunately, a few creators based in countries with direct bank deposits enabled have found that, on rare occasions, the name and/or phone number entered into \u003ca href=\&quot;http://gumroad.com/settings/payments\&quot;\u003etheir payment settings\u003c/a\u003e have been displayed on customers&#39; credit card statements. This is not something we have control over as the information is being directed through Stripe to the customers&#39; card providers, who decide what information to share. \u003c/p\u003e\n  \u003cp\u003eTo remain anonymous, we suggest either: \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eCreating an LLC and selling as \u003ca href=\&quot;260-your-payout-settings-page#account-type\&quot;\u003ea business account,\u003c/a\u003e or\u003c/li\u003e\n    \u003cli\u003eCreating a phone number specifically for your business and/or Gumroad using Google Voice or a similar VoIP provider\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;130-pdf-stamping\&quot;\u003e\u003cspan\u003ePDF stamping\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;42-content-security\&quot;\u003e\u003cspan\u003eContent protection on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Protecting creator privacy - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,&quot;content&quot;:&quot;authenticity_token&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-token&quot;,&quot;name&quot;:&quot;csrf-token&quot;,&quot;content&quot;:&quot;jX7fCuyYhLg9fP-wzyQ_UUWdjP6gw7X7pTRfSeBsc4NXv1dGgKmIFhspYJN041pB5DMpcXkM9YB9kNU37aarrQ&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-charset&quot;,&quot;charset&quot;:&quot;utf-8&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot
