    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;n3vWroWU9Hz9QJcYPyM4o4PtxGlspIPHcGi2/tulBaI=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;RdlpY4LxjBf4-bXlDXkn61_NIHqANAYO2tO6NH7C4RLD5l9Qz12MO3Bc62bcm_C0VYSzO5Ipa7X9YIxnrIpykw&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;License keys - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;License keys&quot;,&quot;slug&quot;:&quot;76-license-keys&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cdiv class=\&quot;callout-yellow\&quot;\u003e\n    \u003cp\u003e⚠️ \u003cstrong\u003eImportant:\u003c/strong\u003e Our \u003ca href=\&quot;https://gumroad.com/api#licenses\&quot;\u003elicense key verification API\u003c/a\u003e requires the \u003ccode class=\&quot;inline-code\&quot;\u003eproduct_id\u003c/code\u003e parameter instead of \u003ccode class=\&quot;inline-code\&quot;\u003eproduct_permalink\u003c/code\u003e for all products created on or after Jan 9, 2023.\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cp\u003e\u003cstrong\u003eIn this article:\u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#What-are-license-keys-for--WZQVz\&quot;\u003eWhat are license keys for?\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Setting-up-a-product-with-license-keys-CG7_h\&quot;\u003eSetting up a product with license keys\u003c/a\u003e\n      \u003cul\u003e\n        \u003cli\u003e\u003ca href=\&quot;#multi-seat\&quot;\u003eIssuing multi-seat licenses\u003c/a\u003e\u003c/li\u003e\n      \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#where-customers-find-their-key\&quot;\u003eWhere your customers find their license key\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#enforcement\&quot;\u003eHow license key enforcement works\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#verification\&quot;\u003eVerifying a license key in your application\u003c/a\u003e\n      \u003cul\u003e\n        \u003cli\u003e\u003ca href=\&quot;#curl\&quot;\u003ecURL example\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ca href=\&quot;#api-example\&quot;\u003eAPI response example\u003c/a\u003e\u003c/li\u003e\n      \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Managing-licenses-and-subscriptions-iiiW4\&quot;\u003eManaging licenses and subscriptions\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#faqs\&quot;\u003eFAQs\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;What-are-license-keys-for--WZQVz\&quot;\u003eWhat are license keys for? \u003c/h3\u003e\n  \u003cp\u003eLicense keys are primarily used by creators selling software. License keys can help creators verify purchases through their application and authorize or revoke access to the software they have created.\u003c/p\u003e\n  \u003cp\u003eLicense keys will NOT help you limit access to digital audio, video, or ebook files that you are selling on Gumroad.\u003c/p\u003e\n  \u003ch3 id=\&quot;Setting-up-a-product-with-license-keys-CG7_h\&quot;\u003eSetting up a product with license keys\u003c/h3\u003e\n  \u003cp\u003eLicense keys can be enabled and embedded directly from the product&#39;s content page. Go to your product&#39;s content page, click &#39;Insert&#39;, and select &#39;License key&#39;.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65c9df7c5d8fe340f348195c/file-aPZY2hVKhU.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eYou can drag and reposition the license key module anywhere on the page, but it can only be added to any one page of your content.\u003c/p\u003e\n  \u003cp\u003eYou can also retroactively add license keys to a product.\u003c/p\u003e\n  \u003cp\u003eIf your product has \u003ca href=\&quot;126-setting-up-versions-on-a-digital-product\&quot;\u003eversions\u003c/a\u003e with separate content, license keys are issued per version: customers receive a key only when the version they purchased has the License key block in its content. To stop a version from issuing keys (for example, a free version of a product whose paid version is licensed), remove the License key block from that version&#39;s content. Versions without any content of their own still receive keys whenever the product has license keys enabled.\u003c/p\u003e\n  \u003ch3 id=\&quot;multi-seat\&quot;\u003eIssuing multi-seat licenses\u003c/h3\u003e\n  \u003cp\u003eThe “Multi-seat license” setting allows you to issue multiple seats for a single purchase or license key. It is available on any product with license keys enabled, except calls.\u003c/p\u003e\n  \u003cp\u003eIn the License key block on your content page, toggle on \&quot;Allow customers to choose number of seats per license purchased\&quot;. The setting is shown directly under the block while you are editing.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65c9e3495d8fe340f3481960/file-MYl4EnL4Of.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eIf you&#39;d like to prepopulate the number of seats for a given customer, you can use the quantity \u003ca href=\&quot;270-url-parameters\&quot;\u003eURL parameter\u003c/a\u003e (Example: \u003ca href=\&quot;https://hypermatic.gumroad.com/l/emailify?layout=profile\u0026amp;quantity=4\&quot;\u003ehttps://hypermatic.gumroad.com/l/emailify?layout=profile\u0026amp;quantity=4)\u003c/a\u003e\u003c/p\u003e\n  \u003cp\u003eYou will be able to view and manage the number of seats linked with a license key from the customer’s drawer in the \u003ca href=\&quot;https://gumroad.com/customers/\&quot;\u003eAudience dashboard\u003c/a\u003e, while your membership customers can do this from their “Manage membership” page.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/639b0a1c2e586565571c20eb/file-4oW74KD2yB.gif\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eFor memberships, customers will immediately be charged a prorated amount if the number of seats increases. However, for a decrease in seats, their membership will get updated at the end of the current billing cycle. After that, they will be charged the reduced amount starting from the next renewal.\u003c/p\u003e\n  \u003cp\u003eFor such purchases, the is_multiseat_license field will be set to true in our API response, and the value of quantity will indicate the number of seats.\u003c/p\u003e\n  \u003ch3 id=\&quot;where-customers-find-their-key\&quot;\u003eWhere your customers find their license key\u003c/h3\u003e\n  \u003cp\u003eCustomers can find their key in the receipt emailed to them after checkout, on the product&#39;s download page, and on the product&#39;s page on Gumroad. On the product page, the key appears in the card that says they already own the product, but only when we can tell who the visitor is: they are signed in to the Gumroad account the purchase is linked to (which happens when they were signed in at checkout), or they arrived from a Gumroad email link that identifies their purchase (our bundle review reminder emails do this, for example — an ordinary email link is not enough on its own). We do not show the key to a visitor we only recognize by their browser, because a shared or public computer would otherwise expose the previous buyer&#39;s key.\u003c/p\u003e\n  \u003cp\u003eCustomers who do not see their key on the product page can get it from the \u003ca href=\&quot;https://gumroad.com/license-key-lookup\&quot;\u003elicense key lookup page\u003c/a\u003e: they enter the email they purchased with, or their PayPal invoice ID, and we email their receipt, including the license key, to that address. When we do not recognize the visitor as a buyer at all, a licensed product&#39;s page links that page for them under \&quot;Already bought this?\&quot;.\u003c/p\u003e\n  \u003ch3 id=\&quot;enforcement\&quot;\u003eHow license key enforcement works\u003c/h3\u003e\n  \u003cp\u003eLicense key enforcement is completely up to the creator. You can decide how many uses each key gets depending on your “verify” \u003ca href=\&quot;https://gumroad.com/api#licenses\&quot;\u003elicense API calls\u003c/a\u003e. Gumroad performs no additional license key verification.\u003c/p\u003e\n  \u003cp\u003eRemember that checking for a valid license on each launch will increment the usage count unless you set the “increment_uses_count” flag to false. If the count ends up wrong, you can correct it from the \u003ca href=\&quot;268-customer-dashboard\&quot;\u003eSales dashboard\u003c/a\u003e, on the \u003cstrong\u003eUses\u003c/strong\u003e row of the License key section for that sale. You can also check if a purchase has been refunded or disputed by checking the refunded/disputed fields of the API call response.\u003c/p\u003e\n  \u003ch3 id=\&quot;verification\&quot;\u003e Verifying a license key in your application\u003c/h3\u003e\n  \u003cp\u003eUse these parameters to verify a license key:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eproduct_id\u003c/strong\u003e (the unique ID of the product, shown in the License key block on your product&#39;s content page while editing)\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003elicense_key\u003c/strong\u003e (the license key provided by your customer)\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eincrement_uses_count\u003c/strong\u003e (\&quot;true\&quot;/\&quot;false\&quot;, optional, default: \&quot;true\&quot;)\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;curl\&quot;\u003ecURL example\u003c/h3\u003e\n  \u003cpre\u003ecurl https://api.gumroad.com/v2/licenses/verify \\ -d \&quot;product_id=SDGgCnivv6gTTHfVRfUBxQ==\&quot; \\ -d \&quot;license_key=A1B2C3D4-E5F60718-9ABCDEF0-1234ABCD\&quot; \\ -X POST \u003c/pre\u003e\n  \u003ch3 id=\&quot;api-example\&quot;\u003eAPI response example\u003c/h3\u003e\n  \u003cp\u003eIf the verification is successful, you will receive a response similar to this:\u003c/p\u003e\n  \u003cpre\u003e{ \&quot;success\&quot;: true, \&quot;uses\&quot;: 3, \&quot;purchase\&quot;: { \&quot;seller_id\&quot;: \&quot;kL0psVL2admJSYRNs-OCMg==\&quot;, \&quot;product_id\&quot;: \&quot;32-nPAicqbLj8B_WswVlMw==\&quot;, \&quot;product_name\&quot;: \&quot;licenses demo product\&quot;, \&quot;permalink\&quot;: \&quot;QMGY\&quot;, \&quot;product_permalink\&quot;: \&quot;https://sahil.gumroad.com/l/pencil\&quot;, \&quot;email\&quot;: \&quot;customer@example.com\&quot;, \&quot;price\&quot;: 0, \&quot;gumroad_fee\&quot;: 0, \&quot;currency\&quot;: \&quot;usd\&quot;, \&quot;quantity\&quot;: 1, \&quot;discover_fee_charged\&quot;: false, \&quot;can_contact\&quot;: true, \&quot;referrer\&quot;: \&quot;direct\&quot;, \&quot;card\&quot;: { \&quot;expiry_month\&quot;: null, \&quot;expiry_year\&quot;: null, \&quot;type\&quot;: null, \&quot;visual\&quot;: null }, \&quot;order_number\&quot;: 524459935, \&quot;sale_id\&quot;: \&quot;FO8TXN-dbxYaBdahG97Y-Q==\&quot;, \&quot;sale_timestamp\&quot;: \&quot;2021-01-05T19:38:56Z\&quot;, \&quot;purchaser_id\&quot;: \&quot;5550321502811\&quot;, \&quot;subscription_id\&quot;: \&quot;GDzW4_aBdQc-o7Gbjng7lw==\&quot;, \&quot;variants\&quot;: \&quot;\&quot;, \&quot;license_key\&quot;: \&quot;85DB562A-C11D4B06-A2335A6B-8C079166\&quot;, \&quot;is_multiseat_license\&quot;: false, \&quot;ip_country\&quot;: \&quot;United States\&quot;, \&quot;recurrence\&quot;: \&quot;monthly\&quot;, \&quot;is_gift_receiver_purchase\&quot;: false, \&quot;refunded\&quot;: false, \&quot;disputed\&quot;: false, \&quot;dispute_won\&quot;: false, \&quot;id\&quot;: \&quot;FO8TXN-dvaYbBbahG97a-Q==\&quot;, \&quot;created_at\&quot;: \&quot;2021-01-05T19:38:56Z\&quot;, \&quot;custom_fields\&quot;: [], \&quot;chargebacked\&quot;: false, # purchase was refunded, non-subscription product only \&quot;subscription_ended_at\&quot;: null, # subscription was ended, subscription product only \&quot;subscription_cancelled_at\&quot;: null, # subscription was cancelled, subscription product only \&quot;subscription_failed_at\&quot;: null # we were unable to charge the subscriber&#39;s card }} \u003c/pre\u003e\n  \u003cp\u003eYou will receive a 404 response code with an error message if verification fails.\u003c/p\u003e\n  \u003ch3 id=\&quot;Managing-licenses-and-subscriptions-iiiW4\&quot;\u003eManaging licenses and subscriptions\u003c/h3\u003e\n  \u003cbr\u003e\n  \u003cp\u003eOur \u003ca href=\&quot;https://gumroad.com/api#licenses\&quot;\u003eLicenses API\u003c/a\u003e will continue to return the key state as enabled until you disable it; however, we set the following fields with the appropriate timestamps so you can know if and when the membership has ended:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ccode class=\&quot;inline-code\&quot;\u003esubscription_ended_at\u003c/code\u003e : Timestamp of a membership&#39;s end for a fixed-length membership, i.e. if the \&quot;Automatically end memberships after a number of months\&quot; setting is enabled on the product.\u003c/li\u003e\n    \u003cli\u003e\u003ccode class=\&quot;inline-code\&quot;\u003esubscription_cancelled_at\u003c/code\u003e : Timestamp of a membership&#39;s end if it was cancelled by the customer or creator.\u003c/li\u003e\n    \u003cli\u003e\u003ccode class=\&quot;inline-code\&quot;\u003esubscription_failed_at\u003c/code\u003e : Timestamp of a membership&#39;s end if it failed to renew (usually due to a card error)\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003ePlease note that all these timestamps correspond to the membership end date and not the cancellation requested date/time. Also, successfully renewing or restarting the membership will reverse the values of these fields back to \u003ccode class=\&quot;inline-code\&quot;\u003enull\u003c/code\u003e . \u003c/p\u003e\n  \u003cp\u003eIf one of these fields is not null, you can disable the license and terminate access to the software.\u003c/p\u003e\n  \u003ch3 id=\&quot;faqs\&quot;\u003eFAQs\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eCan I make API calls from the browser?\u003c/strong\u003e Yes, you can send API requests to \u003ccode class=\&quot;inline-code\&quot;\u003eapi.gumroad.com\u003c/code\u003e from the browser. \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDoes the value of \u003c/strong\u003e\u003ccode class=\&quot;inline-code\&quot;\u003e\u003cstrong\u003esale_timestamp\u003c/strong\u003e\u003c/code\u003e\u003cstrong\u003e and \u003c/strong\u003e\u003ccode class=\&quot;inline-code\&quot;\u003e\u003cstrong\u003ecreated_at\u003c/strong\u003e\u003c/code\u003e\u003cstrong\u003e update when a subscription is renewed?\u003c/strong\u003e No. They both remain the same as the original value. \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eDoes the \&quot;disable\&quot; method cancel the customer&#39;s subscription?\u003c/strong\u003e No, it just disables the license key. \u003ca href=\&quot;139-how-to-cancel-your-customers-subscriptions\&quot;\u003eHere&#39;s how\u003c/a\u003e to cancel a subscription for a customer. \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCan I use my own license keys?\u003c/strong\u003e You either have to choose the license keys we generate or manage your license keys outside of our system. We do not have a way for you to import license keys. \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCan I reset the \u003c/strong\u003e\u003ccode class=\&quot;inline-code\&quot;\u003e\u003cstrong\u003euses\u003c/strong\u003e\u003c/code\u003e\u003cstrong\u003e count parameter to zero?\u003c/strong\u003e Yes. Open the sale in your \u003ca href=\&quot;https://gumroad.com/customers/\&quot;\u003eSales\u003c/a\u003e dashboard and use \u003cstrong\u003eReset\u003c/strong\u003e on the \u003cstrong\u003eUses\u003c/strong\u003e row of the License key section. The same row lets you change the count by one at a time or type an exact number. Through the API you can increment or decrement the count, but there is no call that sets it to a specific value. If you do not wish to increment the \u003ccode class=\&quot;inline-code\&quot;\u003euses\u003c/code\u003e count at all, there&#39;s an \u003ccode class=\&quot;inline-code\&quot;\u003eincrement_uses_count\u003c/code\u003e flag in the verify API call that you can set to false. Refer to our API docs \u003ca href=\&quot;https://gumroad.com/api#licenses\&quot;\u003ehere\u003c/a\u003e. \u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eCan I generate license keys for past purchases that did not have a license attached to them originally?\u003c/strong\u003e Yes. When you add the License key block to your product&#39;s content page, all previous purchases of that product will also get a license key. For products with versions that have separate content, keys are generated only for purchases of versions whose content includes the License key block. Your customers will be able to access the key from their respective download pages. \u003c/li\u003e\n    \u003cli\u003e\u003cb\u003eWhy is “purchaser_id\&quot; missing from the returned payload? \u003c/b\u003eWe store and return a `purchaser_id` only when the purchase is made by a signed-in user. As you might be aware, it is not necessary to be logged in to Gumroad to make a purchase, and thus not every purchase might have a `purchaser_id` linked with it. When the purchase is made by a signed-in user, we store that user’s ID as the purchaser_id otherwise, it is nil. If it’s present, we respond with purchaser_id in the API, otherwise, we don’t even include the purchaser_id key in the response. (ref)\u003c/li\u003e\n    \u003cli\u003e\u003cb\u003eCan I create products or upload content with the API? \u003c/b\u003eSorry, that&#39;s not yet possible. While we’re not working on this at the moment, you can add this to our \u003ca href=\&quot;https://gumroad.nolt.io/\&quot;\u003efeature request page\u003c/a\u003e (and also vote on others). Our Product team regularly checks this list while planning future releases.\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;64-is-gumroad-for-me\&quot;\u003e\u003cspan\u003eWhy choose Gumroad?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;149-adding-a-product\&quot;\u003e\u003cspan\u003eAdding a product\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;82-membership-products\&quot;\u003e\u003cspan\u003eSelling memberships and subscriptions\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;70-can-i-sell-services\&quot;\u003e\u003cspan\u003eSell digital services: freelancing, coaching, and tip jars\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;81-custom-product-urls\&quot;\u003e\u003cspan\u003eCustom product URLs\u003c/span\u0
