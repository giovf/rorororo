    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;EH0ibpJinzjZLiURniKG28igLTtde1mtzyBpDbYrYO0=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;V_VkBcOE_k7H0OzAaSGyfVv9M_e2WO7p91SNfnV-sTh2lj_I3ZuvCrH4DY4oKpbDeyRfxnqY2fNOPVWe88h4Fg&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Things not allowed on Gumroad - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Things not allowed on Gumroad&quot;,&quot;slug&quot;:&quot;155-things-you-cant-sell-on-gumroad&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eWhile Gumroad allows for a huge variety of products to be sold, we do have to delete products from time to time, and we suggest all new creators read through this list to make sure their accounts are in compliance. \u003c/p\u003e\n  \u003cp\u003eIn general, we do not allow reselling - you cannot resell products that you didn&#39;t create. You can be an affiliate for another Gumroad creator - but you cannot sell products that didn&#39;t spring forth from your own beautiful mind.\u003c/p\u003e\n  \u003cp\u003eWe do not allow any activity or content that promotes or encourages discrimination based on race, sex, religion, nationality, disability, sexual orientation, or age. This includes any content sent out using our email services, or as part of any products sold on Gumroad in any capacity.\u003c/p\u003e\n  \u003cp\u003eTo provide specific examples (though by no means an exhaustive list), you cannot:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eThreaten any specific individual\u003c/li\u003e\n    \u003cli\u003eIncite violence against a specific person, place, or group\u003c/li\u003e\n    \u003cli\u003eShare private information about a citizen without their permission\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3\u003eHigh-risk products\u003c/h3\u003e\n  \u003cp\u003eAs identified by our payment and regulatory partners, certain product types are not allowed on Gumroad due to their higher likelihood of being associated with fraud and chargebacks. \u003c/p\u003e\n  \u003cp\u003ePlease see \u003ca href=\&quot;https://gumroad.com/prohibited\&quot;\u003eProhibited Products and Activities\u003c/a\u003e for a comprehensive list of the items you can&#39;t sell on Gumroad. Some common such products are:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eIPTV subscriptions\u003c/li\u003e\n    \u003cli\u003eProducts related to dropshipping \u003c/li\u003e\n    \u003cli\u003eReselling proprietary products - i.e. you are reselling ebooks, courses, prompts, notion planners, templates, video clips, fonts, and presets\u003c/li\u003e\n    \u003cli\u003eReselling ebooks that you have reseller rights to (\u003cstrong\u003ePLR or MRR products\u003c/strong\u003e) \u003c/li\u003e\n    \u003cli\u003eReselling software that you&#39;ve purchased in the past, like Windows 10 license keys, etc. \u003c/li\u003e\n    \u003cli\u003eAI services — selling access to AI tools, chatbots, image or content generation services, or subscriptions to AI services fulfilled outside of Gumroad\u003c/li\u003e\n    \u003cli\u003eWeb hosting or servers\u003c/li\u003e\n    \u003cli\u003eTickets to events or using Gumroad to process money for events you are hosting\u003c/li\u003e\n    \u003cli\u003ePhysical products\u003c/li\u003e\n    \u003cli\u003eSelling jewelry\u003c/li\u003e\n    \u003cli\u003eSelling Steam keys\u003c/li\u003e\n    \u003cli\u003eCheats or hacks for other games and websites, including aimbots, wallhacks, and the license keys that unlock them\u003c/li\u003e\n    \u003cli\u003eAny NSFW or sexually explicit content—\u003ca href=\&quot;156-gumroad-and-adult-content\&quot;\u003eSee why here\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eServices that are fulfilled outside Gumroad&#39;s purview. More on that \u003ca href=\&quot;70-can-i-sell-services\&quot;\u003ehere\u003c/a\u003e.\u003c/li\u003e\n    \u003cli\u003eFood products, medical products, skincare or beauty supplies\u003c/li\u003e\n    \u003cli\u003eCredit repair ebooks or services, or products that discuss credit improvement\u003c/li\u003e\n    \u003cli\u003eGift Cards or financial instruments (i.e. \&quot;tokens\&quot; on your website or forum)\u003c/li\u003e\n    \u003cli\u003eProducts that feature cruelty to animals\u003c/li\u003e\n    \u003cli\u003eNo products that promote meeting up with strangers for any reason, including but not limited to dating, hookups, or any other social interaction.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;Delivering-off-Gumroad-Ln4vT\&quot;\u003eDelivering your product off Gumroad\u003c/h3\u003e\n  \u003cp\u003eBuyers need to receive what they paid for on Gumroad, so you cannot sell a product whose only way of delivering it is telling buyers to message you somewhere else. If a product has nothing attached for the buyer and its description says something like \&quot;after you subscribe, DM me on Telegram for the content\&quot;, it will be blocked when you publish it, or when you save a change to the name or description of a product that is already published. You will see this message:\u003c/p\u003e\n  \u003cp\u003e\u003ci\u003eBuyers need to receive what they paid for on Gumroad. This product has no content attached and directs buyers to message you on another platform to get it, which we don’t allow. Add the files, videos, or written content buyers should get when they buy, then publish again.\u003c/i\u003e\u003c/p\u003e\n  \u003cp\u003eOnce the product has files, videos, or written content buyers can get on Gumroad, try publishing again. This particular block will no longer apply, though the product still has to follow the rest of our content guidelines.\u003c/p\u003e\n  \u003cp\u003eThis only applies to products that have nothing at all for the buyer on Gumroad. Mentioning other platforms is fine on its own, and none of these are affected:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eA Discord, Telegram, or Slack community offered alongside your content, or as a perk of a membership.\u003c/li\u003e\n    \u003cli\u003eA Discord or Circle community Gumroad itself gives buyers access to through an \u003ca href=\&quot;295-external-integration\&quot;\u003eintegration\u003c/a\u003e, where the invite is the delivery.\u003c/li\u003e\n    \u003cli\u003eLinks to your socials, newsletter, portfolio, or YouTube, and support contacts like \&quot;email me if a link breaks\&quot;.\u003c/li\u003e\n    \u003cli\u003eCalls and commissions, where the work you do for the buyer is the deliverable, and coffee products, which have no deliverable by design.\u003c/li\u003e\n    \u003cli\u003eBundles, where buyers receive the products you put inside the bundle.\u003c/li\u003e\n    \u003cli\u003eMemberships and newsletters with nothing attached yet because you publish the content later. Having nothing attached is never the problem by itself.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eA product that has real files or content is never affected by this, no matter how its description mentions other platforms.\u003c/p\u003e\n  \u003ch3\u003eDealing with violation of our Terms\u003c/h3\u003e\n  \u003cp\u003eIf you share, promote, or sell content that violates the guidelines listed above, it is a violation of our Terms of Service. \u003c/p\u003e\n  \u003cp\u003eDepending on the situation, we may be forced to suspend your account and refund your sales. This is our prerogative as detailed in section 11.3 of \u003ca href=\&quot;https://gumroad.com/terms\&quot; target=\&quot;_blank\&quot;\u003eour Terms\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eBut if that is not the case, and we are able to pay you:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eIf your product is found to violate our Terms, the product will be removed but you will still be allowed to operate the account. \u003c/li\u003e\n    \u003cli\u003eOn the second violation, you will be given a two week notice, paid out for your remaining sales, and your account will be deleted.\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;156-gumroad-and-adult-content\&quot;\u003e\u003cspan\u003eAdult content on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;64-is-gumroad-for-me\&quot;\u003e\u003cspan\u003eWhy choose Gumroad?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;70-can-i-sell-services\&quot;\u003e\u003cspan\u003eSell digital services: freelancing, coaching, and tip jars\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;51-what-is-gumroads-refund-policy\&quot;\u003e\u003cspan\u003eGumroad&#39;s refund policy\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;160-suspension\&quot;\u003e\u003cspan\u003eAccount suspension FAQ\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-ac
