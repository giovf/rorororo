    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;YcrF4rScHhO/LbRHtx88ByRRbLoEOpTyBEd435czVHg=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;xSeqJIvuM2B4xh5EG3W7Xx0bfPe9yHf36VsCrsGfL4yB41r1QUUCjps1x8D_o_Tx-pgtHN7gfz3NsrWwz6be4g&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Adding PayPal to checkout - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Adding PayPal to checkout&quot;,&quot;slug&quot;:&quot;275-paypal-connect&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003ch3\u003eIn this article:\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#overview\&quot;\u003eOverview\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#eligibility\&quot;\u003eEligibility Requirements\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#setup\&quot;\u003eSet up\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#balancepage\&quot;\u003ePayouts page\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#refunds\&quot;\u003eRefunds\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#chargebacks\&quot;\u003eChargebacks\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#salestaxpay\&quot;\u003eSales tax and payment details\u003c/a\u003e\n      \u003cul\u003e\n        \u003cli\u003e\u003ca href=\&quot;#taxrefund\&quot;\u003eSales tax refunds\u003c/a\u003e\u003c/li\u003e\n      \u003c/ul\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#affiliates\&quot;\u003eAffiliates and PayPal Connect\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#privacy\&quot;\u003ePrivacy\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#nsfw\&quot;\u003eNSFW accounts\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#review\&quot;\u003ePayPal account under review\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#disconnect\&quot;\u003eDisconnect your PayPal account\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;overview\&quot;\u003eOverview\u003c/h3\u003e\n  \u003cp\u003eYou can allow customers to pay with PayPal by setting up PayPal Connect in your Gumroad checkout. While optional, this gives buyers another payment method and can also improve conversions.\u003c/p\u003e\n  \u003cp\u003eIt&#39;s available to creators from countries where PayPal operates, except Algeria, Brazil, Egypt, India, Israel, Japan, Federated States of Micronesia, Morocco, and Türkiye.\u003c/p\u003e\n  \u003cp\u003eAdditionally, amounts arrive from your buyer&#39;s email in the default currency of your PayPal account.\u003c/p\u003e\n  \u003ch3 id=\&quot;eligibility\&quot;\u003eEligibility Requirements\u003c/h3\u003e\n  \u003cp\u003eIn addition to being in a supported country, you must have set up how you receive payouts — such as a bank account or PayPal payout email — on the \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003ePayments settings\u003c/a\u003e page.\u003c/p\u003e\n  \u003ch3 id=\&quot;setup\&quot;\u003eSet up \u003c/h3\u003e\n  \u003cp\u003ePayPal Connect is a checkout setting, not a payout method — connecting PayPal lets your customers pay with PayPal at checkout, while your payouts are configured separately on the \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003ePayments settings\u003c/a\u003e page.\u003c/p\u003e\n  \u003cp\u003eOnce you meet the \u003ca href=\&quot;#eligibility\&quot;\u003eeligibility requirements\u003c/a\u003e, go to the \u003ca href=\&quot;https://gumroad.com/checkout/form\&quot;\u003eCheckout form settings\u003c/a\u003e page and find the PayPal section. You will be prompted to enter your PayPal email and validate the integration.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63b6adcfe0d50f5555840132/file-MJi0aQm9sf.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eIf you are using a VPN and experiencing difficulties, please disconnect the VPN and try again.\u003c/p\u003e\n  \u003ch3 id=\&quot;balancepage\&quot;\u003ePayouts page\u003c/h3\u003e\n  \u003cp\u003eSince PayPal sales arrive immediately in your PayPal, they are also on the \u003ca href=\&quot;https://gumroad.com/payouts\&quot;\u003ePayouts page\u003c/a\u003e under ‘PayPal Payouts.’ What looks suspiciously like a “PayPal fee” is the amount already paid out to your connected PayPal account at the time of sale.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63b6aed4b31bcd14df2c40e8/file-tV621SjyeU.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;refunds\&quot;\u003eRefunds\u003c/h3\u003e\n  \u003cp\u003eWith PayPal Connect, you can still \u003ca href=\&quot;47-how-to-refund-a-customer\&quot;\u003erefund customers\u003c/a\u003e via the \u003ca href=\&quot;https://gumroad.com/customers\&quot;\u003ecustomer&#39;s tab\u003c/a\u003e; you just have to ensure you have enough balance in your PayPal account for the refund. We will also refund our fees and any VAT/GST.\u003c/p\u003e\n  \u003cp\u003ePayPal will, however, charge a fee to process refunds, and sellers pay those fees – not Gumroad.\u003c/p\u003e\n  \u003ch3 id=\&quot;chargebacks\&quot;\u003eChargebacks\u003c/h3\u003e\n  \u003cp\u003eUnlike credit card purchases, sellers must \u003ca href=\&quot;https://www.paypal.com/us/webapps/mpp/security/resolve-disputes\&quot;\u003ehandle all chargebacks (disputes) on PayPal purchases\u003c/a\u003e. PayPal will send you an email notification and a link to address the dispute. You can also reach out to PayPal Support for assistance.\u003c/p\u003e\n  \u003ch3 id=\&quot;salestaxpay\&quot;\u003eSales tax and payment details\u003c/h3\u003e\n  \u003cp\u003eWhen a PayPal sale has VAT/GST added, you will see the tax listed under “Sales Tax” in your PayPal payment details. In the ‘Partner Commission,’ you will also see the VAT/GST and Gumroad’s fee added together. Both the ‘PayPal Fee’ and the ‘Partner Commission’ will be deducted from the ‘Gross Amount’ to derive the ‘Net Amount.’\u003c/p\u003e\n  \u003ch3 id=\&quot;taxrefund\&quot;\u003eSales tax refunds\u003c/h3\u003e\n  \u003cp\u003eCustomers can claim VAT/GST refunds with a valid tax ID number on PayPal purchases.\u003c/p\u003e\n  \u003cp\u003eWhen VAT/GST refunds happen, part of the refund is deducted from the seller’s net amount in their PayPal account to cover the refund. \u003c/p\u003e\n  \u003cp\u003eBut why?\u003c/p\u003e\n  \u003cp\u003ePayPal’s API has limitations – they don’t allow Gumroad to fully refund VAT/GST from Gumroad’s account alone. Gumroad and the seller have to “contribute” towards the tax refund.\u003c/p\u003e\n  \u003cp\u003eBut all is not lost. Gumroad will then auto-credit the seller’s Gumroad balance for the amount deducted in PayPal to cover the VAT/GST refund. The next available weekly payout will then include this credit.\u003c/p\u003e\n  \u003ch3 id=\&quot;affiliates\&quot;\u003eAffiliates and PayPal Connect\u003c/h3\u003e\n  \u003cp\u003eAll affiliate credits on Gumroad, including PayPal sales, are added to the affiliate’s Gumroad balance and paid out weekly. \u003c/p\u003e\n  \u003cp\u003eOn the seller’s ‘Payment Details,’ the affiliate’s fee is included in the ‘Partner Commission.’\u003c/p\u003e\n  \u003ch3 id=\&quot;privacy\&quot;\u003e Privacy \u003c/h3\u003e\n  \u003cp\u003ePayPal Connect sales will allow customers to see the seller’s name and email in the transaction details. For greater privacy, you can create a ‘Business’ PayPal account that would only disclose the company name and email. Otherwise, we suggest disconnecting PayPal Connect from your account.\u003c/p\u003e\n  \u003ch3 id=\&quot;nsfw\&quot;\u003eNSFW Accounts\u003c/h3\u003e\n  \u003cp\u003ePayPal Connect is disabled for sales of NSFW products, this is due to \u003ca href=\&quot;https://www.paypal.com/webapps/mpp/ua/legalhub-full\&quot;\u003ePayPal’s ToS\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eIf your account likely violates \u003ca href=\&quot;https://www.paypal.com/webapps/mpp/ua/legalhub-full\&quot;\u003ePayPal’s ToS\u003c/a\u003e, we’d recommend you don’t use PayPal Connect.\u003c/p\u003e\n  \u003ch3 id=\&quot;review\&quot;\u003ePayPal account under review\u003c/h3\u003e\n  \u003cp\u003eIn rare cases, PayPal may place accounts under review and withhold payments. If this happens, please contact PayPal Support for more assistance.\u003c/p\u003e\n  \u003ch3 id=\&quot;disconnect\&quot;\u003eDisconnect your PayPal account\u003c/h3\u003e\n  \u003cp\u003eYou can disconnect your PayPal account on \u003ca href=\&quot;https://gumroad.com/checkout/form\&quot;\u003ethe page\u003c/a\u003e where you connected it.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63b6afa8d0b6de7e3be2a5e6/file-oRrgscg9q7.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eHowever, you cannot disconnect your PayPal if you have a membership product with active recurring payments. You have to cancel all existing memberships first, wait until those memberships expire, then proceed to disconnect.\u003c/p\u003e\n  \u003cp\u003eIf the connected PayPal account is the only way we can pay you, meaning you have no bank account, no PayPal payout email, and no connected Stripe account on the \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003ePayments settings\u003c/a\u003e page, we ask you to confirm before disconnecting. In that situation your payouts stop, you will usually be unable to publish products, and you cannot reconnect PayPal here until you set up a payout method, because connecting requires payout information to already be in place. Set up your payout method first if you want to keep getting paid. In countries we pay out to a local bank account, adding a bank account is the only option; everywhere else you save a PayPal payout email.\u003c/p\u003e\n  \u003cp\u003eAlternatively, you can cancel Gumroad’s access to your PayPal account in your PayPal settings. However, this will lead to a failure of all payments going to your PayPal account.\u003c/p\u003e\n  \u003cp\u003eAlso, if you disconnect your PayPal account, then later try to reconnect it in Gumroad without success, please get in touch with PayPal Support. It’s likely your ‘payments receivable’ in your PayPal account got set to ‘false,’ and PayPal Support can help you reset it.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;66-gumroads-fees\&quot;\u003e\u003cspan\u003eGumroad&#39;s fees\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;282-how-do-purchases-work-for-my-customers\&quot;\u003e\u003cspan\u003eHow Gumroad works for customers\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;330-stripe-connect\&quot;\u003e\u003csp
