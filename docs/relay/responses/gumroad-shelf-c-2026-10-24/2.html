the only address on your business or government documents, see \u003ca href=\&quot;13-getting-paid#Address-verification-dK7mR\&quot;\u003eAddress verification\u003c/a\u003e. The document cannot match the account, so support has to help you sort it out.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cstrong\u003eChanging your country?\u003c/strong\u003e Save the country change by itself first. Your payout and identity details are tied to your country, so changing it clears your saved bank account, name, date of birth, address, and tax details. After the country update finishes, return to this page, re-enter your payout and identity details, and save again.\u003c/p\u003e\n  \u003cp\u003eA country change also forfeits unpaid amounts sitting on your current country&#39;s connected account, because those funds cannot be transferred to a new country&#39;s account. Amounts held in Gumroad&#39;s own payment accounts stay on your balance. If we can transfer the money, we will. When there is an amount at risk, the confirmation names it and asks you to type \&quot;I understand\&quot; before Confirm is enabled. A country change is blocked while a payout is in progress. See \u003ca href=\&quot;https://gumroad.com/terms#section-11-4\&quot;\u003eSection 11.4\u003c/a\u003e of the Terms of Service.\u003c/p\u003e\n  \u003ch3\u003eChoosing your account type\u003c/h3\u003e\n  \u003cp\u003eFirst, choose how you will operate – either as an individual or as a business:\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63b6b07ebfe3f971fb093bce/file-IGvUdtWuhl.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eChoose ‘Individual’ if you operate under your name (effectively as a sole proprietor) or do not have business registration documents. \u003c/p\u003e\n  \u003cp\u003eConversely, choose ‘Business’ if you already have business registration documents. \u003c/p\u003e\n  \u003cp\u003eFor businesses, the person on the Gumroad account acts as the ‘business representative’ and will need to submit registration documents and personal identification details, as well.\u003c/p\u003e\n  \u003ch3\u003eA. Identity verification (for bank payouts)\u003c/h3\u003e\n  \u003cp\u003e*If you only see PayPal as your payout option, skip to B.\u003c/p\u003e\n  \u003cp\u003eGumroad uses \u003ca href=\&quot;http://www.stripe.com/\&quot;\u003eStripe\u003c/a\u003e to process all credit card payments and bank payouts, and we are subject to Stripe’s policies and regulations. Stripe is required to follow \u003ca href=\&quot;https://support.stripe.com/questions/know-your-customer-obligations\&quot;\u003eKnow Your Customer obligations\u003c/a\u003e which tailor account verifications by country. \u003c/p\u003e\n  \u003cp\u003eAt some point, Stripe will request several of the following:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eYour date of birth, legal name, phone number, and address\u003c/li\u003e\n    \u003cli\u003eA government ID number (e.g., SSN or your country’s national ID)\u003c/li\u003e\n    \u003cli\u003eA scan or image of your photo ID (passport, driver’s license, or ID). \u003ca href=\&quot;https://support.stripe.com/questions/passport-id-or-drivers-license-upload-requirement\&quot;\u003eRead why.\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eCompany Tax ID and business registration document (if applicable)\u003c/li\u003e\n    \u003cli\u003eProof of home address (recent utility bill, bank statement, rental agreement, etc.)\u003c/li\u003e\n    \u003cli\u003ePhone number\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eAll information added and uploaded to Gumroad is encrypted and passed to Stripe for verification purposes. Unless you need help and email us your ID, Gumroad’s team will never see your submitted documents or banking information, nor will those be exposed to 3rd parties.\u003c/p\u003e\n  \u003ch3\u003eColombia: your personal ID number\u003c/h3\u003e\n  \u003cp\u003eIf your payout country is Colombia, the personal ID number field takes the digits of your Cédula de Ciudadanía (CC) or Cédula de Extranjería (CE). Enter the digits exactly as printed on your document. Any dots or spaces you type are ignored, but never add leading zeros — Stripe later checks the number against the document you upload, so padding it to reach a length will fail verification even if it is accepted now.\u003c/p\u003e\n  \u003cp\u003eStripe currently accepts 6 to 10 digits here, and Gumroad shows an error before saving if your number falls outside that. If your Cédula is shorter than 6 digits, do not pad it: \u003ca href=\&quot;mailto:support@gumroad.com\&quot;\u003eemail support\u003c/a\u003e instead so we can raise it with Stripe for you.\u003c/p\u003e\n  \u003ch3\u003eDominican Republic: your cédula\u003c/h3\u003e\n  \u003cp\u003eIf your payout country is the Dominican Republic, the personal ID field takes your Cédula de identidad y electoral (CIE), 13 characters including the dashes (for example, 123-1234567-1). It is required: without it Stripe pauses your payouts. A passport is not accepted in its place, so do not enter a passport number in this field.\u003c/p\u003e\n  \u003ch3\u003eUS tax ID numbers\u003c/h3\u003e\n  \u003cp\u003eIf you&#39;re \u003ca href=\&quot;https://support.stripe.com/questions/tax-id-verification-guidelines-by-business-type-in-the-us\&quot;\u003ein the USA\u003c/a\u003e, your Tax ID is usually the Employer Identification Number (EIN) assigned by the IRS. For individuals/sole proprietorships, you can provide your SSN if you don&#39;t have an EIN. For additional information on what name and TIN to provide, please see instructions on the \u003ca href=\&quot;https://www.irs.gov/pub/irs-pdf/fw9.pdf\&quot;\u003eIRS Form W-9\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eFor other countries, you can go through the list of Tax IDs accepted by our payment processor (Stripe) \u003ca href=\&quot;https://stripe.com/docs/tax/tax-ids#supported-tax-ids\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3\u003eB. Identity verification (for PayPal payouts)\u003c/h3\u003e\n  \u003cp\u003eIf you don&#39;t have bank payouts in your settings, simply add your name, address, phone number, and active PayPal account email. You do not need to submit an ID or other documents for PayPal payouts.\u003c/p\u003e\n  \u003cp\u003eBoth personal and business PayPal accounts are acceptable.\u003c/p\u003e\n  \u003ch3 id=\&quot;Sellers-under-18\&quot;\u003eSellers under 18\u003c/h3\u003e\n  \u003cp\u003eYou can sell on Gumroad from age 13. To be paid out, though, our payment partner has to verify whoever holds the payout account, and it will not verify someone under 18 on their own. So if you are 13 to 17, an adult — your parent or another legal guardian — has to be added to the account and take legal responsibility for it.\u003c/p\u003e\n  \u003cp\u003eYou stay the owner of the account and of everything you sell. Your guardian is added alongside you purely so the account can be verified; they do not take over your account, your products, or your earnings.\u003c/p\u003e\n  \u003cp\u003eIn your payout settings you will see a \u003cstrong\u003eLegal guardian\u003c/strong\u003e section asking for their name, email, date of birth, address, and personal ID number, plus their acceptance of our payment partner’s agreement. Your guardian has to accept that themselves — it is their agreement, not yours. Once those details are complete, your payouts start on your next payout date.\u003c/p\u003e\n  \u003cp\u003eUntil then you can sell normally and your balance is safe. It stays in your Gumroad account and is paid out once the guardian details are in.\u003c/p\u003e\n  \u003cp\u003eThis is currently available to sellers in the United States. If you are under 18 in another country, our payment partner has no legal-guardian route there yet, so we cannot pay you out until you turn 18 — you can still sell in the meantime and your balance is held for you.\u003c/p\u003e\n  \u003ch3\u003eFrequently asked questions: \u003c/h3\u003e\n  \u003cp\u003e\u003cstrong\u003eQ: Can I choose not to enter my information into the payout settings?\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eA: No. You must fill out the payout settings.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eQ: Can I change from bank payouts to PayPal payouts?\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eA: No.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;275-paypal-connect\&quot;\u003e\u003cspan\u003eAdding PayPal to checkout\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;330-stripe-connect\&quot;\u003e\u003cspan\u003eConnect your Stripe account to Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gum
