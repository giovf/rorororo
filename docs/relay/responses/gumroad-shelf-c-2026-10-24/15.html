    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;Ptoy965IlO0KZzu12C6189Mv5lcdSwBJtjsMp8pzRD0=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;7TrH_ADBV39QYb5I_3U5W9D8wbWYDFzH3Q8nHhzCJWgCfBbGpQHJvLucPqYUCZRMXbp6rC9XvSUxvd9x1GOPMw&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Payout delays - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Payout delays&quot;,&quot;slug&quot;:&quot;281-payout-delays&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e Creators are typically paid once a week, on the weekday that matches how they get paid (\u003ca href=\&quot;13-getting-paid#payout-day\&quot;\u003ehere&#39;s how to find your payout day\u003c/a\u003e, and \u003ca href=\&quot;13-getting-paid\&quot;\u003ehere&#39;s how payouts work\u003c/a\u003e). However, payouts can sometimes be delayed—see reasons below. If yours is delayed by more than one week, please \u003ca href=\&quot;mailto:support@gumroad.com\&quot;\u003eemail us\u003c/a\u003e. \u003c/p\u003e\n  \u003ch3\u003eReason 1: You haven&#39;t been reviewed yet\u003c/h3\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63e57a8bd2459a27d10c91e4/file-UfndQSL5SI.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003e When you sell products on Gumroad, we handle payments and take on the legal and financial responsibility for your products on behalf of our banking partners. This is a core part of Gumroad: we deal with banks, credit cards, and PayPal so you can focus on creating. \u003c/p\u003e\n  \u003cp\u003e In order to do business with you, we have to be sure that your products are legitimate and safe to sell. For this, we need data about your sales. We look for proof that your products are real, your customers are receiving what they paid for, and your sales don&#39;t raise red flags with our payment partners or pose a risk to our bottom line. For a list of products you cannot sell on Gumroad, \u003ca href=\&quot;155-things-you-cant-sell-on-gumroad\&quot;\u003eread our guidelines here\u003c/a\u003e. \u003c/p\u003e\n  \u003cp\u003e Once we confirm this, we mark your account as \&quot;compliant,\&quot; notify our banking partners that you&#39;re approved, and begin paying out your earnings.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003e\u003cem\u003eCool story. So, why is my account still not reviewed?\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e So - some background: \u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eFraudsters\u003c/strong\u003e are constantly testing out Gumroad as a means of laundering money, and they are \u003cem\u003every good\u003c/em\u003e at mimicking legitimate products and sales. We catch a few hundred of these accounts every month during the risk review process. As a result of these malicious actors, we have to be \u003cem\u003eextremely\u003c/em\u003e cautious and thorough in our risk reviews.\u003c/p\u003e\n  \u003cp\u003eYour account is still in the review process because we likely don&#39;t have enough data from your account. Your sales have not yet demonstrated that your account can be supported, so we are not yet able to hand you over to our banking partners.\u003c/p\u003e\n  \u003cp\u003e For example:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eYou may not have enough sales\u003c/li\u003e\n    \u003cli\u003eSome of your sales may appear suspicious from a risk standpoint\u003c/li\u003e\n    \u003cli\u003eThe sales you have made are not legitimate (i.e. you&#39;ve been buying your own products) \u003c/li\u003e\n    \u003cli\u003eYou may have made multiple sales, but they&#39;re all to the same person\u003c/li\u003e\n    \u003cli\u003eIt&#39;s unclear what exactly your customers are paying you for (i.e. we&#39;re not sure if your products violate our Terms of Service)\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e Whatever the reason, we have not been able to confidently review your sales and hand you over to our banking partners. \u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eHow to verify this: \u003cbr\u003e\n    \u003c/strong\u003eIf you go to \u003ca href=\&quot;http://www.gumroad.com/balance\&quot;\u003eyour balance page\u003c/a\u003e and see a message that your account is under review (see above), that means your account is still under review.  \u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eWhat to do: \u003cbr\u003e\n    \u003c/strong\u003eWe kindly ask that you wait until you&#39;ve made 2-3 more sales, then email us for clarification. We cannot speed up the review for you, and we cannot provide everyone with \u003cem\u003especific\u003c/em\u003e information about why their account hasn&#39;t been reviewed, but we can at least answer the questions that you have. \u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eWhat happens to your payouts while you wait: \u003cbr\u003e\n    \u003c/strong\u003eEvery payout day that comes around before your account has been reviewed is skipped, and we do not send you an email for each skipped payout. That can mean several payout days pass without a payment.\u003c/p\u003e\n  \u003cp\u003eNone of the money is lost. Your earnings stay on your account as your balance, including the earnings from the payouts that were skipped in the meantime, and the review stops holding them once your account is marked compliant. They then go out on your first payout day where the rest of what a payout needs is also in place: your balance has reached your minimum payout amount, your payout details are saved and accepted by our payment partner, payouts on your account aren&#39;t paused, and no earlier payout is still processing.\u003c/p\u003e\n  \u003cp\u003eYour \u003ca href=\&quot;https://gumroad.com/payouts\&quot;\u003epayouts\u003c/a\u003e page is where you can check on this. If your balance has reached your minimum payout amount, the page shows a note about the most recent skipped payout. If your balance is still under that amount, the page shows your balance and the minimum instead. Reaching the minimum does not by itself start your payouts while your account has not been reviewed: both have to be resolved before a payout goes out.\u003c/p\u003e\n  \u003ch3\u003e Reason 2: There&#39;s an issue with your bank or PayPal account \u003c/h3\u003e\n  \u003cp\u003e It&#39;s also possible that we \u003cem\u003ehave\u003c/em\u003e been attempting to send money to your bank, or your PayPal account, but they are blocking the money. You may have entered incorrect information in your \u003ca href=\&quot;http://gumroad.com/settings/payments\&quot;\u003ePayment Settings\u003c/a\u003e, or there may be a lock on your PayPal account. \u003c/p\u003e\n  \u003cp\u003eWhen our payment partner will not accept a bank account you saved, we email you, and the email tells you which of these applies:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eThe account holder name was rejected.\u003c/strong\u003e Change it in your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayment settings\u003c/a\u003e so it matches the name registered with your bank exactly, using the characters your bank requires. Some countries are strict about this: Japanese accounts need Katakana, Vietnamese accounts need unaccented Latin characters (no diacritics), and Indonesian accounts need Latin characters.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eThe details don&#39;t match the format banks in your country use.\u003c/strong\u003e Correct them in your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayment settings\u003c/a\u003e. Waiting will not clear this one, because we keep getting the same answer until the details change.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eYour bank or branch isn&#39;t in our payment partner&#39;s records yet.\u003c/strong\u003e This is common for a newly opened account or a recently added bank. If your details are correct, you don&#39;t need to do anything: we re-check once a week for up to 8 weeks, and we only email you again if we still can&#39;t verify it.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eOur payment partner won&#39;t accept that particular account.\u003c/strong\u003e This happens when the account is on their block list, when payments or payouts to it have failed before, or when they cannot send payouts to that bank at all. Nothing is wrong with the details you entered, so re-entering them or waiting will not help. Add a different account you hold in your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayment settings\u003c/a\u003e. If the problem is with that one account, another account at the same bank works; if our partner cannot pay out to the bank itself, you need an account at a different bank. If a different account isn&#39;t an option for you, reply to the email we sent and we&#39;ll work out another way to pay you.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eYour \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayment settings\u003c/a\u003e page also shows a message about the rejected bank account while it is still outstanding, and in most cases that message names which of the reasons above applies and what to do about it, so you can pick the steps back up there if you no longer have the email. A rejected account holder name is the exception: only the email names that one, so follow the steps in it and correct the name in your settings. If the page says nothing about your bank account and the email doesn&#39;t tell you what to change, reply to it and we&#39;ll look into it with you.\u003c/p\u003e\n  \u003cp\u003eClearing a bank account problem does not on its own mean your next payout goes out. Your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayment settings\u003c/a\u003e page shows anything still outstanding on your account, such as identity verification, and your \u003ca href=\&quot;https://gumroad.com/payouts\&quot;\u003epayouts\u003c/a\u003e page tells you whether your balance has reached your minimum payout threshold yet.\u003c/p\u003e\n  \u003cp\u003eWhen PayPal refuses a payout because of the PayPal account itself, we email you and also show a note on your \u003ca href=\&quot;https://gumroad.com/payouts\&quot;\u003epayouts\u003c/a\u003e page naming the restriction and what to change. There are two of these:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003ePayments cannot be received in the country on your PayPal account&#39;s address.\u003c/strong\u003e Nothing you change inside that account fixes this, so we stop retrying the payout instead of failing it again every week. To get paid, add a bank account in your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayment settings\u003c/a\u003e if we pay out to banks in your country, or save a different PayPal account that can receive US dollars. Either one starts your payouts again on its own.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eYour PayPal account cannot receive US dollars.\u003c/strong\u003e All PayPal payouts are sent in US dollars. You can fix this on the account you already use: sign in to PayPal and add US dollars to the currencies your account accepts. We keep retrying on your usual payout schedule, so once that is in place the next payout goes out without you telling us. Adding a bank account or saving a different PayPal account that can receive US dollars also works.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eYour balance is safe either way and stays on your account while you sort it out. If payouts on your account are also on hold, or paused in your own \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayment settings\u003c/a\u003e, fixing the PayPal side is not enough by itself: resume your own pause there, and reply to the email we sent about the failed payout so we can review any hold on our side and release your balance.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eWhat to do:\u003c/strong\u003e\u003cbr\u003e\n    For any other PayPal problem, or if you did not receive an email about your bank or PayPal account, email us and we can look into it for you.\u003c/p\u003e\n  \u003ch3\u003eReason 3: There is an issue with your account \u003c/h3\u003e\n  \u003cp\u003e If this is the case, you may have received an email from us telling you that we were unable to pay you. You would have received this email because your account was skipped during payouts due to a security issue, a compliance issue, or a problem with your payout settings. It&#39;s usually nothing to worry about, but the email can be a little scary sometimes.  \u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eWhat to do:\u003c/strong\u003e\u003cbr\u003e\n    Email us and we can look into it for you.\u003c/p\u003e\n  \u003ch3\u003eReason 4: There is an issue with your verification\u003c/h3\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/stripe-verification-ui.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003ePayouts may be paused by our payment processor if you have not completed your account&#39;s identity or business verification. You can check your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003ePayment Settings\u003c/a\u003e page for details on what is missing or why your verification is failing.\u003c/p\u003e\n  \u003ch3\u003eReason 5: Your payouts are paused or reduced\u003c/h3\u003e\n  \u003cp\u003eYour payouts may be paused by the Gumroad administrator for a security review or if there is any unusual activity detected on the account. You can check your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003ePayment Settings\u003c/a\u003e page for details on why your payouts have been paused.\u003c/p\u003e\n  \u003cp\u003eIf your \u003ca href=\&quot;134-how-does-gumroad-handle-chargebacks\&quot;\u003echargeback rate\u003c/a\u003e goes above 1.5% of your sales volume over the last 365 days, we automatically hold back part of each payout. We keep 25% of your balance in reserve and pay out up to the other 75%. You can get less than 75%, because we pay out whole days of sales at a time and your usual payout minimum still applies.\u003c/p\u003e\n  \u003cp\u003eWe check held accounts every day. When your rate is back at or under 1.5%, we lift the hold for you, and you do not need to contact us. The hold only covers money Gumroad holds for you, so sales paid directly to your own \u003ca href=\&quot;330-stripe-connect\&quot;\u003eStripe\u003c/a\u003e or \u003ca href=\&quot;275-paypal-connect\&quot;\u003ePayPal\u003c/a\u003e account at the time of sale are not held. If your account is also suspended, flagged for review, or held for another reason, payouts stay held until that is resolved separately.\u003c/p\u003e\n  \u003ch3\u003eReason 6: Today \u003cem\u003emight not\u003c/em\u003e actually be your pay day\u003c/h3\u003e\n  \u003cp\u003e We often have creators write in asking why they had not been paid on a day they expected money, and when we investigate the situation we see that they were not, in fact, supposed to have received money. \u003c/p\u003e\n  \u003cp\u003e Two things decide when money reaches you. The first is your payout day: payouts do not all go out on the same weekday, and yours depends on how you get paid (\u003ca href=\&quot;13-getting-paid#payout-day\&quot;\u003esee the list of payout days\u003c/a\u003e). If your payouts go out on Tuesdays, nothing is wrong when a Friday passes without a payment.\u003c/p\u003e\n  \u003cp\u003e The second is the payout period. As per \u003ca href=\&quot;13-getting-paid\&quot;\u003eGetting Paid\u003c/a\u003e, each payout covers sales made \u003cem\u003eup to the previous Friday\u003c/em\u003e, no matter which weekday you are paid on. For example:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eSales made from \u003cstrong\u003eJune 1–7\u003c/strong\u003e would be paid out in the week of \u003cstrong\u003eFriday, June 14\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003eSales made from \u003cstrong\u003eJune 8–14\u003c/strong\u003e would be paid out in the week of \u003cstrong\u003eFriday, June 21\u003c/strong\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e In other words, the money sent out to you has to have come from a sale that is \u003cem\u003eat least 7 days old\u003c/em\u003e. If you make a sale on a Tuesday, you would not be receiving the profits from that sale three days later, unfortunately. You would have to wait for the following week&#39;s payout. In visual terms: \u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/6260e1386c886c75aabe8dd4/file-2RvnwJQNOe.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3\u003eReason 7: Your sales are not legitimate (or made by yourself)\u003c/h3\u003e\n  \u003cp\u003e Another reason your account may be stuck in review is that you are purchasing your own products. We understand you might do this to \&quot;test\&quot; our payment system or to boost your products on Discover, but purchases made by the creator are not considered legitimate sales, so they do not get paid out even after reaching a $100 balance. Our banking partners view these transactions as a form of money laundering, and we are required to refund them when we find them. \u003c/p\u003e\n  \u003cp\u003e Only sales made by real customers count as legitimate, and we only process payouts for those. To get paid, focus on making real sales to real customers. \u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;13-getting-paid\&quot;\u003e\u003cspan\u003eGetting paid by Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;269-balance-page\&quot;\u003e\u003cspan\u003eThe payouts dashboard\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot
