    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;U324hmExK9w0Ng44kbTf60Fg/Fy3tinfD1H5q4E7Dc8=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;PR8v_rlIRVYicP3GLiE3vs_Eht2LmvZcyGXYSOx7eQ8gM1l8FR8NAnbd8WWzVU0n1M_Shp3Bv85vOoadSVqImQ&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Sell digital services: freelancing, coaching, and tip jars - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Sell digital services: freelancing, coaching, and tip jars&quot;,&quot;slug&quot;:&quot;70-can-i-sell-services&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cb\u003eIn this article:\u003c/b\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#commission\&quot; target=\&quot;_self\&quot;\u003eCommission\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#call\&quot; target=\&quot;_self\&quot;\u003eCall\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Coffee-RJr6f\&quot; target=\&quot;_self\&quot;\u003eCoffee\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Restrictions-48CS_\&quot;\u003eRestrictions\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eIf your account is 30 days old, you can offer services like scheduled calls and commissioned work, and also accept tips on Gumroad!\u003c/p\u003e\n  \u003cp\u003eGo to your \u003ca href=\&quot;https://gumroad.com/products/\&quot; target=\&quot;_self\&quot;\u003eProducts dashboard\u003c/a\u003e, click New product, and select a service product to begin.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/new-product.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eWe also recommend reading \u003ca href=\&quot;149-adding-a-product\&quot; target=\&quot;_self\&quot;\u003ethis article\u003c/a\u003e as creating a service-type product is similar to creating a digital product.\u003c/p\u003e\n  \u003ch3 id=\&quot;commission\&quot;\u003eCommission\u003c/h3\u003e\n  \u003cp\u003eCommissions allow you to sell unique tailored work or services to your customers. We collect 50% of the total amount from the customer as the up-front deposit, and the remaining half after the project’s completion.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eNote: \u003c/strong\u003eThe 50% deposit is added to your balance when the customer pays it, and is paid out on your normal payout schedule like any other sale. It is not held until the commission is completed.\u003c/p\u003e\n  \u003cp\u003eYou can ask the customer to upload any instructions or files required for your project by using input fields in the Content tab.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/commission-content.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eThe customers&#39; inputs will be available in the Order information section of their drawer in the \u003ca href=\&quot;https://gumroad.com/customers/\&quot; target=\&quot;_self\&quot;\u003eSales dashboard\u003c/a\u003e. You can also refund the customer’s deposit if you wish to reject their commission.\u003c/p\u003e\n  \u003cp\u003eOnce you have completed the commission, open the customer’s drawer, upload the files, and mark the project completed. We will send an email to the customer informing them about the completion.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/commission-sales.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eAfter the commission is completed, we will charge the customer the remaining 50% of the total amount and credit the earnings to your Gumroad balance.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eAlways sell commissioned work through the Commission product type\u003c/strong\u003e, not as a regular digital product. The Commission type handles the deposit and completion flow correctly, and selling commissions any other way can trigger a review of your account.\u003c/p\u003e\n  \u003cp\u003eBecause commission sales involve larger one-off payments from individual customers, accounts that sell mostly commissions may need to build up a track record before payouts are released. If your account is under review, you will need at least 5 sales from distinct customers to establish that track record. We recommend selling digital products, such as finished pieces, asset packs, or tutorials, alongside your commissions. This builds your sales history faster and makes your account less likely to be held for review.\u003c/p\u003e\n  \u003ch3 id=\&quot;call\&quot;\u003eCall\u003c/h3\u003e\n  \u003cp\u003eThe Call product features built-in scheduling, allowing you to offer seamless one-on-one sessions with your customers. \u003c/p\u003e\n  \u003cp\u003eAfter giving your product a cover, description, and base price, choose the durations you want to offer the calls for and any additional amount for each duration.\u003c/p\u003e\n  \u003cp\u003eSet your availability by selecting dates and times, and customize booking parameters such as minimum notice periods and daily call limits to optimize your schedule.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/call-edit.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eIn the content tab, customize your call experience with input fields to gather essential information from customers. You can also add any content or files, just as you would with a traditional digital product!\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/call-content.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eInput provided by the customers will be saved in the customer’s drawer on your Sales dashboard. While we don’t integrate with platforms like Google Meet or Zoom yet, you can create a call and save the link in the Call link field.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/call-sales.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eWe will send you and the customer a reminder email 24 hours before the call with the call information and link (if applicable).\u003c/p\u003e\n  \u003ch3 id=\&quot;Coffee-RJr6f\&quot;\u003eCoffee\u003c/h3\u003e\n  \u003cp\u003eGive your Coffee product page a header and a short message for your supporters.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/6694a2d3e1989867dceff3a9/file-xt3NQVSfKe.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eYou can only have one Coffee-type product with its URL set to [username].gumroad.com/coffee. While you cannot change this URL, you can set up a \u003ca href=\&quot;153-setting-up-a-custom-domain\&quot; target=\&quot;_self\&quot;\u003ecustom domain for this product\u003c/a\u003e if you wish.\u003c/p\u003e\n  \u003cp\u003eAlong with the default suggested amount, you can enable two additional amounts. Your supporters will also have the option to tip any other amount of their choice. Unlike selling a digital product, you cannot add content to a Coffee product.\u003c/p\u003e\n  \u003cp\u003eSelect your preferred call to action from Donate, Support, or Tip. Finally, save and publish your product to start getting some coffee!\u003c/p\u003e\n  \u003cp\u003eWhen you receive a tip, it will show in your Sales dashboard like a regular sale, and your supporters will also receive a receipt in their email inbox.\u003c/p\u003e\n  \u003ch3 id=\&quot;Restrictions-48CS_\&quot;\u003eRestrictions\u003c/h3\u003e\n  \u003cp\u003eServices are handled differently than digital products because they are much riskier financially. Services often experience high chargeback rates and can also put us into legal gray areas where we are responsible for something we have no control over. Due to such reasons, you cannot sell the following types of services on Gumroad:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eInstallation or tech support services. Your customer pays you on Gumroad, and you install or manage software for them remotely.\u003c/li\u003e\n    \u003cli\u003eFixing someone&#39;s roof, redesigning their website, or any other kind of in-person or prolonged service contract.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eIf you’re found selling such services, we will be forced to close your account and refund any existing balance in your account.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;155-things-you-cant-sell-on-gumroad\&quot;\u003e\u003cspan\u003eThings not allowed on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;149-adding-a-product\&quot;\u003e\u003cspan\u003eAdding a product\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;160-suspension\&quot;\u003e\u003cspan\u003eAccount suspension FAQ\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Sell digital services: freelancing, coaching, and tip jars - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,&quot;content&quot;:&quot;authenticity_token&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-token&quot;,&quot;name&quot;:&quot;csrf-token&quot;,&quot;content&quot;:&quot;JmtD7xhSkBwH8MM3A2uK6k21XITVxvXZSYzOflGY50o7RzVttAXYSFNdz5SeH_BzVr4I38OdvEvu05Cr9LkW3A&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&q
