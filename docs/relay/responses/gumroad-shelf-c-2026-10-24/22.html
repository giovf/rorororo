    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;XOZ9S+hZ+1RtwyNpM/RAQwo4onORPP0YqHe9nvKg2u0=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;xxMZ5VsYb5OuGbMf7VOiMJ_s5YdzJx8VUmEVA2tzJB1sqTzj-Bohb_UHe53DXQrKBp7g5TkrcAUaUvTa12kBKA&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Connecting AI assistants to your Gumroad store - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Connecting AI assistants to your Gumroad store&quot;,&quot;slug&quot;:&quot;355-connect-ai-assistants-to-gumroad&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eIn this article:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#what-it-is\&quot;\u003eWhat the Gumroad connector is\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#availability\&quot;\u003eWhich assistants you can connect\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#connect-claude\&quot;\u003eConnecting Claude\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#can-do\&quot;\u003eWhat your assistant can do\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#cannot-do\&quot;\u003eWhat your assistant cannot do\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#permissions\&quot;\u003eWhat you are granting access to\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#revoke\&quot;\u003eRevoking access\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#troubleshooting\&quot;\u003eTroubleshooting\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3 id=\&quot;what-it-is\&quot;\u003eWhat the Gumroad connector is\u003c/h3\u003e\n  \u003cp\u003eGumroad runs a server that speaks MCP (Model Context Protocol), so an AI assistant that supports MCP can work with your store from your chat. You connect your Gumroad account once, sign in through Gumroad, and then you can ask the assistant things like \&quot;show my recent sales\&quot; or \&quot;draft a product called Photo Pack for $12\&quot;.\u003c/p\u003e\n  \u003cp\u003eNothing about your store changes. Products, customers, sales, and payouts all stay in Gumroad, and customers still pay through Gumroad checkout. The connector is a way to read your store&#39;s data and make a few changes from chat instead of from your dashboard.\u003c/p\u003e\n\n  \u003ch3 id=\&quot;availability\&quot;\u003eWhich assistants you can connect\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003eClaude:\u003c/strong\u003e available now as a custom connector. Your Claude plan or your organization&#39;s settings have to allow custom connectors.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eMuse:\u003c/strong\u003e submitted for review. The Gumroad connector is not yet available in Muse.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eChatGPT:\u003c/strong\u003e not available yet. We will announce it when it is.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eSetup instructions for every assistant we support are also at \u003ca href=\&quot;https://gumroad.com/mcp\&quot;\u003egumroad.com/mcp\u003c/a\u003e.\u003c/p\u003e\n\n  \u003ch3 id=\&quot;connect-claude\&quot;\u003eConnecting Claude\u003c/h3\u003e\n  \u003col\u003e\n    \u003cli\u003eIn Claude, open \u003cstrong\u003eSettings \u0026gt; Connectors\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003eChoose \u003cstrong\u003eAdd custom connector\u003c/strong\u003e, then paste this URL: \u003ccode\u003ehttps://gumroad.com/claude/v1/mcp\u003c/code\u003e\u003c/li\u003e\n    \u003cli\u003eIf you do not see the option to add a custom connector, your plan or your organization administrator controls it.\u003c/li\u003e\n    \u003cli\u003eWhen Claude opens a Gumroad sign-in page, sign in and review the permissions you are asked to grant.\u003c/li\u003e\n    \u003cli\u003eIn a chat, select the Gumroad connector and try asking \&quot;Show my Gumroad products.\&quot;\u003c/li\u003e\n  \u003c/ol\u003e\n  \u003cp\u003eYour assistant can only see the Gumroad account you signed in with. If you sell from more than one account, connect the one you want to work with.\u003c/p\u003e\n\n  \u003ch3 id=\&quot;can-do\&quot;\u003eWhat your assistant can do\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eRead your name, username, storefront URL, and currency.\u003c/li\u003e\n    \u003cli\u003eList your products, newest first, with their prices, including pay-what-you-want minimum and suggested prices.\u003c/li\u003e\n    \u003cli\u003eRead a single product&#39;s description and, with sales access, its sales count and revenue.\u003c/li\u003e\n    \u003cli\u003eCreate a new product as an unpublished draft.\u003c/li\u003e\n    \u003cli\u003ePublish or unpublish a product you own.\u003c/li\u003e\n    \u003cli\u003eList your recent sales, including the buyer&#39;s email address, the product, the amount, and the time.\u003c/li\u003e\n    \u003cli\u003eList your recent payouts and their status.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eDrafts created from chat have no files attached. Add the files in Gumroad and check the name, price, and description before you publish anything.\u003c/p\u003e\n\n  \u003ch3 id=\&quot;cannot-do\&quot;\u003eWhat your assistant cannot do\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eTake a payment or run checkout. Customers always pay through Gumroad.\u003c/li\u003e\n    \u003cli\u003eUpload files, covers, or content to a product.\u003c/li\u003e\n    \u003cli\u003eRefund a sale, or change your payout destination or payout schedule.\u003c/li\u003e\n    \u003cli\u003eDelete a product.\u003c/li\u003e\n    \u003cli\u003eChange a product&#39;s price or description after it exists. Only a draft&#39;s name, price, and description can be set, and that is at the moment it is created.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eAnything outside that list, do in your Gumroad dashboard.\u003c/p\u003e\n\n  \u003ch3 id=\&quot;permissions\&quot;\u003eWhat you are granting access to\u003c/h3\u003e\n  \u003cp\u003eThe connector asks for permission for the specific things it needs. You can grant some and not others:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003cstrong\u003ePublic profile\u003c/strong\u003e and \u003cstrong\u003eprofile\u003c/strong\u003e: your name, username, and storefront basics.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eProducts\u003c/strong\u003e: read your products, create drafts, and publish or unpublish them.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eSales\u003c/strong\u003e: read your recent sales, including buyer email addresses.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003ePayouts\u003c/strong\u003e: read your payout amounts and status.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eAccount\u003c/strong\u003e: full access to your account, which is wider than the connector needs.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eSales access means the assistant can read your customers&#39; email addresses, so grant it only if you are comfortable with that. If you deny a permission, the assistant simply cannot use the tools that need it and will say which one it is missing.\u003c/p\u003e\n\n  \u003ch3 id=\&quot;revoke\&quot;\u003eRevoking access\u003c/h3\u003e\n  \u003cp\u003eRevoke the connection any time under \u003ca href=\&quot;https://gumroad.com/settings/authorized_applications\&quot;\u003eAuthorized Applications\u003c/a\u003e in your Gumroad settings. Disconnecting or deleting the connector inside your AI app does not revoke its access token, so revoke it in Gumroad to actually end the connection.\u003c/p\u003e\n\n  \u003ch3 id=\&quot;troubleshooting\&quot;\u003eTroubleshooting\u003c/h3\u003e\n  \u003cp\u003e\u003cstrong\u003eI cannot find \&quot;Add custom connector\&quot; in Claude.\u003c/strong\u003e Custom connectors depend on your Claude plan and your organization&#39;s settings. If you are on a team plan, an administrator may need to enable them for you.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eThe assistant says it cannot find my products.\u003c/strong\u003e Check that you connected the Gumroad account that owns them, and that you granted product access during sign-in. If you connected the wrong account, revoke access and connect again.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eA tool says it needs a permission.\u003c/strong\u003e Reconnect the assistant and grant the permission it names. Nothing else changes when you do.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003ePublishing from chat fails.\u003c/strong\u003e Publishing needs the same things it needs in your dashboard: a confirmed email address, payouts set up for your account, and shipping destinations if you sell physical products. A product that Gumroad has taken down also cannot be published. Fix that in Gumroad, then ask the assistant to publish again.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eThe assistant created a draft I cannot sell.\u003c/strong\u003e Drafts start with no files. Add your files to the product in Gumroad, then publish it there or ask the assistant to publish it.\u003c/p\u003e\n  \u003cp\u003eIf something else is not working, email \u003ca href=\&quot;mailto:support@gumroad.com\&quot;\u003esupport@gumroad.com\u003c/a\u003e and tell us which assistant you connected.\u003c/p\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Connecting AI assistants to your Gumroad store - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,&quot;content&quot;:&quot;authenticity_token&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;
