    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;X1D9L1nXwVV1iWfz3l3NQrbqvfjvrN5deO/hJEPZeqk=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;lfCh5TZhk4fXRT7Y2DzvmtEymMbNm5drUQgTSdHoO1z95Mu2HXxl1SejdwACAaWiDT0sOZcTM674Oh1L0MrJnQ&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Does Gumroad issue form 1099-K and 1099-MISC? - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Does Gumroad issue form 1099-K and 1099-MISC?&quot;,&quot;slug&quot;:&quot;15-1099s&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cdiv class=\&quot;callout-yellow\&quot;\u003e\n    \u003cp\u003e\u003cstrong\u003eDisclaimer:\u003c/strong\u003e This article is neither legal advice nor tax advice. We recommend that you speak to your tax advisor with any questions or concerns about tax reporting.\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cp\u003e\u003cstrong\u003eIn this article:\u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#1099-K\&quot;\u003eWill I get a 1099-K?\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#1099-MISC\&quot;\u003eWill I get a 1099-MISC?\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#PayPal\&quot;\u003eDoes the form include Stripe and PayPal sales?\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#ETA\&quot;\u003eWhen can I expect the form to reach me?\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#mismatch\&quot;\u003eThe 1099 amount doesn&#39;t match my payouts\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#corrections\&quot;\u003eHow to report corrections?\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#dac7\&quot;\u003eDAC7 and other countries\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;1099-K\&quot;\u003eWill I get a 1099-K?\u003c/h3\u003e\n  \u003cp\u003eDo you meet all of the following criteria in the previous calendar year? \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eThe account is based in the United States\u003c/li\u003e\n    \u003cli\u003eMore than $20,000 USD in total gross volume\u003c/li\u003e\n    \u003cli\u003eMore than 200 transactions\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eIf yes, then yes you will receive a 1099-K from our payment processor (Stripe). If you do not meet any of those criteria, sorry, you won&#39;t be getting a 1099-K.\u003c/p\u003e\n  \u003cp\u003eYou can download your 1099-K for all eligible years from the \u003ca href=\&quot;https://gumroad.com/payouts/taxes\&quot;\u003eTax center\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eThe 1099-K is a purely informational form that summarizes the sales activity of your account and is designed to assist you in reporting your taxes. For more help understanding your 1099-K, go to \u003ca href=\&quot;http://www.irs.gov/Businesses/Understanding-Your-1099-K\&quot;\u003eIRS.gov\u003c/a\u003e. You can also download a blank example of the 1099-K form \u003ca href=\&quot;http://www.irs.gov/pub/irs-pdf/f1099k.pdf\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3 id=\&quot;1099-MISC\&quot;\u003eWill I get a 1099-MISC?\u003c/h3\u003e\n  \u003cp\u003eThe 1099-MISC form is only applicable if you are an affiliate for other Gumroad creators. Affiliates with commissions greater than $600 USD in the previous financial year will receive a Form 1099-MISC.\u003c/p\u003e\n  \u003cp\u003eYou will only get either a 1099-MISC or 1099-K depending on the revenue amount, and whether you are selling your products or are earning commissions as an affiliate.\u003c/p\u003e\n  \u003ch3 id=\&quot;PayPal\&quot;\u003eDoes the form include Stripe and PayPal sales?\u003c/h3\u003e\n  \u003cp\u003ePayments processed through \u003ca href=\&quot;330-stripe-connect\&quot; target=\&quot;_self\&quot;\u003eStripe Connect\u003c/a\u003e and \u003ca href=\&quot;275-paypal-connect\&quot; target=\&quot;_self\&quot;\u003ePayPal Connect\u003c/a\u003e are \u003ci\u003enot\u003c/i\u003e included in your 1099-K. You will have to request a separate 1099-K for those sales from the respective platforms.\u003c/p\u003e\n  \u003ch3 id=\&quot;ETA\&quot;\u003eWhen can I expect the form to reach me?\u003c/h3\u003e\n  \u003cp\u003eWe start filing the 1099s in January each year (for the last year&#39;s earnings). Stripe then submits the form to the IRS electronically.\u003c/p\u003e\n  \u003cp\u003eYou can expect the form to reach you starting Jan-end to March. \u003c/p\u003e\n  \u003ch3 id=\&quot;mismatch\&quot;\u003eThe 1099 amount doesn&#39;t match my payouts\u003c/h3\u003e\n  \u003cp\u003eForm 1099-Ks only serve as a rough approximation for the funds you&#39;ve received. As a payment service, we would need to report our transactional volume attached to you, not the amount paid to you.\u003c/p\u003e\n  \u003cp\u003e\u003ca href=\&quot;https://www.irs.gov/payments/general-faqs-on-new-payment-card-reporting-requirements\&quot; target=\&quot;_blank\&quot;\u003eHere&#39;s an IRS link\u003c/a\u003e with FAQs on how payment handlers (like Gumroad) need to report the earnings, which says: \&quot;\u003cem\u003eGross payment card and third party network transaction amounts are reported on the Form 1099-K, Payment Card and Third Party Network Transactions. The \&quot;gross amount\&quot; of reportable transactions means the total unadjusted dollar amount of aggregate payment transactions for each participating payee.\u003c/em\u003e\&quot;\u003c/p\u003e\n  \u003cp\u003eThe 1099 amounts will not align with your payout as the gross amount includes our fee, sales tax and VAT collected at checkout (which are not disclosed to you as we remit those ourselves), affiliate commissions, etc. Also, as mentioned above, the 1099K does not include your sales via Stripe or PayPal Connect, and there is at least a \u003ca href=\&quot;13-getting-paid#schedule\&quot;\u003e7-day gap\u003c/a\u003e between when a sale occurs vs. when it is paid out, which can add to the mismatch.\u003c/p\u003e\n  \u003cp\u003eNote that transactions are assigned to tax years based on the date the funds became available (usually a couple of days after the charge), not the date of the sale. This means sales made in the last days of December may appear on the following year&#39;s form. For a transaction-by-transaction breakdown of your form, request the \&quot;Transaction report\&quot; listed under your 1099-K on the \u003ca href=\&quot;https://gumroad.com/payouts/taxes\&quot; target=\&quot;_blank\&quot;\u003eTaxes page\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003ePlease use the 1099s as a marker, not as an end-all-be-all.\u003c/strong\u003e\u003c/p\u003e\n  \u003ch3 id=\&quot;corrections\&quot;\u003eHow to report corrections?\u003c/h3\u003e\n  \u003cp\u003eIf there&#39;s some obvious mistake in Form 1099 like:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003ePayee Name or TIN is incorrect\u003c/li\u003e\n    \u003cli\u003eShould&#39;ve been filed as a business but was filed as an individual\u003c/li\u003e\n    \u003cli\u003e\u003cem\u003eHuge\u003c/em\u003e difference between the actual and reported earnings\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003ePlease report such discrepancies by \u003ca href=\&quot;mailto:support@gumroad.com\&quot;\u003econtacting our support team\u003c/a\u003e. We will work with our payment processor and file for a correction ASAP.\u003c/p\u003e\n  \u003ch3 id=\&quot;dac7\&quot;\u003eDAC7 and other countries\u003c/h3\u003e\n  \u003cp\u003eGumroad does not file DAC7 reports, and it does not file reports under Germany&#39;s Platform Tax Transparency Act (Plattformen-Steuertransparenzgesetz). We do not report your sales to any tax authority under those regimes, and no such report appears in your dashboard.\u003c/p\u003e\n  \u003cp\u003eThe seller details you enter in your payment settings (your name, address, nationality, and any tax ID) are collected to pay you and to meet our payment processors&#39; verification requirements, not to report under those regimes.\u003c/p\u003e\n  \u003cp\u003eThe only tax information returns Gumroad issues are the US forms described above, and only for eligible United States sellers. This is not a statement about whether a reporting obligation applies, and it is not tax advice about what you need to file where you live. Talk to your tax adviser about that.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;13-getting-paid\&quot;\u003e\u003cspan\u003eGetting paid by Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Does Gumroad issue form 1099-K and 1099-MISC? - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,&quot;content&quot;:&quot;authenticity_token&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-token&quot;,&quot;name&quot;:&quot;csrf-token&quot;,&quot;content&quot;:&quot;Er_8rwNkMjWRXzixTTO5gDnfCCNS8qYD6U_JQFNqTQh6q5b8KHnEZ2G5cWmXDvO45dC83Ah6AsZAfcdCUki_yQ&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-charset&quot;,&quot;charset&quot;:&quot;utf-8&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-property-fb-app_id&quot;,&quot;property&quot;:&quot;fb:app_id&quot;,&quot;content&quot;:&quot;149071038533330&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-property-fb-page_id&quot;,&quot;property&quot;:&quot;fb:page_id&quot;,&quot;content&quot;:&quot;http://www.facebook.com/
