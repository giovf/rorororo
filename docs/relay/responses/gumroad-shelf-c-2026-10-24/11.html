    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;V42ctvt+kyVSCEurL6V7gd9XRKQbYmBRcRXAu8E7DUs=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;4n4txXcrfCQu8OD9QoWRQA3vPtS5vFOv3qf9RabbSglFHZMq5lroNLNvdR9EeqaFpXbMW6lB6w7smZD4ia6D4A&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Defining fraud on Gumroad - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Defining fraud on Gumroad&quot;,&quot;slug&quot;:&quot;161-what-gumroad-considers-fraud&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cspan\u003eIn this article:\u003c/span\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#What-constitutes-fraud-WhqKy\&quot; target=\&quot;_self\&quot;\u003eWhat constitutes \&quot;fraud\&quot;\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Why-we-suspend-and-disable-accounts-YpCTa\&quot; target=\&quot;_self\&quot;\u003eWhy we suspend and disable accounts\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Why-was-my-account-permanently-suspended--6YShV\&quot; target=\&quot;_self\&quot;\u003eWhy was my account permanently suspended?\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;What-constitutes-fraud-WhqKy\&quot;\u003eWhat constitutes \&quot;fraud\&quot;\u003c/h3\u003e\n  \u003cp\u003eWe can&#39;t actually provide a thorough definition of fraud here, as that would amount to opening up our playbook to the opposing team. Suffice to say, \&quot;fraud\&quot; on Gumroad can be broadly defined as attempting to violate our \u003ca href=\&quot;https://gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e, or to profit from the Gumroad payment system in such a way that is potentially damaging to Gumroad&#39;s business model.\u003c/p\u003e\n  \u003cp\u003eSeveral indicators that we use to detect fraud are: \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eAn account with a higher-than-average chargeback rate. Read more about chargebacks \u003ca href=\&quot;134-how-does-gumroad-handle-chargebacks\&quot;\u003ehere\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eTransaction anomalies - stolen credit cards being used, suspicious IP addresses, evidence of someone running stolen cards or PayPal accounts on your products\u003c/li\u003e\n    \u003cli\u003eCopyright violations, i.e., a Gumroad creator is selling goods they don&#39;t own the rights to\u003c/li\u003e\n    \u003cli\u003eHigh fraud scores as indicated by our risk model, taking into account location, purchase data, red flags on sales\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eOur sophisticated risk models have an exceptional degree of accuracy across a high volume of sales. That said, they are always being improved upon, and all account suspensions are manually reviewed by our risk team.\u003c/p\u003e\n  \u003ch3 id=\&quot;Why-we-suspend-and-disable-accounts-YpCTa\&quot;\u003eWhy we suspend and disable accounts\u003c/h3\u003e\n  \u003cp\u003eAs a company, we assist creators in earning a living doing what they love; part of that assistance warrants actions and engagements with partners that are regulated by federal and state regulatory bodies.\u003c/p\u003e\n  \u003cp\u003eCompliance with regulatory mandates requires us to take certain steps, some of which are implemented to ensure that we identify and mitigate fraud as well as protect and uphold a pleasant buying experience for the consumer.\u003c/p\u003e\n  \u003cp\u003eThis means we must not only suspend accounts deemed to be fraudulent, but we have to refund all money transferred to those accounts back to its customers.\u003c/p\u003e\n  \u003cp\u003eIn order to protect our business and credit line, we are required to shut down accounts that violate our terms of service, have evidence of fraud, or pose a high risk of chargebacks. If your account has been suspended, please contact our support team for more information.\u003c/p\u003e\n  \u003ch3 id=\&quot;Why-was-my-account-permanently-suspended--6YShV\&quot;\u003eWhy was my account permanently suspended? \u003c/h3\u003e\n  \u003cp\u003eYour account was suspended for either:\u003c/p\u003e\n  \u003cp\u003e1) Violating our \u003ca href=\&quot;https://gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e, i.e. selling goods that are not allowed on Gumroad. You can see those \u003ca href=\&quot;https://gumroad.com/help/article/155-things-you-cant-sell-on-gumroad\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003e2) Your sales were either highly suspicious or showed indications of fraud, money laundering, or use of stolen/hacked accounts\u003c/p\u003e\n  \u003cp\u003eEither way, your account was deemed by Gumroad or its banking partners as a financial liability and we had to remove it from our system.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;156-gumroad-and-adult-content\&quot;\u003e\u003cspan\u003eAdult content on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;155-things-you-cant-sell-on-gumroad\&quot;\u003e\u003cspan\u003eThings not allowed on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;70-can-i-sell-services\&quot;\u003e\u003cspan\u003eSell digital services: freelancing, coaching, and tip jars\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;134-how-does-gumroad-handle-chargebacks\&quot;\u003e\u003cspan\u003eChargebacks on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Defining fraud on Gumroad - Gumroad Help Center&quot;}
