rification process\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#schedule\&quot;\u003ePayout schedule\u003c/a\u003e\u003c/li\u003e\n    \u003cul\u003e\n      \u003cli\u003e\u003ca href=\&quot;#payout-day\&quot;\u003eYour payout day\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\&quot;#instant-payouts\&quot;\u003eInstant payouts\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#paypal-connect\&quot;\u003eEnable payments via PayPal\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#review\&quot;\u003eThe account review process\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;payout-modes\&quot;\u003ePayout modes\u003c/h3\u003e\n  \u003cdiv class=\&quot;callout-yellow\&quot;\u003e\n    \u003cp\u003e\u003cb\u003eNote: \u003c/b\u003eHow your buyers pay you and how you get paid out are two separate things. Gumroad accepts many payment methods at checkout, including cards, PayPal, and local methods such as UPI in India, and which ones a buyer sees depends on where the \u003ci\u003ebuyer\u003c/i\u003e is. Your payout is not affected by any of that. In general, sales land in your Gumroad balance and are then paid out to you the one way you have set up below, in your own payout currency. The exception is \u003ca href=\&quot;#paypal-connect\&quot;\u003ePayPal sales when you have connected your own PayPal account\u003c/a\u003e, which are credited to you at the time of sale instead.\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cp\u003eWe support direct bank deposits in the local currency for most countries. For countries where bank deposits are not available, we offer PayPal transfers as the only payment option.\u003c/p\u003e\n  \u003cp\u003eWe do \u003ci\u003enot\u003c/i\u003e support alternative payout modes like Payoneer, Wise, check, money order, wire transfer, etc. If your country is not supported by direct bank deposits or PayPal, then unfortunately, we have no way to pay you out for now.\u003c/p\u003e\n  \u003cp\u003eTo get paid for your sales, start by filling out your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003ePayments Settings\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3 id=\&quot;bank-account\&quot;\u003eGet paid to your bank account\u003c/h3\u003e\n  \u003cdiv class=\&quot;callout-yellow\&quot;\u003e\n    \u003cp\u003e\u003cb\u003eNote: \u003c/b\u003eUnpaid amounts on a country-specific connected account cannot move to a new country&#39;s account, so changing payout country (or switching payout method in a way that needs a new connected account) forfeits those amounts. Amounts in Gumroad&#39;s own payment accounts are not forfeited. If we can transfer the money, we will. The confirmation names the amount and asks you to type \&quot;I understand\&quot;. Wait for any payout in progress to finish first. See \u003ca href=\&quot;https://gumroad.com/terms#section-11-4\&quot;\u003eSection 11.4\u003c/a\u003e of the Terms of Service.\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cp\u003eWe currently support bank payouts in the following countries:\u003c/p\u003e\n  \u003cdiv class=\&quot;table-responsive\&quot;\u003e\n    \u003ctable class=\&quot;table\&quot;\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eCountry\u003c/th\u003e\n          \u003cth\u003ePayout Currency\u003c/th\u003e\n          \u003cth\u003eCountry\u003c/th\u003e\n          \u003cth\u003ePayout Currency\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eAlbania\u003c/td\u003e\n          \u003ctd\u003eALL (min 3,000)\u003c/td\u003e\n          \u003ctd\u003eAlgeria\u003c/td\u003e\n          \u003ctd\u003eDZD\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eAngola\u003c/td\u003e\n          \u003ctd\u003eAOA (min 23,000)\u003c/td\u003e\n          \u003ctd\u003eAntigua and Barbuda\u00 03e\n  \u003cp\u003e\u003cb\u003eNote:\u003c/b\u003e Countries showing \&quot;(min X)\&quot; have a higher minimum payout threshold than the standard $100 USD requirement.\u003c/p\u003e\n  \u003cp\u003eWe can only pay out to a local bank account and in your local currency. We cannot pay you out in USD if it is not listed above as your country&#39;s payout currency. All currency conversions happen based on the exchange rates at the time of sale, not at the time of the payout. These are typically mid-market rates that you can estimate \u003ca href=\&quot;https://dashboard.stripe.com/currency_conversion\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eFor prompt payouts, please ensure that you have the following for the country you select: \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eA valid, government-issued photo ID\u003c/li\u003e\n    \u003cli\u003eProof of residence in that country, or a business registered there\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eIf you sell as a business, your bank account must be in the country where your business is registered. For example, a US LLC needs a US bank account. You can live in another country and use your real home address.\u003c/p\u003e\n  \u003cp\u003eDepending on your country, bank payouts can take 2-7 business days to process, and can be delayed around bank holidays.\u003c/p\u003e\n  \u003ch3 id=\&quot;paypal\&quot;\u003eGet paid to PayPal\u003c/h3\u003e\n  \u003cp\u003eIf bank payouts aren&#39;t supported in your country, we will pay you via PayPal. You just need an individual or business PayPal account without any restrictions.\u003c/p\u003e\n  \u003cp\u003eAll PayPal payouts are processed in USD and usually arrive within 1–3 business days.\u003c/p\u003e\n  \u003cp\u003ePayPal payouts have a 2% payout fee.\u003c/p\u003e\n  \u003cp\u003e\u003ci\u003eNote:\u003c/i\u003e PayPal does not allow accounts registered in some countries to \u003ci\u003ereceive\u003c/i\u003e money, even though we can offer PayPal there. Where we also do not support bank payouts — Zambia, Syria, Russia, Iraq and a number of others — there is currently no way for us to pay out to a creator in that country unless their PayPal account is registered elsewhere. We show a note on your \u003ca href=\&quot;https://gumroad.com/payouts\&quot;\u003epayouts\u003c/a\u003e page and in your payout settings when this applies to your country, and if a payout is rejected for this reason we email you and stop retrying it, because the same rejection comes back every time. Your balance stays on your account. To get paid you need a PayPal account registered in a country PayPal can pay into, or a bank account if we pay out to banks in your country; see \u003ca href=\&quot;281-payout-delays\&quot;\u003epayout delays\u003c/a\u003e for the full steps.\u003c/p\u003e\n  \u003ch3 id=\&quot;Stripe-verification-process-ZFq5c\&quot;\u003eVerification process\u003c/h3\u003e\n  \u003cp\u003eOur payment processor, Stripe, requires additional information to verify the identity of the account holder after a certain amount of time has passed and sales accrued. This is a standard practice in the financial industry and is part of their \u003ca href=\&quot;https://support.stripe.com/questions/know-your-customer-obligations\&quot;\u003eKnow Your Customer (KYC) obligations\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003e\u003ci\u003eNote:\u003c/i\u003e In rare cases, Stripe makes a final decision to reject an account. If that happens, we email you once to let you know, verification requests stop, and any remaining balance of $1 or more is paid out automatically even if it is below the usual $100 minimum, unless we are separately holding your balance for another reason, such as an open review of your account, suspected fraud, or misleading or deceptive marketing, in which case it stays held until that is resolved. Your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayments settings page\u003c/a\u003e shows your account status. See \u003ca href=\&quot;160-suspension\&quot;\u003ethis article\u003c/a\u003e for details.\u003c/p\u003e\n  \u003ch3\u003eID verification\u003c/h3\u003e\n  \u003cp\u003eYou can learn the correct documents needed for ID verification for your specific location \u003ca href=\&quot;https://docs.stripe.com/connect/handling-api-verification?country=CA\u0026amp;document-type=identity#acceptable-verification-documents\&quot;\u003ehere\u003c/a\u003e. \u003c/p\u003e\n  \u003ch4\u003eBefore you upload your ID\u003c/h4\u003e\n  \u003cul\u003e\n    \u003cli\u003eUse a color photo or scan. You can take it with a phone, webcam, or scanner.\u003c/li\u003e\n    \u003cli\u003eFor a driver&#39;s license or identity card, upload images of both the front and back of the ID.\u003c/li\u003e\n    \u003cli\u003eUse a JPEG or PNG file.\u003c/li\u003e\n    \u003cli\u003eDo not upload a PDF.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;Address-verification-dK7mR\&quot;\u003eAddress verification\u003c/h3\u003e\n  \u003cp\u003eYou can learn the correct documents needed for address verification for your specific location \u003ca href=\&quot;https://docs.stripe.com/connect/handling-api-verification?country=CA\u0026amp;document-type=address#acceptable-verification-documents\&quot;\u003ehere\u003c/a\u003e. \u003c/p\u003e\n  \u003cp\u003e\u003ci\u003eIf your registered address is a P.O. Box:\u003c/i\u003e Stripe does not accept a P.O. Box as the address on the account, so your payout settings have to carry a different address. If the only address printed on your documents is that P.O. Box, the document will keep being rejected for not matching the account, and uploading it again will not change the outcome. Email \u003ca href=\&quot;mailto:support@gumroad.com\&quot;\u003esupport@gumroad.com\u003c/a\u003e and we will work out with you which address and document can be used.\u003c/p\u003e\n  \u003ch3\u003eSocial Security number (SSN)\u003c/h3\u003e\n  \u003cp\u003eSSN is required for US sellers. The name and date of birth on your SSN must match exactly with the information filled in your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003ePayments Settings\u003c/a\u003e. Refer to your social security card to see how your name is formatted, and enter your name in the settings exactly as it is on the card. If you have a middle name, you can add it to the First Name field on the settings page.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eIf you don&#39;t have your Social Security card, or if you believe you&#39;ve entered the correct information but still receive an error, please contact the Social Security Administration. You can request a copy of your card or update your name here: https://www.ssa.gov/ssnumber/ \u003c/p\u003e\n  \u003ch3 id=\&quot;schedule\&quot;\u003ePayout schedule\u003c/h3\u003e\n  \u003cdiv class=\&quot;callout-red\&quot;\u003e\n    \u003cp\u003e\u003cb\u003e⚠️ You need a minimum balance of $100 USD to receive a payout.\u003c/b\u003e Some countries have higher local currency minimums—see the \&quot;(min X)\&quot; values in the \u003ca href=\&quot;#bank-account\&quot;\u003etable above\u003c/a\u003e.\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cp\u003eYou can choose to get paid daily, weekly, monthly, or quarterly, and set your own payout threshold. Daily payouts are only available for US users with eligible bank accounts and at least 4 prior payouts. They ride the same rail as \u003ca href=\&quot;#instant-payouts\&quot;\u003einstant payouts\u003c/a\u003e, so the 60-day account requirement described there applies to them as well. You can also pause and resume payouts anytime.\u003c/p\u003e\n  \u003cp\u003ePayouts include sales made through the previous Friday (UTC). On the weekly, monthly, and quarterly schedules, a sale has a minimum 7-day holding period in your Gumroad balance before it becomes eligible for payout. Daily and \u003ca href=\&quot;#instant-payouts\&quot;\u003einstant\u003c/a\u003e payouts do not wait 7 days: they pay whatever balance Stripe has already made available to your account. A daily payout covers sales made through the previous day (UTC); an instant payout you trigger yourself can include sales from the same day.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63bb91fed851444a9b4d27ef/file-5kClaU1t2C.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eYou can download a CSV report for each payout from the \u003ca href=\&quot;269-balance-page\&quot;\u003ePayouts dashboard\u003c/a\u003e, which includes a breakdown of all \u003ca href=\&quot;66-gumroads-fees\&quot;\u003eGumroad fees\u003c/a\u003e and customer data. \u003c/p\u003e\n  \u003ch3 id=\&quot;payout-day\&quot;\u003eYour payout day\u003c/h3\u003e\n  \u003cp\u003ePayouts do not all go out on the same weekday. Your payout day depends on how you get paid: whether you get paid to a bank account or to PayPal, and which country your bank account is in.\u003c/p\u003e\n  \u003ctable class=\&quot;table\&quot;\u003e\n    \u003cthead\u003e\n      \u003ctr\u003e\n        \u003cth\u003ePayout day\u003c/th\u003e\n        \u003cth\u003eHow you get paid\u003c/th\u003e\n      \u003c/tr\u003e\n    \u003c/thead\u003e\n    \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003cstrong\u003eTuesday\u003c/strong\u003e\u003c/td\u003e\n        \u003ctd\u003eBank accounts in any country not listed below, for example the Philippines, India, Japan, Mexico, Nigeria, Saudi Arabia, South Africa, and Turkey\u003c/td\u003e\n      \u003c/tr\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003cstrong\u003eWednesday\u003c/strong\u003e\u003c/td\u003e\n        \u003ctd\u003eEuro bank accounts, and bank accounts in Australia, Bulgaria, Canada, Czechia, Denmark, Gibraltar, Hungary, Liechtenstein, Norway, Poland, Singapore, South Korea, Sweden, Switzerland, the UAE, and the UK\u003c/td\u003e\n      \u003c/tr\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003cstrong\u003eThursday\u003c/strong\u003e\u003c/td\u003e\n        \u003ctd\u003eUS bank accounts and US debit cards\u003c/td\u003e\n      \u003c/tr\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003cstrong\u003eFriday\u003c/strong\u003e\u003c/td\u003e\n        \u003ctd\u003ePayPal, and creators paid through their own \u003ca href=\&quot;330-stripe-connect\&quot;\u003econnected Stripe account\u003c/a\u003e\u003c/td\u003e\n      \u003c/tr\u003e\n    \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003eYour payout day does not change which sales a payout covers. Every payout still includes sales made through the previous Friday (UTC), so a Tuesday payout on the 28th covers the same sales as a Friday payout on the 31st of that same week.\u003c/p\u003e\n  \u003cp\u003eThe date shown on your \u003ca href=\&quot;269-balance-page\&quot;\u003ePayouts dashboard\u003c/a\u003e is your own payout day, so that is the day to expect the money to be sent. Bank transfers can then take a few business days to land, depending on your bank.\u003c/p\u003e\n  \u003cp\u003eIf you have set your payouts to monthly or quarterly, they still go out on your payout day, just in the month or quarter you chose. Daily payouts are the exception: those are sent every day rather than on one weekday.\u003c/p\u003e\n  \u003ch3 id=\&quot;instant-payouts\&quot;\u003eInstant payouts\u003c/h3\u003e\n  \u003cp\u003eCreators from the US can get paid within minutes for amounts up to $10K and a 3% fee. Instant payouts are available only to creators from the US who have completed at least one payout and whose Stripe account has been processing with Gumroad for at least 60 days.\u003c/p\u003e\n  \u003cp\u003eIf you also get paid through your own \u003ca href=\&quot;330-stripe-connect\&quot;\u003econnected Stripe account\u003c/a\u003e, that account needs to have been connected for at least 60 days as well. Replacing a Stripe account you already had does not start those 60 days again, but connecting a rail for the first time does.\u003c/p\u003e\n  \u003cp\u003eIf you are eligible for an instant payout, you will see the option to get paid instantly on your \u003ca href=\&quot;https://gumroad.com/payouts\&quot;\u003ePayouts dashboard\u003c/a\u003e. \u003c/p\u003e\n  \u003cp\u003eInstant payouts are not subject to the 7-day holding period that applies on the weekly, monthly, and quarterly \u003ca href=\&quot;#schedule\&quot;\u003eschedules\u003c/a\u003e. What limits an instant payout is how much of your balance Stripe has already settled, so a recent sale can be included as soon as those funds are available. There is no $100 minimum on instant payouts: you can request one for any settled amount of $1 or more. The $100 minimum still applies to weekly, monthly, and quarterly payouts.\u003c/p\u003e\n  \u003cp\u003eNot all debit cards are eligible for instant payouts. If you connect a debit card and still see a message to connect a debit card to receive instant payouts, the card you connected is not eligible. You will need to try a different card. \u003c/p\u003e\n  \u003ch3 id=\&quot;paypal-connect\&quot;\u003eEnable payments via PayPal\u003c/h3\u003e\n  \u003cp\u003eIf you have \u003ca href=\&quot;275-paypal-connect\&quot;\u003econnected your PayPal account\u003c/a\u003e with Gumroad, proceeds from all sales via PayPal will be credited to your connected account at the time of sale, in the default currency of your PayPal account. This appears on your \u003ca href=\&quot;269-balance-page\&quot;\u003ePayouts page\u003c/a\u003e as \&quot;PayPal Payouts\&quot;.\u003c/p\u003e\n  \u003ch3 id=\&quot;review\&quot;\u003eThe account review process\u003c/h3\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63bb9209d0b6de7e3be2a8e4/file-5aTUwIGukY.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eFor our review, we require your account to be legitimate in two major ways:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eYou comply with both \u003ca href=\&quot;https://gumroad.com/terms\&quot;\u003eGumroad&#39;s terms\u003c/a\u003e and those of our payment processors.\u003c/li\u003e\n    \u003cli\u003eYour account is not racking up chargebacks and suspicious purchases.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eThe review process can take 1-3 weeks depending on your sales and the data we can analyze. Typically, this means 3-4 sales with a balance over US$100; however, every account is unique so we thank you for your patience. \u003c/p\u003e\n  \u003cp\u003eYou cannot speed up the review process by purchasing your own product. Payment processors view purchasing your own products as fraudulent, and this can get you suspended or permanently banned. If you just want to test your product, please use the \u003ca href=\&quot;62-testing-a-purchase\&quot;\u003etest purchase feature\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eThere can be other reasons for a payout delay that you can know more about here: \u003ca href=\&quot;281-payout-delays\&quot;\u003ePayout delays\u003c/a\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;66-gumroads-fees\&quot;\u003e\u003cspan\u003eGumroad&#39;s fees\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;64-is-gumroad-for-me\&quot;\u003e\u003cspan\u003eWhy choose Gumroad?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;281-payout-delays\&quot;\u003e\u003cspan\u003ePayout delays\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;15-1099s\&quot;\u003e\u003cspan\u003eDoes Gumroad issue form 1099-K and 1099-MISC?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;330-stripe-connect\&quot;\u003e\u003cspan\u003eConnect your Stripe account to Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Getting paid by Gumroad - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,&quot;content&quot;:&quot;authenticity_token&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-token&quot;,&quot;name&quot;:&quot;csrf-token&quot;,&quot;content&quot;:&quot;ut42mkw4VECWF_7RwzsXWgt4NpUBFQ4ld8c1wZ8lCx2C5ntFD5Jbg74999x6IWaFnq__x8dHyAUxYwQf6SDvww&quot;},{&quot;ta
