    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;fgeH1eza8gMi705yRJbM8xhKofmJBsNdaDPEcrHPEUI=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;6oYvuzW-5zZaqW2L9f-9iZGG61AH9FbWL9gNYAKb0ver6xu4W7BsX4tFpIIpyiBeQ-U7WERX20g_8TXCZkCgZg&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Why choose Gumroad? - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Why choose Gumroad?&quot;,&quot;slug&quot;:&quot;64-is-gumroad-for-me&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eGumroad is perfect for anyone who makes and sells products. Writers, musicians, filmmakers, SaaS developers, educators (and all in-between) can sell on Gumroad to a worldwide audience. \u003c/p\u003e\n  \u003ch3\u003eSimple setup, powerful sales\u003c/h3\u003e\n  \u003cp\u003eOnce you create an account, you can start selling products on Gumroad quickly.\u003c/p\u003e\n  \u003cp\u003eJust \u003ca href=\&quot;149-adding-a-product\&quot;\u003echoose a product type\u003c/a\u003e and start creating:\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/start-creating.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eOnce your product is live, send your audience to your Gumroad \u003ca href=\&quot;124-your-gumroad-profile-page\&quot;\u003eprofile page\u003c/a\u003e or place products \u003ca href=\&quot;44-build-gumroad-into-your-website\&quot;\u003eon your website\u003c/a\u003e to start selling.\u003c/p\u003e\n  \u003ch3\u003eManaging customers and sales\u003c/h3\u003e\n  \u003cp\u003eGumroad allows you to interact with your audience through \u003ca href=\&quot;169-how-to-send-an-update\&quot;\u003eemails\u003c/a\u003e, \u003ca href=\&quot;131-using-workflows-to-send-automated-updates\&quot;\u003edrip content\u003c/a\u003e, \u003ca href=\&quot;170-audience\&quot;\u003egrowing followers\u003c/a\u003e, and access to \u003ca href=\&quot;74-the-analytics-dashboard\&quot;\u003esales data\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eNot only that, it&#39;s easy to \u003ca href=\&quot;47-how-to-refund-a-customer\&quot;\u003eissue refunds\u003c/a\u003e, update product content, create \u003ca href=\&quot;128-discount-codes\&quot;\u003ediscount codes\u003c/a\u003e, and \u003ca href=\&quot;333-affiliates-on-gumroad\&quot;\u003eadd affiliates\u003c/a\u003e. Read more about interacting with customers \u003ca href=\&quot;169-how-to-send-an-update\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3\u003eGrow your audience on Discover\u003c/h3\u003e\n  \u003cp\u003eYour Gumroad profile and website aren&#39;t the only places where you can make sales. With \u003ca href=\&quot;79-gumroad-discover\&quot;\u003eDiscover\u003c/a\u003e, your products can appear on our site-wide marketplace. Discover works by recommending your products from search and getting you more customers beyond your typical audience.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/63b6b192d0b6de7e3be2a5ec/file-n0TJUXHpcG.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3\u003eA secure purchasing environment \u003c/h3\u003e\n  \u003cp\u003eAll credit card information is processed in a PCI-compliant environment certified by an independent auditor.\u003c/p\u003e\n  \u003cp\u003eEvery purchase on Gumroad takes place on an encrypted HTTP secure connection.\u003c/p\u003e\n  \u003cp\u003eYour customers&#39; download links are secure and require email verification if repeatedly used. \u003c/p\u003e\n  \u003ch3\u003eFees\u003c/h3\u003e\n  \u003cp\u003e\u003ca href=\&quot;66-gumroads-fees\&quot;\u003eGumroad seller fees\u003c/a\u003e are simple. We only charge a fee when you make a sale – no extra monthly charges. \u003c/p\u003e\n  \u003ch3\u003eGet Paid\u003c/h3\u003e\n  \u003cp\u003eAs long as you are able to receive money through PayPal, you can use Gumroad. Residents of some countries are able to \u003ca href=\&quot;13-getting-paid\&quot;\u003ereceive weekly payouts\u003c/a\u003e to their bank accounts.\u003c/p\u003e\n  \u003cp\u003eIf you are \u003cem\u003eunable\u003c/em\u003e to receive money through PayPal because PayPal doesn&#39;t work in your country, then we have no way to pay you, as we don&#39;t have alternate payment methods for people in this situation right now.\u003c/p\u003e\n  \u003ch3\u003eNeed help getting from $0 to $1?\u003c/h3\u003e\n  \u003cp\u003eStart with the \u003ca href=\&quot;149-adding-a-product#watch-a-walkthrough\&quot;\u003e2-minute beginner walkthrough\u003c/a\u003e of creating a course, adding content, publishing, and making a first sale.\u003c/p\u003e\n  \u003cp\u003eCheck out any of our following free resources:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;https://gumroad.com/university\&quot; target=\&quot;_blank\&quot;\u003eHow to use Gumroad\u003c/a\u003e - learn the ropes of selling online\u003c/li\u003e\n    \u003cli\u003eThe \u003ca href=\&quot;https://gumroad.gumroad.com/?section=o4PMUt5fxAqrAJY-iUaBCQ%3D%3D\&quot; target=\&quot;_blank\&quot;\u003eGumroad Blog\u003c/a\u003e and Gumroad&#39;s High Converting \u003ca href=\&quot;https://gumroad.com/gumroad\&quot; target=\&quot;_blank\&quot;\u003eSales Page Course\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eInspiring Stories from the \u003ca href=\&quot;https://www.youtube.com/@GumroadUniversity/videos\&quot; target=\&quot;_blank\&quot;\u003eGumroad Podcast\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003eOur page of \u003ca href=\&quot;https://gumroad.com/gumroadhelp\&quot; target=\&quot;_blank\&quot;\u003efree product examples\u003c/a\u003e - see how products work from a customer&#39;s perspective\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;155-things-you-cant-sell-on-gumroad\&quot; target=\&quot;_blank\&quot;\u003eThings that are not allowed on Gumroad\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;66-gumroads-fees\&quot;\u003e\u003cspan\u003eGumroad&#39;s fees\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;155-things-you-cant-sell-on-gumroad\&quot;\u003e\u003cspan\u003eThings not allowed on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;149-adding-a-product\&quot;\u003e\u003cspan\u003eAdding a product\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start sell
