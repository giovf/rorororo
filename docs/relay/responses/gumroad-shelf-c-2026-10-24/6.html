    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;xJKdpAyJWyPQygaZb5+p0Fq70vsUmyU1m/iGAF4HdQw=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;s7L-hw7J9BVPznu8Tk62Oq8ykgF1QP5gpchsmprIMlYBMNfeOlrj4TTBjJETdaiRkeve3SGY5vzRP2vTLkuHOQ&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Gumroad Discover - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Gumroad Discover&quot;,&quot;slug&quot;:&quot;79-gumroad-discover&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eIn this article:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Discover-eligibility-OtTcp\&quot; target=\&quot;_self\&quot;\u003eDiscover eligibility\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Setting-product-categories-and-tags-L8D6v\&quot; target=\&quot;_self\&quot;\u003eSetting product categories and tags\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Increase-Sales-on-Discover-with-tags-lrrKj\&quot; target=\&quot;_self\&quot;\u003eIncrease Sales on Discover with tags\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Filter-your-product-by-tag-YX_h-\&quot; target=\&quot;_self\&quot;\u003eFilter your products by tag\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#NSFW-tag-bWd81\&quot; target=\&quot;_self\&quot;\u003eNSFW tag\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cbr\u003e\n  \u003cp\u003e\u003ca href=\&quot;https://gumroad.com/discover\&quot;\u003eGumroad Discover\u003c/a\u003e recommends your products to prospective customers, helping you grow beyond your existing audience and find even more people who might be interested in your work.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/659b89b3baa1964909074d55/file-HBpd8e90fL.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;Discover-eligibility-OtTcp\&quot;\u003eDiscover eligibility\u003c/h3\u003e\n  \u003cp\u003eThe account level criteria for being eligible for Gumroad Discover is:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eYour \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayout settings\u003c/a\u003e must be filled in.\u003c/li\u003e\n    \u003cli\u003eReach a balance of at least $100 USD from enough genuine sales (not self-purchases or asking your partner/housemates to buy your product).\u003c/li\u003e\n    \u003cli\u003eBe verified by our risk team in the \u003ca href=\&quot;13-getting-paid#:~:text=For%20our%20review%2C%20we%20require%20your%20account%20to%20be%20legitimate%20in%20two%20major%20ways%3A\&quot;\u003e risk review process\u003c/a\u003e, which can take on average 3 weeks after you pass the $100 threshold.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eOnce the above criteria are satisfied, a product will be listed on Discover if:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eMade at least one successful sale (refunded sales don&#39;t count)\u003c/li\u003e\n    \u003cli\u003eA category has been selected for your product.\u003c/li\u003e\n    \u003cli\u003eRatings are enabled\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eThese settings can be changed in the share tab of the product edit page.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh7-us.googleusercontent.com/LBJCCP55dI3ENJvrNSUhEqJYOTj8xTXh3veiTcjMbqNXA-4pXAk5nE39_8PJCFLdHHNDg_kA_2VtMfkfrpiKIW-7lIznwk5tmh3iYmSKcKMMQJqfB3S_5D-DHXjvzQW8ai_5gl-cnCO6KvAaSqSpFqQ\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eNote: Products on Discover are automatically opted into the Gumroad Affiliates Program. To learn more about this program and how to opt-out of it, see \u003ca href=\&quot;333-affiliates-on-gumroad\&quot;\u003eAffiliates on Gumroad.\u003c/a\u003e\u003c/p\u003e\n  \u003ch3 id=\&quot;Setting-product-categories-and-tags-L8D6v\&quot;\u003eSetting product categories and tags\u003c/h3\u003e\n  \u003cp\u003eTo help customers find your products, use categories and tags. When you \u003ca href=\&quot;149-adding-a-product\&quot;\u003ecreate a product\u003c/a\u003e, you can select your preferred category and add tags on its Share tab.\u003c/p\u003e\n  \u003cp\u003eTo add a tag to your product,  scroll down to the Gumroad Discover section. \u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh7-us.googleusercontent.com/docsz/AD_4nXf74jarLbiBBjv5cn8ioSpNOoqaCiW_rfWB9W9TvgqGCTpSEaJGgWWLAmEkWnQ50XpRF9sFxkuh3ovk9Z5uOrZlHgA9E3sRjBu7DFn0Ql7J41IP8OEKi5RSCojiBOW584DBfP7NaKYr1ZeC0qWLwlVPO1Y?key=2UaOp2EY2Zjduk4jkSScMw\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eDetailed tags on your products can both boost sales on \u003ca href=\&quot;https://gumroad.com/discover\&quot;\u003eDiscover\u003c/a\u003e and help your customers filter your profile. By default, Discover is enabled for all your products. You can turn this off on your product edit page under the Share tab by deleting the product category. \u003c/p\u003e\n  \u003ch3 id=\&quot;Increase-Sales-on-Discover-with-tags-lrrKj\&quot;\u003eIncrease Sales on Discover with tags\u003c/h3\u003e\n  \u003cp\u003eHere’s how tags are displayed within each category on Discover:\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh7-us.googleusercontent.com/710uM05eTXzO0z2pClriQrKQgNgOFb2OXpdRZ3xvEdcPj0k8uXO5ljJmNvpIhd37IeeYEtt71Yr2ZnGfUtieaIU1l3p3wel1uC34MFGKZ0hxB3ct5vub1finW217jf-TOqTjhEOcxji6u3Qp8JWIiNw\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eThink about how your customers would search for your product and add tags to help them find it. The more descriptive and specific your tags are, the better chance you’ll have to attract new customers. \u003c/p\u003e\n  \u003ch3 id=\&quot;Filter-your-product-by-tag-YX_h-\&quot;\u003eFilter your product by tag\u003c/h3\u003e\n  \u003col\u003e\n    \u003cli\u003eAdd tags to all of your products. \u003c/li\u003e\n    \u003cli\u003eEnable product filters from your profile at [username].gumroad.com\u003c/li\u003e\n    \u003cli\u003eSend customers to your profile page URL with the tag added to the URL. To do that, simply take: [Your profile URL] + ?sort=page_layout\u0026amp;tags=[tag]\u003c/li\u003e\n  \u003c/ol\u003e\n  \u003cp\u003eFor example, if we wanted to link customers solely to the \&quot;Tutorial\&quot; products by the Gumroad creator\u003ca href=\&quot;https://matkatmusic.gumroad.com/\&quot;\u003e Matkat Music\u003c/a\u003e, then the URL would look like this:\u003ca href=\&quot;https://matkatmusic.gumroad.com/?sort=page_layout\u0026amp;tags=tutorial\&quot;\u003e https://matkatmusic.gumroad.com/?sort=page_layout\u0026amp;tags=tutorial\u003c/a\u003e\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh7-us.googleusercontent.com/c743cAj50Lu53lZdJXMAggDHZRHiRr2Mlnv18FNIcZ6FogN1bIKLfB-M0C6lNznY7ljeUfpf2zrFf5LVy0GVCsuiR_K6s76ZvwKTUCEbLqlMvzlXQEydMKBvseHcTAsMeuI7f_rMYwQ9ZquU6IwBVeE\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;NSFW-tag-bWd81\&quot;\u003eNSFW tag\u003c/h3\u003e\n  \u003cp\u003eIf your product is \u003ca href=\&quot;156-gumroad-and-adult-content#Selling-NSFW\&quot;\u003eNSFW\u003c/a\u003e, be sure to tag it so by setting the toggle on your product&#39;s Share tab.\u003c/p\u003e\n  \u003cp\u003eWe will only display it to customers who opt in to see NSFW content by enabling the Adult content toggle in their Gumroad account settings.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/nsfw-settings-toggle.png\&quot; /\u003e\u003c/figure\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;222-product-ratings-on-gumroad\&quot;\u003e\u003cspan\u003eProduct ratings and reviews\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;325-indirect-taxes-on-sales-via-discover\&quot;\u003e\u003cspan\u003eIndirect taxes on sales via Gumroad Discover\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;
