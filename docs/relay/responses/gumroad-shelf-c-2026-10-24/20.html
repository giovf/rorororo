    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;/KiGWH5QvLhOByNj9daCGgcVg/QNYNJxSlWkFRpfbtA=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;zFuL1Dyo_N2DltE5BbS5KyoCriNIIqsDZNiTHyP7hnMzFb-BZhurCXTFhsXDR5rWB2TkE8xKhp7LsTaSN1ijHA&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Having multiple accounts - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Having multiple accounts&quot;,&quot;slug&quot;:&quot;252-multiple-accounts&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eIn this article:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Combining-products-or-customers-Ns2_e\&quot; target=\&quot;_self\&quot;\u003eTransferring products or customers\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Combining-purchases--ckcP\&quot; target=\&quot;_self\&quot;\u003eTransferring purchases\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Transferring-ownership-of-account-fk2W3\&quot; target=\&quot;_self\&quot;\u003eTransferring ownership of account\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cbr\u003e\n  \u003cp\u003e\u003cb\u003eYes, you can have more than one Gumroad account\u003c/b\u003e for separate brands or businesses, and they can pay out to the same bank or PayPal account (depending on where you are on the globe - more info \u003ca href=\&quot;13-getting-paid\&quot;\u003ehere\u003c/a\u003e).\u003c/p\u003e\n  \u003cp\u003eIf you want another account and you see \u003cb\u003eNew Gumroad\u003c/b\u003e in the account menu (click your profile in the bottom-left of the dashboard), you \u003cb\u003emust\u003c/b\u003e create it there, so your accounts stay linked to each other on our side. It can copy your existing payout setup, so you do not have to go through payments onboarding again. You will need to confirm your current account&#39;s email address first, so if you have not confirmed it yet, do that before you start. If you do not see the option, click the \&quot;Contact Us\&quot; button below and we will link the accounts on our side. Creating extra accounts to get around a suspension or a limit, or to hide from Gumroad that your accounts are connected, is not allowed under our \u003ca href=\&quot;https://gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eEach account would have to be logged into with a unique email address, and unfortunately, you cannot share Twitter logins across accounts. So, if you have your Twitter or email account connected to one account, you cannot also have it connected to your second account.\u003c/p\u003e\n  \u003cp\u003eJust to make this very clear: We do not offer multiple logins for the same account. If you are sharing an account with someone else (your accountant, assistant, partner, etc.), you would both need to log in using the same credentials or add them to your \u003ca href=\&quot;326-teams-and-roles\&quot;\u003eteam\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3 id=\&quot;Combining-products-or-customers-Ns2_e\&quot;\u003eTransferring products or customers\u003c/h3\u003e\n  \u003cp\u003eA common question creators ask is if they can combine (or transfer) their: \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eproducts\u003c/li\u003e\n    \u003cli\u003ecustomers\u003c/li\u003e\n    \u003cli\u003esales and payout history\u003c/li\u003e\n    \u003cli\u003eposts\u003c/li\u003e\n    \u003cli\u003eworkflows\u003c/li\u003e\n    \u003cli\u003eaffiliates\u003c/li\u003e\n    \u003cli\u003eanalytics\u003c/li\u003e\n    \u003cli\u003eetc.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cb\u003eUnfortunately, the answer is no. \u003c/b\u003e\u003c/p\u003e\n  \u003cp\u003eEverything needs to be created from scratch due to technical limitations, sorry.\u003c/p\u003e\n  \u003ch3 id=\&quot;Combining-purchases--ckcP\&quot;\u003eTransferring purchases\u003c/h3\u003e\n  \u003cp\u003eWhile we aren&#39;t able to \&quot;merge\&quot; or \&quot;combine\&quot; accounts, technically speaking, we can transfer all of your purchases to one email address.\u003c/p\u003e\n  \u003cp\u003eClick the \&quot;Contact Us\&quot; button below and provide: \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eAll the email addresses associated with your purchases\u003c/li\u003e\n    \u003cli\u003eThe email address you&#39;d like to keep as your primary Gumroad account.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cb\u003eNote:\u003c/b\u003e For security verification, you need to write to us from the email address from which you want to transfer the purchases. If you do not have access to this email or are consolidating purchases from several emails, you must provide the following details for at least \u003cb\u003ethree\u003c/b\u003e purchases from the account(s):\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eName of the product\u003c/li\u003e\n    \u003cli\u003eDate of purchase\u003c/li\u003e\n    \u003cli\u003ePayment method: Card brand + last 4 digits (Eg. VISA *1111) or your PayPal ID\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eWe will transfer your purchases after verifying the above information.\u003c/p\u003e\n  \u003ch3 id=\&quot;Transferring-ownership-of-account-fk2W3\&quot;\u003eTransferring ownership of account\u003c/h3\u003e\n  \u003cp\u003eYou can transfer your Gumroad account to a new owner, for example when you sell your business. Under our \u003ca href=\&quot;https://gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e, transferring an account to someone else requires Gumroad&#39;s prior written consent, so contact us before making any changes.\u003c/p\u003e\n  \u003cp\u003eHere is how it works:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eClick the \&quot;Contact Us\&quot; button below from the email address on the account, and tell us you want to transfer ownership. Include the new owner&#39;s legal name, country, and email address.\u003c/li\u003e\n    \u003cli\u003eWe will review the request and, if approved, confirm the handover in writing. Do not change the account&#39;s email, password, or payout details before you hear back from us, as unannounced changes like these can flag the account for review.\u003c/li\u003e\n    \u003cli\u003eOnce approved, the current owner changes the account&#39;s email address to the new owner&#39;s email address from the \u003ca href=\&quot;https://gumroad.com/settings\&quot;\u003esettings\u003c/a\u003e. The new owner then updates the password and two-factor authentication.\u003c/li\u003e\n    \u003cli\u003eFinally, the new owner updates the \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayments settings\u003c/a\u003e to their own. This includes updating the compliance and PayPal or bank account information. The new owner will need to complete identity verification, and payouts may pause for a few business days while that happens. Changing the account&#39;s country forfeits unpaid amounts on the current country&#39;s connected account if those funds cannot be transferred; see \u003ca href=\&quot;https://gumroad.com/terms#section-11-4\&quot;\u003eSection 11.4\u003c/a\u003e of the Terms of Service.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eAll the products, reviews, followers, and sales data will remain intact during this process. The account&#39;s obligations carry over too: the new owner takes on the Terms of Service, along with any refund and chargeback responsibilities for past sales.\u003c/p\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Having multiple accounts - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;
