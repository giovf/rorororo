    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;2tsOiXSQbuPcCMsAC1kcrx40JmQUOZtr5uwNYsXFu0o=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;AZWlITxBSLugswDxlhj2hEetScY6XG8nNcsT25SYA0b_cUpRuXYJ3Lh0rKppNUIb0n4HR-y2ED3D7_d1mrcMow&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Product ratings and reviews - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Product ratings and reviews&quot;,&quot;slug&quot;:&quot;222-product-ratings-on-gumroad&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cb\u003eIn this article:\u003c/b\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Get-customers-to-leave-a-rating-7nCEs\&quot; target=\&quot;_self\&quot;\u003eGet customers to leave a rating\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#View-your-ratings-Zu3nD\&quot; target=\&quot;_self\&quot;\u003eView your ratings\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#add-reviews\&quot; target=\&quot;_self\&quot;\u003eAdd reviews to product descriptions\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Organize-products-by-rating-on-your-profile-X_tME\&quot; target=\&quot;_self\&quot;\u003eOrganize products by rating on your profile\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#remove\&quot; target=\&quot;_self\&quot;\u003eHow to remove ratings\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eCustomers can rate and leave a written review for your products within one year of their purchase.\u003c/p\u003e\n  \u003cp\u003eRatings are visible on both the profile page and the individual product pages:\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65dd847f93e735297b4ecc37/file-ybqNpubOtg.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;Get-customers-to-leave-a-rating-7nCEs\&quot;\u003eGet customers to leave a rating\u003c/h3\u003e\n  \u003cp\u003eGuide your customers to the \u003ca href=\&quot;https://gumroad.com/reviews\&quot;\u003eReviews page\u003c/a\u003e in their Library, where they can rate and review your products. They can also return to this page later to view and update their reviews. \u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/6644afe7f8a4cf663fcc4e9a/file-X6McMzBfHo.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eAlternatively, customers can also leave a review on the product&#39;s content page, or from the product page if they are logged in to Gumroad.\u003c/p\u003e\n  \u003cp\u003eFor memberships with \u003ca href=\&quot;82-membership-products#FreeTrials\&quot;\u003efree trials\u003c/a\u003e, reviews are allowed only after the first successful charge and not when the free trial begins.\u003c/p\u003e\n  \u003cp\u003eWe automatically send a reminder email to customers who have yet to leave a review 5 days after their purchase (90 days for physical products), but customers can unsubscribe from these emails. If you would rather your customers didn&#39;t receive these reminders, turn off \&quot;Send review reminder emails to your customers\&quot; under Review reminders in your \u003ca href=\&quot;https://gumroad.com/settings\&quot;\u003esettings\u003c/a\u003e. You can also solicit reviews by \u003ca href=\&quot;169-how-to-send-an-update\&quot;\u003esending an email\u003c/a\u003e or \u003ca href=\&quot;131-using-workflows-to-send-automated-updates\&quot;\u003ecreating a workflow\u003c/a\u003e targeting only the customers of a specific product.\u003c/p\u003e\n  \u003cp\u003eWe also notify you via email when a written review is submitted for your product. However, you can turn off these notifications in your \u003ca href=\&quot;https://gumroad.com/settings/\&quot;\u003esettings\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3 id=\&quot;View-your-ratings-Zu3nD\&quot;\u003eView your ratings\u003c/h3\u003e\n  \u003cp\u003eIf a customer has left you a rating, you can view it in the customer&#39;s drawer on your \u003ca href=\&quot;https://gumroad.com/customers/\&quot;\u003eSales dashboard\u003c/a\u003e. You can also respond to their review by clicking \&quot;Respond\&quot;.\u003c/p\u003e\n  \u003cp\u003eThis can be a great tool to alert dissatisfied customers to unanswered attempts to reach out and update potential customers on product fixes to previous issues.\u003c/p\u003e\n  \u003cp\u003eYou can also \u003ca href=\&quot;74-the-analytics-dashboard#sales-csv\&quot;\u003eexport a sales CSV\u003c/a\u003e and find the ratings in the \&quot;Rating\&quot; column.\u003c/p\u003e\n  \u003ch3 id=\&quot;add-reviews\&quot;\u003eAdd reviews to product descriptions\u003c/h3\u003e\n  \u003cp\u003eYou can embed reviews to your product descriptions by taking the following steps:\u003c/p\u003e\n  \u003col\u003e\n    \u003cli\u003eGo to your product&#39;s description editor\u003c/li\u003e\n    \u003cli\u003eClick Insert and select Reviews from the dropdown menu\u003c/li\u003e\n    \u003cli\u003eChoose the review(s) you want to add\u003c/li\u003e\n    \u003cli\u003eDrag and reposition the review to your liking\u003c/li\u003e\n  \u003c/ol\u003e\n  \u003ch3 id=\&quot;Organize-products-by-rating-on-your-profile-X_tME\&quot;\u003eOrganize products by rating on your profile\u003c/h3\u003e\n  \u003cp\u003eYou can organize your products by rating on your profile page by selecting \&quot;Highest rated\&quot; as the default sort order on \u003ca href=\&quot;124-your-gumroad-profile-page\&quot;\u003eyour profile page\u003c/a\u003e.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65dd84ff93e735297b4ecc38/file-umPZYuDt5H.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;remove\&quot;\u003eHow to remove ratings\u003c/h3\u003e\n  \u003cp\u003eYou can refund a purchase to remove its rating. For membership purchases, you just need to refund the original charge and not all the recurring charges. In case of a free download, you can \u003ca href=\&quot;329-customer-moderation\&quot;\u003erevoke its access\u003c/a\u003e to remove the rating.\u003c/p\u003e\n  \u003cp\u003eIssuing a partial refund will not remove a customer&#39;s rating. Bundles are the one exception: partially refunding a bundle purchase removes the ratings of the products inside that bundle.\u003c/p\u003e\n  \u003cp\u003eA refunded purchase will no longer be counted towards the product&#39;s average rating calculation, however, it will still be visible in your sales dashboard.\u003c/p\u003e\n  \u003cp\u003eYou can also ask customers to re-rate your product.\u003c/p\u003e\n  \u003cp\u003eTo stop ratings from being visible on your product, simply go to the product&#39;s edit page, Share tab, and scroll down to the Discover settings. There, you can toggle whether or not your ratings are displayed. \u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/61c1aa8e9081120970361423/file-amuUuJepLE.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eCustomers \u003cem\u003ecan still rate your products\u003c/em\u003e, but those ratings will be private. \u003c/p\u003e\n  \u003cp\u003eBe aware that when you do this, your product will \u003cstrong\u003enot show up\u003c/strong\u003e in the \u003ca href=\&quot;79-gumroad-discover\&quot; target=\&quot;_self\&quot;\u003eDiscover search\u003c/a\u003e anymore. \u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;149-adding-a-product\&quot;\u003e\u003cspan\u003eAdding a product\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&qu
