    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;vt0+3nZv2mZZGN86YAJT1WRGMvvvLkV2yEm6d6JuQ0o=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;8M1vk2Vlnc-SdrwO3rLf7cKQWLotam-QlwO2Pab-MJ6_muHSZTKp6kN0VNIX-VV5_bG-kgyL0NvnatoQSoiSCA&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Account suspension FAQ - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Account suspension FAQ&quot;,&quot;slug&quot;:&quot;160-suspension&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eIn this article:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#The-short-of-it-2VPy4\&quot;\u003eSummary\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Reason-1-Terms-of-Service-Violations-Fz95R\&quot;\u003eTerms of Service Violation\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Reason-2-High-Risk-and-Fraudulent-Sales-9HowL\&quot;\u003eHigh Risk \u0026amp; Fraudulent Sales\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Reason-3-High-Chargeback-Amounts-p8SkX\&quot;\u003eHigh Chargeback Amounts\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Reason-4-Your-account-was-rejected-by-our-partners-ZZ2z5\&quot;\u003eYour account was rejected by our partners\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Frequently-Asked-Questions-VUUqd\&quot;\u003eFrequently Asked Questions\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;The-short-of-it-2VPy4\&quot;\u003eSummary\u003c/h3\u003e\n  \u003cp\u003eBefore your first payout, we review your account. \u003ca href=\&quot;/help/article/281-payout-delays\&quot;\u003eSee our review process here.\u003c/a\u003e If we detect fraudulent sales, clear violations of our \u003ca href=\&quot;https://gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e, or signs that you&#39;re attempting to launder money, spam the platform, or test the site&#39;s security, your account will be suspended. In some cases, we may also refund your customers. You&#39;ll have the option to appeal the suspension or request account deletion.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eIf your account is reviewed by us and we verify it, you&#39;re good. You&#39;ll get your first payout within seven days of your review as long as nothing else on the account needs attention (see \u003ca href=\&quot;281-payout-delays\&quot;\u003ePayout Delays\u003c/a\u003e), and in most cases we won&#39;t need to look at your account again. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eOnce you&#39;re reviewed and verified, your account is safe from suspension unless:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eYou have an extremely high \u003ca href=\&quot;https://gumroad.com/help/article/134-how-does-gumroad-handle-chargebacks\&quot;\u003echargeback rate\u003c/a\u003e that becomes unsustainable for us to support your sales.\u003c/li\u003e\n    \u003cli\u003eYou refund all your sales that you&#39;ve ever made, putting us into debt.\u003c/li\u003e\n    \u003cli\u003eYou violate our \u003ca href=\&quot;http://www.gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e (or continue to do so after being asked to stop).\u003c/li\u003e\n    \u003cli\u003eStripe or PayPal (or our other banking partners) decide that you are in violation of their Terms of Service and prohibit us from working with you.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eAs a small company, Gumroad has to follow the rules of our banking partners and payment processors to keep operating. Sometimes, following these rules means we have to remove creators from the platform, even when we don&#39;t want to. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eFor creators, this means your account must comply with our \u003ca href=\&quot;https://www.gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e for us to process payments on your behalf and pay out your earnings. By creating a Gumroad account, you are therefore subject our Terms and agree that we can suspend your account and refund sales if and when necessary (see Section 11.3). \u003c/p\u003e\n  \u003cp\u003eWe encourage you to read these Terms before creating an account. If your account violates them, it will be suspended, and your balance may be refunded depending on the policy that we are enforcing and potential \u003ca href=\&quot;https://gumroad.com/help/article/134-how-does-gumroad-handle-chargebacks\&quot;\u003echargeback risks\u003c/a\u003e. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eWe understand that from a creator&#39;s standpoint, a suspension may seem arbitrary, unfair, and cold. We do our best to bring humanity, empathy, and honesty to the relationships that we have with our creators, but sadly, in the world of online payments, there is no nice way to end a payment processing relationship. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eThis page offers explanations for why an account will be suspended and will attempt to dispel any misinformation you may have encountered elsewhere online.  \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eWe, unfortunately, have to stay rather general on this page, because giving away specific policy details is, frankly, a terrible idea in an online world full of fairly-clever scammers.\u003c/p\u003e\n  \u003ch3 id=\&quot;Reason-1-Terms-of-Service-Violations-Fz95R\&quot;\u003eReason 1: Terms of Service Violations\u003c/h3\u003e\n  \u003cp\u003eGumroad&#39;s Terms of Service can be found here:\u003c/p\u003e\n  \u003cp\u003e\u003ca href=\&quot;https://www.gumroad.com/terms\&quot;\u003eTerms of Service\u003c/a\u003e\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eAnd our list of goods that cannot be sold through Gumroad is here: \u003ca href=\&quot;https://gumroad.com/prohibited\&quot;\u003eProhibited Products and Activities\u003c/a\u003e and in less legal terms here: \u003ca href=\&quot;155-things-you-cant-sell-on-gumroad\&quot;\u003eThings That Are Not Allowed on Gumroad\u003c/a\u003e\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eIf you are using Gumroad in a way that violates our ToS, or selling a product that we are not authorized to sell (common offenders include PLR ebooks, graphic pornography, \u003ca href=\&quot;70-can-i-sell-services\&quot;\u003eservices\u003c/a\u003e, credit repair products, tickets to events, health products, unlicensed software you didn&#39;t create, or unlicensed electronics), we have to suspend your account. In general, you cannot resell products that you didn&#39;t create. However, you can be an affiliate for another Gumroad creator—\u003ca href=\&quot;249-affiliate-faq\&quot;\u003elearn about that here\u003c/a\u003e.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eBecause spammers love misusing our platform, we also will have to suspend your account if it appears that you are using Gumroad as a means of manipulating search engine results. \u003c/p\u003e\n  \u003ch4\u003e\u003cb\u003eWhat now? \u003c/b\u003e\u003c/h4\u003e\n  \u003cp\u003eIf your entire account and sales violate our Terms of Service, we cannot allow you back on the platform. However, if only a single product is in violation and you agree to remove it and sell different types of products, we may allow you to return. If you&#39;ve made previous purchases, we can resend them or restore download access. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eDepending on the policies you have violated, we may not be able to pay you out. We do our best to get you paid, but sometimes we truly aren&#39;t allowed to. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eWe will speak to you directly in these instances about what will happen with your existing sales.\u003c/p\u003e\n  \u003ch3 id=\&quot;Reason-2-High-Risk-and-Fraudulent-Sales-9HowL\&quot;\u003eReason 2: High-Risk and Fraudulent Sales\u003c/h3\u003e\n  \u003cp\u003eEvery account on Gumroad is reviewed by our Risk team and processors before payouts can begin, to ensure we only process payments for safe, legitimate accounts.. We explain this process in further detail on the following pages: \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;13-getting-paid\&quot;\u003eGetting Paid by Gumroad\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;281-payout-delays#Reason1Youhaventbeen\&quot;\u003ePayout Delays\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eIf your account is marked by high rates of suspicious payments or evidence that your sales were made fraudulently and/or with compromised payment sources (i.e. stolen credit cards, hacked PayPal accounts), we have to suspend it, and we cannot pay you for these sales. \u003c/p\u003e\n  \u003cp\u003eIf there are legitimate sales in your balance, we work to pay you out for those once our review is complete and our banking partners permit it. \u003c/p\u003e\n  \u003ch4\u003e\u003cb\u003e\&quot;Why me? I didn&#39;t do anything wrong. Why should I be punished for my customers&#39; activities?\&quot;\u003c/b\u003e\u003c/h4\u003e\n  \u003cp\u003eThis is a common, very understandable response to this kind of suspension. You might not be doing anything wrong - you may be selling an ebook about world peace, and donating all of your profits to blind orphans, but if your account is the source of high amounts of fraudulent payments, then the only thing we can do to enforce the policies of our partners is to cut off the fraud at its source, which in this case would be your products.  \u003c/p\u003e\n  \u003cp\u003eThink about it like this - it&#39;s not a great analogy, but this is how our banking partners view the situation:\u003c/p\u003e\n  \u003cp\u003eMrs. Gumroad manages a supermarket, and you are her new employee. You invite someone from outside the store to come in and buy from the section of the store that you&#39;ve just recently organized. That person comes in, steals a bunch of stuff, smashes up the store, and runs away. \u003c/p\u003e\n  \u003cp\u003eWhat can Mrs. Gumroad do in this situation besides fire you? Again, not a great analogy but it&#39;s how we have to operate. \u003c/p\u003e\n  \u003ch4\u003e\u003cb\u003eWhat now?\u003c/b\u003e\u003c/h4\u003e\n  \u003cp\u003eDepending on your situation, your account may be reviewed again. We invite you to ask us to re-review your account because we do make mistakes. If we find that our review was flawed we will allow your account back onto Gumroad. If not, we will refund your sales and ask you to find a different platform for your sales. \u003c/p\u003e\n  \u003ch3 id=\&quot;Reason-3-High-Chargeback-Amounts-p8SkX\&quot;\u003eReason 3: High Chargeback Amounts\u003c/h3\u003e\n  \u003cp\u003eTo learn how Gumroad deals with chargebacks, you can read \u003ca href=\&quot;134-how-does-gumroad-handle-chargebacks\&quot;\u003ethis rather lengthy article\u003c/a\u003e. It offers tips on how to avoid chargebacks and how to help us if your customer issues one.\u003c/p\u003e\n  \u003cp\u003eIn short though, if your account racks up a high number of chargebacks, your account is categorized as high-risk, and we are not allowed to further process your sales or payouts. \u003c/p\u003e\n  \u003ch4\u003e\u003cb\u003eWhy?\u003c/b\u003e\u003c/h4\u003e\n  \u003cp\u003eLet&#39;s say you have $1,000 in sales and you incur $100 in chargebacks. You now have a 10% chargeback-to-sales volume rate, meaning 10% of all of your sales have resulted in chargebacks. Moreover, as per our ToS, Gumroad swallows the resulting penalties that are attached to chargebacks. Theoretically, if we were to continue processing your sales, we would continue to accrue penalties on your behalf.  \u003c/p\u003e\n  \u003cp\u003eFrom the viewpoint of our partners, this is unsustainable and we are forced to suspend your sales. \u003c/p\u003e\n  \u003ch4\u003e\u003cb\u003e\&quot;Why me? I didn&#39;t do anything wrong. Why should I be punished for my customers&#39; activities?\&quot;\u003c/b\u003e\u003c/h4\u003e\n  \u003cp\u003eAgain, a totally understandable and completely valid point. But, to restate - we have to enforce the risk policies of our partners quickly and effectively. The chargebacks are originating from your account, and suspension is the only way to solve the issue, from our partners&#39; perspective. \u003c/p\u003e\n  \u003cp\u003eIf your account has been suspended for a high chargeback rate, we hold onto your balance to accommodate for further chargebacks. For that reason on its own, the hold usually lasts 30-45 days, after which we typically pay out the remaining balance in your account, if given clearance by our banking partners. \u003c/p\u003e\n  \u003cp\u003eThat 30-45 day figure describes the chargeback-rate hold and nothing else. It is an estimate rather than a promised release date, and it does not apply while we are holding your funds for another reason, such as an open review of your account, suspected fraud, or misleading or deceptive marketing. In that case the balance stays held until the other reason is resolved. Section 11.3 of our \u003ca href=\&quot;https://gumroad.com/terms#section-11-3\&quot;\u003eTerms of Service\u003c/a\u003e sets out when we may hold funds, what happens to them while a hold is in place, and when we release them.\u003c/p\u003e\n  \u003ch3 id=\&quot;Reason-4-Your-account-was-rejected-by-our-partners-ZZ2z5\&quot;\u003eReason 4: Your account was rejected by our partners\u003c/h3\u003e\n  \u003cp\u003eBy entering your payout information, you’re setting up an account with Stripe and/or PayPal. They also review your account to assess risk. If they&#39;ve had issues with your account in the past, they may not let us pay you.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eFor example:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eYou have been suspended from PayPal in the past and created a new account with us\u003c/li\u003e\n    \u003cli\u003eYour bank account has been connected to fraud in the past that Stripe has had to deal with\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch4\u003e\u003cb\u003eWhat now? \u003c/b\u003e\u003c/h4\u003e\n  \u003cp\u003eIf Stripe makes a final decision to reject your account, we will email you once to let you know. The decision is made by Stripe, not Gumroad, and it cannot be appealed or reversed. Buyers can no longer purchase your products, and you will not receive any further verification requests from us. Your \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003epayments settings page\u003c/a\u003e shows your account status and what will happen to your remaining balance:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eIf your balance is $1 or more, we pay it out to your bank account automatically on your next scheduled payout, even if it is below the usual $100 minimum.\u003c/li\u003e\n    \u003cli\u003eIf Stripe has also disabled payouts on the account, Stripe holds the balance. If Stripe releases it, we pay it out to you automatically.\u003c/li\u003e\n    \u003cli\u003eIf your balance is under $1, it is below the minimum our payout system can send, so we are unable to pay it out.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eAs above, these outcomes describe a final rejection by Stripe on its own. If we are separately holding your balance for another reason, such as an open review of your account, suspected fraud, or misleading or deceptive marketing, it stays held until that is resolved.\u003c/p\u003e\n  \u003cp\u003eFor PayPal, we will forward your case to their support staff. We may also put you in an email thread with them to answer any questions that they have. If they do not allow us to pay you, then unfortunately we have no way to send you money. The easiest solution in this example would be to refund your sales and contact your customers to pay you via an alternate route. \u003c/p\u003e\n  \u003ch3 id=\&quot;Frequently-Asked-Questions-VUUqd\&quot;\u003eFrequently Asked Questions\u003c/h3\u003e\n  \u003cp\u003e\u003cb\u003eQ1. Why doesn&#39;t Gumroad inform users that their account is suspended? \u003c/b\u003e\u003c/p\u003e\n  \u003cp\u003eA1: A vast majority of the accounts we suspend (around 50,000/month) are created by actual scammers or spammers. To inform them via email that their attempts to defraud us were unsuccessful would effectively amount to us offering them a \u003ca href=\&quot;https://en.wikipedia.org/wiki/Mulligan_(games)\&quot;\u003eMulligan\u003c/a\u003e. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eWe have found it is more effective for us to allow users to email us for more information after their accounts have been suspended. We understand that suspension often comes as a nasty surprise, and we apologize for the seeming rudeness.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003e\u003cb\u003eQ2: I have read online that Gumroad keeps my customers&#39; money after my account has been suspended.\u003c/b\u003e\u003c/p\u003e\n  \u003cp\u003eA2: We&#39;re not entirely sure how this rumor got started, but rest assured, it&#39;s not true. If we were doing this, a few things would happen: \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003e1. Customers would issue chargebacks at a rate that would quickly bankrupt us \u003c/p\u003e\n  \u003cp\u003e2. Creators would sue us so much that we&#39;d be bankrupted  \u003c/p\u003e\n  \u003cp\u003e3. Our payment processors would get wind of it, and boot us from their platforms \u003c/p\u003e\n  \u003cp\u003e4. We&#39;d get a visit from the FBI for extortion\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eSince not a single one of these things has happened since we opened our digital doors in 2011, it should be evident that this is not how we do business.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eIf your account has been suspended and your customers are asking about refunds, they can email us directly at \u003ca href=\&quot;mailto:support@gumroad.com\&quot;\u003esupport@gumroad.com\u003c/a\u003e for assistance. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003e\u003cb\u003eQ3: Can I protest my suspension? \u003c/b\u003e\u003c/p\u003e\n  \u003cp\u003eA3: In most cases, yes. To be clear, we don&#39;t enjoy suspending accounts, and sometimes our review process can be flawed. Contact us at \u003ca href=\&quot;mailto:support@gumroad.com\&quot;\u003esupport@gumroad.com\u003c/a\u003e and we will inform you as to why your account was suspended. We will then ask for pertinent information that may help us get your account back and running. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eThe one exception is a final rejection by Stripe (see \u003ca href=\&quot;#Reason-4-Your-account-was-rejected-by-our-partners-ZZ2z5\&quot;\u003eReason 4\u003c/a\u003e above). That decision is made by Stripe, not Gumroad, and neither we nor our support team can appeal or reverse it. \u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003e\u003cb\u003eQ4: Why doesn&#39;t Gumroad provide me with specific reasons why my account was suspended? \u003c/b\u003e\u003c/p\u003e\n  \u003cp\u003eA4: The Internet is a pretty awful place when it comes to fraud and risk management, and unfortunately the more specific information we give out about our risk and fraud detection, the more information there is that&#39;s able to leak to fraudsters trying to make money off of us. \u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;155-things-you-cant-sell-on-gumroad\&quot;\u003e\u003cspan\u003eThings not allowed on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;64-is-gumroad-for-me\&quot;\u003e\u003cspan\u003eWhy choose Gumroad?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;161-what-gumroad-considers-fraud\&quot;\u003e\u003cspan\u003eDefining fraud on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&qu
