name: gankdat publish

# The keys live here, not in any Claude sandbox: routines commit actors / server.json, CI
# publishes. Runs after every push touching the actors or the registry manifest.
# Since 2026-10-24 (foundry registry-publish-silent-exit) the registry step gets GITHUB_TOKEN for the
# releases API: run 54 (10-23 17:34) failed with exit 1 and no message when the unauthenticated call
# from a shared runner IP hit GitHub's 60/h limit; the script now names its step and HTTP status.
# Since 2026-11-14 (foundry apify-publish-token-gate) the Apify token is probed first: a 401 (Apify rotated every
# token after its breach, run 95 failed 2026-11-12) skips the actor step with a warning and one
# `wait: apify token` run-log line a day, the job stays green and the registry step still runs; the first
# run with a working token after that pushes every actor once. Any other probe error still fails the job.
on:
  push:
    branches: [main]
    paths:
      [
        'ventures/gankdat/apify/**',
        'ventures/gankdat/server.json',
        '.github/workflows/gankdat-publish.yml',
      ]
  schedule:
    - cron: '0 4 * * *' # daily: Apify allows 5 publications / 24 h, so the backlog drains a few a day
  workflow_dispatch:
    inputs:
      all:
        description: 'push every actor, not just changed ones'
        type: boolean
        default: false

permissions:
  contents: write # the token gate commits its one run-log line a day

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the push range (github.event.before..sha) spans every commit of the push; depth 2 lost a two-commit push (2026-09-30)
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Apify token probe (a rotated token waits, it does not fail)
        id: token
        run: node --disable-warning=ExperimentalWarning scripts/apify-token-gate.ts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Apify actors — push changed, price, publish
        if: steps.token.outputs.state == 'ok'
        run: node ventures/gankdat/scripts/publish-actors.mjs ${{ (inputs.all || steps.token.outputs.catchup == '1') && '--all' || '' }}
        env:
          DIFF_RANGE: ${{ github.event.before }}..${{ github.sha }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PUBLISH_ONLY: ${{ github.event_name == 'schedule' && steps.token.outputs.catchup != '1' && '1' || '' }}
          GANKDAT_INTERNAL_API_KEY: ${{ secrets.GANKDAT_INTERNAL_API_KEY }}
      - name: MCP registry — publish if server.json is newer
        run: bash ventures/gankdat/scripts/registry-publish.sh
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authenticated releases API (1000/h) instead of 60/h per shared runner IP
      - name: Commit the token gate's run-log line (wait, or back after a wait)
        run: |
          git config user.name "foundry-watchdog[bot]"
          git config user.email "info@gankdat.com"
          git add docs/RUNS.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "watchdog: apify token gate"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
