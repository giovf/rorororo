name: gankdat publish

# The keys live here, not in any Claude sandbox: routines commit actors / server.json, CI
# publishes. Runs after every push touching the actors or the registry manifest.
# Since 2026-10-24 (foundry registry-publish-silent-exit) the registry step gets GITHUB_TOKEN for the
# releases API: run 54 (10-23 17:34) failed with exit 1 and no message when the unauthenticated call
# from a shared runner IP hit GitHub's 60/h limit; the script now names its step and HTTP status.
on:
  push:
    branches: [main]
    paths:
      [
        'ventures/gankdat/apify/**',
        'ventures/gankdat/server.json',
        '.github/workflows/gankdat-publish.yml',
      ]
  schedule:
    - cron: '0 4 * * *' # daily: Apify allows 5 publications / 24 h, so the backlog drains a few a day
  workflow_dispatch:
    inputs:
      all:
        description: 'push every actor, not just changed ones'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the push range (github.event.before..sha) spans every commit of the push; depth 2 lost a two-commit push (2026-09-30)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apify actors — push changed, price, publish
        run: node ventures/gankdat/scripts/publish-actors.mjs ${{ inputs.all && '--all' || '' }}
        env:
          DIFF_RANGE: ${{ github.event.before }}..${{ github.sha }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PUBLISH_ONLY: ${{ github.event_name == 'schedule' && '1' || '' }}
          GANKDAT_INTERNAL_API_KEY: ${{ secrets.GANKDAT_INTERNAL_API_KEY }}
      - name: MCP registry — publish if server.json is newer
        run: bash ventures/gankdat/scripts/registry-publish.sh
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authenticated releases API (1000/h) instead of 60/h per shared runner IP
