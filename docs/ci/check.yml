name: check

# The full gate runs on every push that touches code, and once a night for everything else
# (docs-only commits from the routines were 125 runs and 580 minutes a week — the repo goes
# private, where 2,000 Actions minutes a month is a hard cap). A red main means an agent pushed
# incomplete or broken work; the daily build routine's first duty is to fix it.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'ventures/**'
      - '!ventures/**/*.md'
      - '!ventures/**/docs/**'
      - 'scripts/**'
      - '.github/workflows/check.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.prettierrc*'
      - '.prettierignore'
  schedule:
    - cron: '15 3 * * *' # nightly full gate catches docs-only slips
  workflow_dispatch:

# Concurrency (2026-10-05, foundry ci-runs-never-acquired): a newer commit cancels this workflow's queued or
# running run for the same event and ref. On 2026-10-05 one push run in three was cancelled by GitHub 15 min
# after start with no steps (never acquired by a runner) while each burn-down push queued six more runs behind
# the dead ones. Scheduled and manual runs keep their own group, so a push never cancels the cron run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # node_modules cache (2026-10-12, foundry actions-floor-trim): GitHub bills every job rounded up
      # to a whole minute and `npm ci` alone took ~50 s of each run (setup-node's npm cache only saves
      # the download). The installed tree is restored keyed on the lockfile; `npm ci` runs on a miss.
      # The 10-26 actions-minutes reading decides whether the restore beats the install.
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: |
            node_modules
            */*/node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # check:root (2026-10-06, foundry gankdat-test-setup): the gankdat gate used to run here AND in
      # gankdat.yml on every gankdat push — the two top Actions consumers of the month. gankdat.yml
      # owns it on CI; `npm run check` locally still chains it.
      - run: npm run check:root
