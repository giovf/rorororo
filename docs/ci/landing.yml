name: landing

on:
  push:
    branches: [main]
    paths: ['packages/landing/**', 'scripts/ops-data.ts', '.github/workflows/landing.yml']
  schedule:
    # The /ops dashboard is rendered from src/ops-data.json, rebuilt from the repo at deploy time;
    # four deploys a day keep it under six hours stale without a deploy per routine push
    # (owner dashboard, 2026-10-16). Odd minute: GitHub delays busy-minute crons most.
    - cron: '35 */6 * * *'
  workflow_dispatch:

# Concurrency (2026-10-05, foundry ci-runs-never-acquired): a newer commit cancels this workflow's queued or
# running run for the same event and ref. On 2026-10-05 one push run in three was cancelled by GitHub 15 min
# after start with no steps (never acquired by a runner) while each burn-down push queued six more runs behind
# the dead ones. Scheduled and manual runs keep their own group, so a push never cancels the cron run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Read by the secret step's `if` below (a step cannot test its own env); empty until action 032.
      META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
    defaults:
      run:
        working-directory: packages/landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Build the dashboard data snapshot from the repo (scripts/ops-data.ts)
        run: npm run build --silent && npm run ops:data
        working-directory: .
      - name: Deploy landing site + /ops dashboard (Worker with static assets, apps.gankdat.com)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37e56f3ce4dfe49919e85d4380467f44
      - name: Model key for /diligence (hackathons meta-global-ai-hackathon-entry, 2026-10-26)
        # The counterparty-check page runs Muse Spark on Meta Model API with the key the owner saved as
        # the META_MODEL_API_KEY repository secret (docs/for-owner/actions/032-meta-model-api-key.md);
        # the optional GANKDAT_DEMO_API_KEY lets the registers answer in full. Absent, the step is
        # skipped and the page says the key is not configured. Never printed: piped straight into
        # wrangler, which stores it as the Worker secret.
        if: env.META_MODEL_API_KEY != ''
        run: |
          printf '%s' "$META_MODEL_API_KEY" | npx wrangler secret put DILIGENCE_API_KEY
          if [ -n "$GANKDAT_DEMO_API_KEY" ]; then
            printf '%s' "$GANKDAT_DEMO_API_KEY" | npx wrangler secret put DILIGENCE_GANKDAT_KEY
          fi
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          GANKDAT_DEMO_API_KEY: ${{ secrets.GANKDAT_DEMO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37e56f3ce4dfe49919e85d4380467f44
