name: license worker

# Deploys the licence Worker (packages/license-worker, `foundry-licenses`: Stripe webhook → signed key or
# download link → Resend mail; status, activation and download endpoints) on pushes that change it. Until
# 2026-10-29 it was deployed by hand from an attended session (2026-09-18); tax-workbook `own-checkout-listing`
# added a download product whose file must reach the Worker's KV on every release, so the deploy moved to CI
# (first run 2026-10-29 18:28: invalid workflow, a step name held an unquoted colon — names quoted since).
# like `landing` and `gankdat`. Secrets (STRIPE_WEBHOOK_SECRET, LICENSE_SIGNING_KEY, RESEND_API_KEY,
# ADMIN_TOKEN) were set once with `wrangler secret put` and survive deploys; nothing here prints or sets them.
on:
  push:
    branches: [main]
    paths:
      - 'packages/license-worker/**'
      - 'packages/licensing/**'
      - 'ventures/tax-workbook/release/**'
      - '.github/workflows/license-worker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/license-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 37e56f3ce4dfe49919e85d4380467f44
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - name: "Build (tsc -b; the Worker's main is dist/index.js)"
        run: npm run build --silent
        working-directory: .
      - name: "Load the download products' files into the LICENSES namespace (private, served only by /v1/downloads/<token>)"
        # One `asset:<venture>` key per entry of src/downloads.ts DOWNLOADS, written from the venture's release
        # folder on every deploy so a refreshed file (the April 2027 workbook) goes live with its commit.
        run: |
          npx wrangler kv key put asset:tax-workbook \
            --binding LICENSES --remote \
            --path ../../ventures/tax-workbook/release/UK-Sole-Trader-Tax-Workbook-2026-27.xlsx
      - name: Deploy foundry-licenses
        run: npx wrangler deploy
      - name: Smoke-check the deployed Worker
        run: |
          curl -fsS --max-time 20 https://foundry-licenses.faceless-api.workers.dev/health
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://foundry-licenses.faceless-api.workers.dev/v1/downloads/not-a-token)
          test "$code" = "403" || { echo "download endpoint answered $code, expected 403"; exit 1; }
