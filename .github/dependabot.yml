# Dependency currency (owner 2026-10-16: nothing the schedulers depend on may silently age).
# Monthly, grouped: one npm PR for minor/patch, one for majors; one PR for GitHub Actions.
# The `dependabot` workflow runs the full gate on the PR and merges minor/patch when green;
# majors are reviewed by the burn-down within 7 days (breaking changes read against our call
# sites; merged when none touches a call of ours, else closed with a lift condition below —
# 2026-10-24, foundry `dependabot-majors-review-by-routine`). Claude model ids and Node are checked by
# scripts/versions-check.ts (monthly `versions` workflow) — Dependabot cannot see those.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      majors:
        update-types: [major]
    # Majors held back with a lift condition each (PR #6, 2026-10-18 burn-down; docs/ops/VERSIONS.md log):
    # - typescript 7 (2026-07-08): typescript-eslint 8.71.2, the latest, declares `typescript: >=4.8.4
    #   <6.1.0` and throws "does not support TS 7.0" at load; TS 7's `tsc -b` also no longer resolves
    #   `@foundry/licensing` through its `exports` before the referenced project is built. Lift when
    #   typescript-eslint's peer range includes 7.
    # - vitest majors: gankdat's `@cloudflare/vitest-pool-workers` 0.23.0 wants vitest ^4.1.0, and the
    #   regenerated lock dropped vitest 5's required `vite` peer. Lift when the pool's peer range moves.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
