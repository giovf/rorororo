name: fetch relay

# Routines (cloud sandboxes with no egress to data hosts) push docs/relay/requests/<name>.txt;
# this fetches the URLs from a GitHub runner and commits the responses under
# docs/relay/responses/<name>/. See docs/relay/README.md.
on:
  push:
    branches: [main]
    paths: ['docs/relay/requests/**']
  workflow_dispatch:

# One run at a time (2026-10-18, burn-down): two request pushes 27 s apart started two runs; the
# second checked out both request files, fetched both, and its `git pull --rebase` then collided
# with the first run's response commit (same files deleted and added on both sides), so its
# responses were lost and its request sat unprocessed until a workflow_dispatch re-fire. A queued
# run processes every file still under requests/, so serialising loses nothing.
concurrency:
  group: fetch-relay
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    # A RENDER line (below) can wait up to 2 min per page; the serialised group must never hold the
    # next request for an hour behind a hung browser.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # RENDER lines (foundry relay-rendered-fetch, 2026-10-22): a request that asks for a page as
      # Chromium renders it needs the playwright package and the browser; an ordinary run stays
      # dependency-free (~15 s), so both are installed only when `needs-render` prints true.
      # The browser is cached by Playwright version (run 151, 2026-10-22 20:32: the install step was
      # still running after 11 min while three earlier runs took 67–83 s in all), and the install and
      # fetch steps get their own timeouts so a stuck one fails the run fast instead of holding the
      # serialised relay group for the job's 20 min — the request stays under requests/ and the next
      # push re-runs it.
      - name: Render needed?
        id: render
        run: echo "needed=$(node scripts/fetch-relay.mjs needs-render)" >> "$GITHUB_OUTPUT"
      - name: Playwright version
        if: steps.render.outputs.needed == 'true'
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        if: steps.render.outputs.needed == 'true'
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - name: Browser
        if: steps.render.outputs.needed == 'true'
        timeout-minutes: 6
        run: |
          npm ci --no-audit --no-fund
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - run: node scripts/fetch-relay.mjs
        timeout-minutes: 12
      - name: Commit responses
        run: |
          git config user.name "foundry-relay[bot]"
          git config user.email "info@gankdat.com"
          git add -A docs/relay
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "relay: $(git diff --cached --name-only | grep -oE 'responses/[^/]+' | sort -u | sed 's#responses/##' | tr '\n' ' ')"
          # Retried: a routine's push in the same second rejected the one-shot push (relay run 143, 2026-10-22;
          # foundry workflow-push-retry-everywhere) and the commit was lost with the runner.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
