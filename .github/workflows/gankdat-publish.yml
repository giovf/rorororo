name: gankdat publish

# The keys live here, not in any Claude sandbox: routines commit actors / server.json, CI
# publishes. Runs after every push touching the actors or the registry manifest.
on:
  push:
    branches: [main]
    paths: ['ventures/gankdat/apify/**', 'ventures/gankdat/server.json', '.github/workflows/gankdat-publish.yml']
  workflow_dispatch:
    inputs:
      all:
        description: 'push every actor, not just changed ones'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apify actors — push changed, price, publish
        run: node ventures/gankdat/scripts/publish-actors.mjs ${{ inputs.all && '--all' || '' }}
        env:
          DIFF_RANGE: ${{ github.event.before }}..${{ github.sha }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GANKDAT_INTERNAL_API_KEY: ${{ secrets.GANKDAT_INTERNAL_API_KEY }}
      - name: MCP registry — publish if server.json is newer
        run: bash ventures/gankdat/scripts/registry-publish.sh
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
