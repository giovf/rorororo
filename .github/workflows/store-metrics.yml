name: store metrics

# Store listing numbers for every venture with a STORE.md (Chrome Web Store, Firefox Add-ons,
# Figma Community), written from a runner because the 07:00 metrics routine's sandbox cannot
# reach the stores and wrote `not live yet` for ten days of live listings (foundry item
# store-metrics-in-ci, 2026-09-30). Runs before that routine, which then only reads the row.
# GitHub's cron is best-effort, so the job also runs on pushes to main, where it only writes a
# row if today's is missing (STORE_METRICS_IF_MISSING).
on:
  schedule:
    - cron: '45 6 * * *' # daily, after gankdat metrics (06:30), before the 07:00 metrics routine
  push:
    branches: [main]
    paths-ignore: ['ventures/*/RESEARCH.md', 'ventures/*/STORE.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Append today's Daily check row to each venture's RESEARCH.md
        run: node --disable-warning=ExperimentalWarning scripts/store-metrics.ts
        env:
          STORE_METRICS_IF_MISSING: ${{ github.event_name == 'push' && '1' || '' }}
      - name: Commit
        run: |
          git config user.name "foundry-metrics[bot]"
          git config user.email "info@gankdat.com"
          git add ventures/*/RESEARCH.md ventures/*/STORE.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "store-metrics: $(date -u +%F) daily check"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
