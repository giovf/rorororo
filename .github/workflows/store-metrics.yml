name: store metrics

# Store listing numbers for every venture with a STORE.md (Chrome Web Store, Firefox Add-ons,
# Figma Community), written from a runner because the 07:00 metrics routine's sandbox cannot
# reach the stores and wrote `not live yet` for ten days of live listings (foundry item
# store-metrics-in-ci, 2026-09-30). Runs before that routine, which then only reads the row.
# GitHub's cron is best-effort, so until 2026-10-12 the job also ran on pushes to main, filling a
# missing row (STORE_METRICS_IF_MISSING). Dropped (foundry poller-push-triggers): 13 of the 100
# Actions runs in the 10.8 h to 2026-10-12 00:03 UTC were this job started by a push, a full minute
# billed each, and five of their `daily check` fill commits on 10-11 started `owner notes` again.
# The cron below and the 07:00 metrics routine's workflow_dispatch (foundry cron-drift-dispatch-row,
# 2026-10-10) write the row; a push never does. Since 2026-10-07 a second step adds the Search
# Console reading (`search: …`) to the same rows (until 2026-10-16 also to gankdat's Daily numbers
# row, which did not exist yet when this job ran — gankdat metrics reads its own since then, foundry
# search-console-gankdat-row-race); since 2026-10-11 a third fills the extensions' Sales column from
# the licence Worker's KV records (`sales: …`).
# Odd minute (foundry metrics-crons-off-the-half-hour, 2026-10-09): on `45 6` the scheduled run
# started 12:52–15:17 UTC every day 10-04..10-08; GitHub delays crons on busy minutes most.
on:
  schedule:
    - cron: '52 6 * * *' # daily, after gankdat metrics (06:37), before the 07:00 metrics routine
  workflow_dispatch:

permissions:
  contents: write

# Concurrency (2026-10-05, foundry ci-runs-never-acquired): a newer commit cancels this workflow's queued or
# running run for the same event and ref. On 2026-10-05 one push run in three was cancelled by GitHub 15 min
# after start with no steps (never acquired by a runner) while each burn-down push queued six more runs behind
# the dead ones. Scheduled and manual runs keep their own group, so a push never cancels the cron run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Skip the late scheduled run when the dispatch already wrote today's row
        # foundry metrics-cron-short-circuit (2026-10-14): since cron-drift-dispatch-row (10-10) the
        # 07:00 routine dispatches this job when the day's row is missing, and GitHub still starts the
        # cron 7–9 h late (16:10 on 10-12, 14:36 on 10-13), repeating the whole job for nothing — the writer
        # leaves an existing row alone. A SCHEDULED run that finds today's row already on main ends
        # here (every later step is skipped on `steps.row.outputs.skip`); a dispatched run always does
        # the work, and the schedule stays the fallback for a morning nothing dispatched.
        id: row
        if: github.event_name == 'schedule'
        run: |
          today=$(date -u +%F)
          missing=0
          for store in ventures/*/STORE.md; do
            grep -q "^| $today | Daily check |" "$(dirname "$store")/RESEARCH.md" || missing=1
          done
          if [ "$missing" = 0 ]; then
            echo "::notice::today's Daily check rows ($today) are already on main; the late scheduled run has nothing to write"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.row.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Append today's Daily check row to each venture's RESEARCH.md
        if: steps.row.outputs.skip != 'true'
        run: node --disable-warning=ExperimentalWarning scripts/store-metrics.ts
      - name: Search Console reading on today's rows (impressions, clicks, indexing verdicts)
        if: steps.row.outputs.skip != 'true'
        # scripts/search-console.ts (foundry search-console-api-reading, 2026-10-07): a read-only
        # service account (scope webmasters.readonly; owner action 020 adds it as a Restricted user on
        # the gankdat.com and apps.gankdat.com properties and pastes its JSON key as the secret) reads
        # 7-day impressions/clicks per page and URL-inspects the /stats and comparison pages, then adds
        # `search: …` to each venture's Daily check row written above. gankdat's Daily numbers row is
        # read by the gankdat metrics job since 2026-10-16 (foundry search-console-gankdat-row-race:
        # this job ran two minutes before that row existed, so the clause never landed), hence the
        # venture list below — a new landing venture is added here and in the script's VENTURES.
        # Without the secret the rows read `search: n/a (<reason>)` — never a gap.
        # Only node builtins; a failure must not lose the store rows, hence continue-on-error.
        run: node --disable-warning=ExperimentalWarning scripts/search-console.ts
        continue-on-error: true
        env:
          SEARCH_CONSOLE_KEY: ${{ secrets.SEARCH_CONSOLE_KEY }}
          STORE_METRICS_VENTURES: highlight-keep,read-focus,variables-toolkit
      - name: Licence sales on today's rows (keys issued and activations per extension)
        if: steps.row.outputs.skip != 'true'
        # scripts/license-sales.ts (foundry metrics-extension-sales, 2026-10-11): lists the licence
        # Worker's `license:*` records in the LICENSES KV namespace with the deploy token (the same
        # CLOUDFLARE_API_TOKEN the gankdat jobs use; its template carries Workers KV Storage, action
        # 003) and fills the Sales column + a `sales: …` clause on each extension's Daily check row.
        # Without the scope the rows read `sales: n/a (<reason>)` — never a gap. continue-on-error for
        # the same reason as the step above: the store rows must land whatever this one does.
        run: node --disable-warning=ExperimentalWarning scripts/license-sales.ts
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Commit
        if: steps.row.outputs.skip != 'true'
        run: |
          git config user.name "foundry-metrics[bot]"
          git config user.email "info@gankdat.com"
          git add ventures/*/RESEARCH.md ventures/*/STORE.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "store-metrics: $(date -u +%F) daily check"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
