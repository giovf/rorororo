name: run watchdog

# Manual only since 2026-10-12 (foundry actions-floor-trim): the watchdog and the CI-minutes guard
# run inside `notify owner` on every routine push and on its 6-hourly schedule (see that file).
# GitHub delivered this job's own 2-hourly cron about half the time and hours late, and each fire
# was a billed minute (28/week). This file stays for a by-hand run from the Actions tab; the script
# it runs (scripts/run-watchdog.ts) is unchanged and its docs/RUNS.md line is still the dedupe record.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: run-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --disable-warning=ExperimentalWarning scripts/run-watchdog.ts
      - name: CI-minutes guard (warns in RUNS.md when the month projects past 1,700)
        run: node scripts/actions-minutes.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "foundry-watchdog[bot]"
          git config user.email "info@gankdat.com"
          git add docs/RUNS.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "watchdog: missed slot / ci-minutes"
          git pull --rebase origin main
          git push origin HEAD:main
