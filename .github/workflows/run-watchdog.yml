name: run watchdog

# DRAFT, not active: routine tokens (git and the GitHub API alike) lack the `workflow` scope, so the
# build routine could not create this file under .github/workflows/ (2026-09-25). The interactive
# session moves it there unchanged; the script it runs is already on main and tested.

# A scheduled routine that never ran (usage limit, stalled sandbox) leaves nothing on main.
# This job checks every routine slot in docs/SCHEDULERS.md for its trace (a tagged
# docs/RUNS.md line or a known commit subject within 2 h) and appends one
# `| watchdog | missed: …` line per silent slot; the `notify owner` job sends it to Telegram.
# GitHub's cron is best-effort, so it also runs on pushes to main (routines push several times
# a day); its own commit touches only docs/RUNS.md and is ignored, so it cannot loop.
on:
  schedule:
    - cron: '40 */2 * * *' # every 2 h (was hourly + every push: 128 runs/week; CI minutes are capped on a private repo)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: run-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --disable-warning=ExperimentalWarning scripts/run-watchdog.ts
      - name: CI-minutes guard (warns in RUNS.md when the month projects past 1,700)
        run: node scripts/actions-minutes.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "foundry-watchdog[bot]"
          git config user.email "info@gankdat.com"
          git add docs/RUNS.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "watchdog: missed slot / ci-minutes"
          git pull --rebase origin main
          git push origin HEAD:main
