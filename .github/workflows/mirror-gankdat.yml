name: mirror gankdat

# Keeps the public mirror github.com/giovf/gankdat equal to ventures/gankdat minus internal files
# (scripts/mirror-gankdat.ts; owner 2026-10-16: the monorepo goes private, only the service is
# public). PR_TOKEN (classic, public_repo) pushes to the owner's public repository.
on:
  push:
    branches: [main]
    paths: ['ventures/gankdat/**', 'scripts/mirror-gankdat.ts', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build and push the mirror
        run: node --disable-warning=ExperimentalWarning scripts/mirror-gankdat.ts
        env:
          MIRROR_PUSH: '1'
          MIRROR_TOKEN: ${{ secrets.PR_TOKEN }}
