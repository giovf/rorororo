name: gankdat

on:
  push:
    branches: [main, feature/data-retrieval-and-manipulation]
    paths: ['ventures/gankdat/**', '.github/workflows/gankdat.yml', 'package-lock.json']
  pull_request:
    paths: ['ventures/gankdat/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w @foundry/gankdat

  deploy:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/gankdat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Deploy to Cloudflare
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test
        # Retries: the new version takes a few seconds to reach every edge, and the
        # runner's IP may get a one-off challenge. Prints status + body on failure.
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' -A 'gankdat-ci-smoke/1.0' https://gankdat.com/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "healthy: $(head -c 120 /tmp/health.json)"; exit 0
            fi
            echo "attempt $i: http $code"; head -c 300 /tmp/health.json; echo
          done
          exit 1
