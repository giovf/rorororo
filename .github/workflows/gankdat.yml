name: gankdat

on:
  push:
    branches: [main]
    paths:
      - 'ventures/gankdat/**'
      - '!ventures/gankdat/docs/**'
      - '!ventures/gankdat/**/*.md'
      - '!ventures/gankdat/apify/**'
      - '.github/workflows/gankdat.yml'
      - 'package-lock.json'
  pull_request:
    paths: ['ventures/gankdat/**']
  workflow_dispatch:

# One job (2026-10-12, foundry actions-floor-trim): the gate and the deploy used to be two jobs, each
# with its own checkout and `npm ci` and each billed rounded up to a whole minute — 2.4 billed minutes
# per push for ~1.3 of work. The deploy steps now follow the gate on the same runner and are skipped on
# a pull request. The installed tree is restored from the lockfile-keyed cache (`npm ci` on a miss).
jobs:
  gankdat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: |
            node_modules
            */*/node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check -w @foundry/gankdat
      - name: Apply D1 migrations (before the code that needs them)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ventures/gankdat
        run: npx wrangler d1 migrations apply faceless-api --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ventures/gankdat
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify deployment via API
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # gankdat.com sits behind a Cloudflare managed challenge for low-reputation IPs
        # (GitHub runners get "Just a moment…" 403s), so the edge cannot be smoke-tested
        # from here. Check the Workers API instead: the newest deployment must be fresh.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          latest=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/37e56f3ce4dfe49919e85d4380467f44/workers/scripts/faceless-api/deployments" \
            | jq -r '[.result.deployments[].created_on] | sort | last')
          echo "latest deployment: $latest"
          age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
          echo "age: ${age}s"
          [ "$age" -lt 900 ]
