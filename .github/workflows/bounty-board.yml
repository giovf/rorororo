name: bounty board

# Daily board of open-source issues with a posted cash bounty (oss-bounties `bounty-scanner`,
# 2026-10-11; owner direction: collect money already on offer). scripts/bounty-scanner.ts reads
# GitHub's search API with the job's own token, drops sandbox and security repositories and issues
# that read as security findings, ranks the rest and writes docs/bounties/BOARD.md plus up to three
# oss-bounties queue items (blocked until PR_TOKEN exists, so the build routine can push a fork).
# Odd minute like the other crons (GitHub delays busy-minute schedules most).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Scan and rank open bounties
        run: node --disable-warning=ExperimentalWarning scripts/bounty-scanner.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TOKEN_PRESENT: ${{ secrets.PR_TOKEN != '' && '1' || '' }}
      - name: Commit
        run: |
          git config user.name "foundry-bounties[bot]"
          git config user.email "info@gankdat.com"
          git add docs/bounties/BOARD.md docs/pipeline/queues/oss-bounties.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "bounties: $(date -u +%F) board"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
