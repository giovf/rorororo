name: check

# Every push to main runs the full gate. A red main means an agent pushed incomplete or broken
# work (e.g. a run cut off by a usage limit); the daily build routine's first duty is to fix it.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
