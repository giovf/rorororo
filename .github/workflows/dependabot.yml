name: dependabot

# Runs the full gate on a Dependabot pull request and merges it when green and it is a
# minor/patch group (owner 2026-10-16: dependency currency without an attended session per bump).
# Majors stay open for an attended session. `check.yml` does not run on pull requests, so the
# gate runs here.
# Since 2026-10-18 (foundry dependabot-gate-on-pr-author) the job keys on the PR's author, not on
# the actor of the push: a routine that fixes the code on main and merges main into the Dependabot
# branch re-runs the gate and the auto-merge itself. The sandbox cannot command Dependabot — the
# GitHub tool masks @-mentions, so a posted `@dependabot rebase` is never read (PR #5, 00:22).
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  gate-and-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Merge minor/patch groups when green
        if: contains(github.event.pull_request.title, 'minor-and-patch') || contains(github.event.pull_request.title, 'actions group')
        run: gh pr merge --squash --auto "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
