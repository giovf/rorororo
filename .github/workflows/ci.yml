name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # dry-run deploy validates wrangler config + bundle

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Deploy stays blocked-by-config until the Cloudflare account exists
      # (PRD open question #2): without the secret the job succeeds as a no-op
      # instead of failing CI. Real deploys are an ask-first op per CLAUDE.md.
      - name: Check deploy secret
        id: secret
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set - skipping deploy (expected pre-launch)."
          fi
      - uses: actions/setup-node@v6
        if: steps.secret.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secret.outputs.available == 'true'
      - name: Deploy to Cloudflare
        if: steps.secret.outputs.available == 'true'
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
