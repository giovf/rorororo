name: notify owner

# Sends new `owner:` lines, new action files and new docs/RUNS.md lines to the owner's phone.
# Since 2026-09-30 (foundry `notify-owner-cursor`) the job diffs from the commit recorded in
# docs/ops/NOTIFIED.md to the tip of main and commits the new cursor only after every channel
# accepted every message, so a crashed or refused run loses nothing: the next push resends.
# The cursor push uses GITHUB_TOKEN (triggers no workflow) and carries the skip-ci marker besides.
# Never write that marker in a hand-written commit message, subject or body: the 2026-09-30 21:30
# commit that shipped this file mentioned it in its body and GitHub ran nothing on the push.
# Since 2026-10-12 (foundry poller-push-triggers) the job also polls the Telegram bot for owner
# notes, the per-push half of `owner notes` (whose own push trigger is gone): one billed minute
# instead of two per routine push, and the notes land with the cursor commit. The hourly
# `owner notes` cron still polls between pushes.
# Since 2026-10-12 (foundry actions-floor-trim) the run watchdog rides here too: every routine push
# already starts this job, and GitHub delivered the watchdog's own 2-hourly cron about half the time,
# hours late. The watchdog and the CI-minutes guard run first and commit their docs/RUNS.md lines
# and push them first (skip-ci marker: nothing else fires), so the notify step below sends them in
# the same run and the cursor it records is a commit that stays on main; a 6-hourly schedule keeps
# the silence detector alive when no routine pushes at all (the case it exists for).
on:
  push:
    branches: [main]
    paths: ['docs/ALERTS.md', 'docs/RUNS.md', 'docs/for-owner/actions/**']
  schedule:
    - cron: '40 */6 * * *' # watchdog safety net between pushes (was `40 */2` in run-watchdog.yml)
  workflow_dispatch: # resend everything since the cursor (e.g. after moving it back by hand)

permissions:
  contents: write
  actions: read # scripts/actions-minutes.mjs reads the week's runs

concurrency:
  group: notify-owner
  cancel-in-progress: false # runs are serialised so two pushes never send the same lines twice

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the tip, not github.sha: everything since the cursor goes out in one run
          fetch-depth: 0 # the cursor may be many commits back
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run watchdog and CI-minutes guard (pushed first, sent by the next step)
        # Must never block the notifications: a failing script only skips its lines, a failed push
        # is retried by the next run (the line is appended again, the dedupe record is the line on
        # main), and a half-written docs/RUNS.md is reset so the cursor commit below can rebase.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "foundry-watchdog[bot]"
          git config user.email "info@gankdat.com"
          node --disable-warning=ExperimentalWarning scripts/run-watchdog.ts || echo "::warning::run-watchdog failed"
          node scripts/actions-minutes.mjs || echo "::warning::actions-minutes failed"
          git add docs/RUNS.md
          git checkout -- docs/RUNS.md
          git diff --cached --quiet && { echo "watchdog: nothing to report"; exit 0; }
          git commit -m "watchdog: missed slot / ci-minutes [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::warning::watchdog push failed — the next run appends the line again"
          git reset -q --hard origin/main
      - run: node --disable-warning=ExperimentalWarning scripts/notify-owner.ts
        env:
          PUSH_BEFORE: ${{ github.event.before }} # fallback left end when the cursor does not resolve
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      - name: Poll the Telegram bot for owner notes (the per-push half of owner notes, 2026-10-12)
        # scripts/owner-notes.mjs appends new messages to docs/OWNER-NOTES.md and advances the
        # offset stored in that file; committed below with the cursor. Must never block the
        # notifications: a Telegram error or missing secret only skips this step.
        run: node scripts/owner-notes.mjs
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit the cursor (and any owner notes)
        if: success()
        run: |
          git config user.name "foundry-notify[bot]"
          git config user.email "info@gankdat.com"
          git add docs/ops/NOTIFIED.md docs/OWNER-NOTES.md
          if git diff --cached --quiet; then
            echo "cursor unchanged, no new notes"
          else
            msg="notify: cursor $(git rev-parse --short HEAD) sent"
            if git diff --cached --quiet -- docs/ops/NOTIFIED.md; then msg="notes: owner notes from Telegram"
            elif ! git diff --cached --quiet -- docs/OWNER-NOTES.md; then msg="$msg + owner notes"; fi
            git commit -m "$msg [skip ci]"
          fi
          [ "$(git rev-list --count origin/main..HEAD)" = 0 ] && { echo "nothing to push"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push failed after 4 tries — the next run resends (duplicates, never loss)"
          exit 1
