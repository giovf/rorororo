<!-- @dsCard group="C — Clean SaaS" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C — Components</title>
<style>
:root{--bg:#fafbfd;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--card:#ffffff;--indigo:#4f46e5;--ok:#059669;--danger:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:26px 0 12px;font-weight:700}
h3:first-child{margin-top:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 20px;border-radius:12px;background:linear-gradient(135deg,var(--indigo),#6366f1);color:#fff;font-weight:600;border:0;font-size:.93rem;cursor:pointer;box-shadow:0 4px 14px rgba(79,70,229,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.06)}
.btn.danger{background:var(--card);color:var(--danger);border:1px solid #fecaca;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill i{width:6px;height:6px;border-radius:50%;display:inline-block}
.pill.ok{background:#ecfdf5;color:var(--ok)}.pill.ok i{background:var(--ok)}
.pill.indigo{background:#eef2ff;color:var(--indigo)}.pill.indigo i{background:var(--indigo)}
.pill.gray{background:#f1f5f9;color:var(--muted)}.pill.gray i{background:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:430px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.card h4{margin:0 0 6px;font-size:1rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.chips code{display:inline-block;background:#f1f5f9;border-radius:7px;padding:3px 9px;font:.79rem ui-monospace,Menlo,monospace;margin:9px 6px 0 0;color:#334155}
input{padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-size:.95rem;min-width:250px;box-shadow:inset 0 1px 2px rgba(15,23,42,.04)}
input:focus{outline:3px solid #e0e7ff;border-color:var(--indigo)}
.banner{border:1px solid #a7f3d0;background:#ecfdf5;border-radius:12px;padding:13px 16px;font-size:.93rem;max-width:520px;color:#065f46}
.bar{height:9px;border-radius:999px;background:#f1f5f9;overflow:hidden;max-width:420px}
.bar span{display:block;height:100%;width:62%;border-radius:999px;background:linear-gradient(90deg,var(--indigo),#0ea5e9)}
</style>
</head>
<body>
  <h3>Buttons</h3>
  <div class="row"><button class="btn">Get your API key</button><button class="btn ghost">Manage billing</button><button class="btn danger">Revoke</button></div>
  <h3>Status pills</h3>
  <div class="row"><span class="pill ok"><i></i>Active</span><span class="pill indigo"><i></i>Saver</span><span class="pill gray"><i></i>Free</span></div>
  <h3>Dataset card</h3>
  <div class="card"><h4>UK Tenders <span style="font-weight:500;color:var(--muted)">· Procurement</span></h4><p>Public-sector tenders from Find a Tender's official OCDS feed, one clean row per notice.</p><p class="chips"><code>buyer</code><code>status</code><code>value_amount_min</code><code>q</code></p></div>
  <h3>Input</h3>
  <div class="row"><input placeholder="you@company.com"><button class="btn">Email me a link</button></div>
  <h3>Banner &amp; usage</h3>
  <div class="banner">✅ Payment successful — your plan is now active.</div>
  <div style="height:12px"></div>
  <div class="bar"><span></span></div>
</body>
</html>
